    environment: pr
    strategy:
      matrix:
        container: [blobfuse-launcher, s3fs-launcher, ccr-init, ccr-secrets, ccr-proxy-ext-processor, ccr-client-proxy, code-launcher, identity, otel-collector, ccr-governance-opa-policy, ccr-artefacts, cleanroom-csi-driver]
      # Prevent Github from cancelling other jobs of the matrix if one of them fails.
      fail-fast: false
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
