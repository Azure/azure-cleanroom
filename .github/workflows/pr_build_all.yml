  publish-release-metadata-catalog:
    # Run after whatever subset of builds ran (a CCF-only build still needs a catalog); publish
    # as long as none of the builds that DID run failed. -skipMissing yields a valid partial
    # catalog covering exactly the images that were built. Skipped needs don't block (the status
    # function makes this if always-evaluated).
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') }}
    needs:
      - build-ccr-governance-containers
      - build-ccr-proxy-containers
      - build-ccr-skr-containers
      - build-ccr-tools-containers
      - build-cvm-containers
      - build-k8s-node-containers
      - build-ccf-containers
      - build-cgs-containers
      - build-ccr-containers
      - build-ccf-container-policies
