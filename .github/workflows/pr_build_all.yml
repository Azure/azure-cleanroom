      - build-frontend-service-containers
      - build-frontend-service-container-policies
      - build-azcliext-cleanroom
    runs-on: ["self-hosted", "1ES.Pool=azure-cleanroom-public", "1ES.JobId=publish-release-metadata-catalog-${{ github.run_id }}-${{ github.run_attempt }}"]
    environment: pr
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      RUN_ID: ${{ github.run_id }}
      JOB_ID: ${{ github.job }}
      RUN_ATTEMPT: ${{ github.run_attempt }}
      USE_PREPROVISIONED_OIDC: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-docker-on-data-disk

      - name: Login to Azure and refresh token
        uses: ./.github/actions/login-to-azure
        env:
          CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        shell: pwsh
        run: az acr login -n ${{ vars.ACR_URL }}

      - name: Install powershell-yaml
        shell: pwsh
        run: Install-Module -Name powershell-yaml -Force

      # All images/policies are now pushed; publish the release-metadata catalog once as an OCI
      # artifact (oci://<acr>/release-metadata). Refs point at the ACR (-publishRepo), not MCR,
      # since these images aren't mirrored to MCR. The chart version is derived from the tag
      # (Get-SemanticVersionFromTag). -skipMissing tolerates any image not built in this run.
      - name: Publish release-metadata catalog
        shell: pwsh
        run: pwsh ./build/build-release-metadata-chart.ps1 -repo ${{ vars.ACR_URL }} -publishRepo ${{ vars.ACR_URL }} -tag ${{ github.run_id }} -push -skipMissing -includeDevImages

  generate-dev-up-env:
    if: ${{ inputs.build-groups != '' }}
    runs-on: ["self-hosted", "1ES.Pool=azure-cleanroom-public", "1ES.JobId=generate-dev-up-env-${{ github.run_id }}-${{ github.run_attempt }}"]
    environment: pr
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ inputs.ref }}

      - name: Generate dev-up.env
        shell: pwsh
        run: |
          pwsh ./build/onebox/generate-dev-up-env.ps1 `
            -repo ${{ vars.ACR_URL }} `
            -tag ${{ github.run_id }} `
            -outDir ${{ runner.temp }}/dev-up-env

      - name: Upload dev-up.env artifact
        uses: actions/upload-artifact@v4
        with:
          name: dev-up-env
          path: ${{ runner.temp }}/dev-up-env/dev-up.env
