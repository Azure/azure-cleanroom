name: "PR Validation: Build"

on:
  workflow_call:
    inputs:
      # Comma-separated list of build groups to run (e.g., "build-ccr-governance-containers,build-cgs-containers").
      # Use "all" (default) to run every build group.
      build-groups:
        type: string
        required: false
        default: "all"
      # Git ref (branch, tag, or commit SHA) whose product code should be built.
      # Empty (default) builds the ref that triggered the caller workflow.
      ref:
        type: string
        required: false
        default: ""

permissions:
  contents: read  # This is required for actions/checkout
  checks: write   # This is required to generate the test report
  id-token: write # This is required for generating OIDC access token

# # When a new revision is pushed to a PR, cancel all in-progress CI runs for that
# # PR. See https://docs.github.com/en/actions/using-jobs/using-concurrency
# concurrency:
#   group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
#   cancel-in-progress: true

jobs:
  build-ccr-governance-containers:
    if: ${{ inputs.build-groups == 'all' || contains(inputs.build-groups, 'build-ccr-governance-containers') }}
    runs-on: ["self-hosted", "1ES.Pool=azure-cleanroom-public", "1ES.JobId=build-ccr-governance-containers-${{ matrix.container }}-${{ github.run_id }}-${{ github.run_attempt }}"]
    environment: pr
    strategy:
      matrix:
        container: [ccr-governance, ccr-governance-virtual]
      fail-fast: false
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      RUN_ID: ${{ github.run_id }}
      JOB_ID: ${{ github.job }}
      RUN_ATTEMPT: ${{ github.run_attempt }}
      USE_PREPROVISIONED_OIDC: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ inputs.ref }}

      - uses: ./.github/actions/setup-docker-on-data-disk

      - name: Add docker user
        shell: bash
        run: sudo usermod -aG docker $USER

      - name: Login to Azure and refresh token
        uses: ./.github/actions/login-to-azure
        env:
          CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        shell: pwsh
        run: az acr login -n ${{ vars.ACR_URL }}

      - name: Build governance containers
        run: pwsh ./build/onebox/build-containers.ps1 -tag ${{ github.run_id }} -repo ${{ vars.ACR_URL }} -containers ${{ matrix.container }}

  build-ccr-proxy-containers:
    if: ${{ inputs.build-groups == 'all' || contains(inputs.build-groups, 'build-ccr-proxy-containers') }}
    runs-on: ["self-hosted", "1ES.Pool=azure-cleanroom-public", "1ES.JobId=build-ccr-proxy-containers-${{ matrix.container }}-${{ github.run_id }}-${{ github.run_attempt }}"]
    environment: pr
    strategy:
      matrix:
        container: [ccr-proxy]
      fail-fast: false
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      RUN_ID: ${{ github.run_id }}
      JOB_ID: ${{ github.job }}
      RUN_ATTEMPT: ${{ github.run_attempt }}
