  build-cleanroom-cluster-containers:
    if: ${{ inputs.build-groups == 'all' || contains(inputs.build-groups, 'build-cleanroom-cluster-containers') }}
    runs-on: ["self-hosted", "1ES.Pool=azure-cleanroom-public", "1ES.JobId=build-cleanroom-cluster-containers-${{ matrix.container }}-${{ github.run_id }}-${{ github.run_attempt }}"]
