name: TPC-DS Analytics Stresstest
run-name: TPC-DS Stresstest - ${{ github.event_name == 'schedule' && (github.event.schedule == '0 19 * * 0' && 'SF700 small D4ds_v5 x3 vn2x2 p8' || github.event.schedule == '0 19 * * 1' && 'SF1000 large D4ds_v5 x3 vn2x2 p2' || github.event.schedule == '0 19 * * 2' && 'SF2000 large D4ds_v5 x3 vn2x2 p2' || github.event.schedule == '0 19 * * 3' && 'SF700 small D8ds_v5 x3 vn2x4 p16' || github.event.schedule == '0 19 * * 4' && 'SF1000 large D8ds_v5 x3 vn2x4 p4' || github.event.schedule == '0 19 * * 5' && 'SF2000 large D8ds_v5 x3 vn2x4 p4' || github.event.schedule == '0 19 * * 6' && 'SF2000 large D8ds_v5 x4 vn2x6 p6' || 'scheduled') || format('SF{0} {1} {2} x{3} vn2x{4} p{5}', inputs.scaleFactor || '700', inputs.scaleSku || 'auto', inputs.aksNodeVmSize || 'Standard_D8ds_v5', inputs.aksNodeCount || '3', inputs.analyticsPoolNodeCount || '3', inputs.parallel || 'auto') }} x${{ github.event_name == 'schedule' && '1' || (inputs.iterations || '1') }}

on:
  schedule:
    # Weekly TPC-DS stress matrix: one run per day (7 slots). Cron fires in UTC; the
    # run maps to an IST day slot (00:30 IST = 19:00 UTC the previous day).
    # github.event.schedule (the cron string) selects the slot in run-name and in the
    # "Resolve run parameters" step. Slot -> config (SKU / nodeCount / vn2 / SF / parallel):
    #   Mon SF700 small D4 x3 vn2x2 p8   | Tue SF1000 large D4 x3 vn2x2 p2
    #   Wed SF2000 large D4 x3 vn2x2 p2  | Thu SF700 small D8 x3 vn2x4 p16
    #   Fri SF1000 large D8 x3 vn2x4 p4  | Sat SF2000 large D8 x3 vn2x4 p4
    #   Sun SF2000 large D8 x4 vn2x6 p6
    - cron: "0 19 * * 0"  # IST Mon 00:30 -> SF700 small D4 x3 vn2x2 p8
    - cron: "0 19 * * 1"  # IST Tue 00:30 -> SF1000 large D4 x3 vn2x2 p2
    - cron: "0 19 * * 2"  # IST Wed 00:30 -> SF2000 large D4 x3 vn2x2 p2
    - cron: "0 19 * * 3"  # IST Thu 00:30 -> SF700 small D8 x3 vn2x4 p16
    - cron: "0 19 * * 4"  # IST Fri 00:30 -> SF1000 large D8 x3 vn2x4 p4
    - cron: "0 19 * * 5"  # IST Sat 00:30 -> SF2000 large D8 x3 vn2x4 p4
    - cron: "0 19 * * 6"  # IST Sun 00:30 -> SF2000 large D8 x4 vn2x6 p6
  workflow_dispatch:
    inputs:

      ref:
        description: "Git branch, tag, or commit SHA to build and test (blank = default branch)."
        required: false
        type: string
      scaleFactor:
        description: "TPC-DS scale factor: 10|100|300|700|1000|2000 (blank = repo default)."
        required: false
        type: string
      queryIds:
        description: Space-separated TPC-DS query IDs (blank = repo default).
        required: false
        type: string
      dataFormats:
        description: Comma-separated formats to provision and query, e.g. csv,parquet (blank = repo default).
        required: false
        type: string
      iterations:
        description: Iterations per query, per format (blank = repo default).
        required: false
        type: string
      parallel:
        description: Parallel query submissions
        required: false
        type: string
      scaleSku:
        description: "Spark scaleSku tier override: auto|small|medium|large (auto = derive from scaleFactor: sf<=700 small, sf1000 large, sf2000 large)."
        required: false
        type: choice
        options:
          - "auto"
          - "small"
          - "medium"
          - "large"
        default: "auto"
      aksNodeVmSize:
        description: "AKS agent-pool VM size (provider nodeVmSize), e.g. Standard_D4ds_v5 or Standard_D8ds_v5 (blank = Standard_D8ds_v5)."
        required: false
        type: string
      aksNodeCount:
        description: "AKS agent-pool initial node count (provider initialNodeCount), e.g. 2 or 3 (blank = 3)."
        required: false
        type: string
      analyticsPoolNodeCount:
        description: "VN2 analytics workload-pool node count (blank = 3)."
        required: false
        type: string
      publisherResourceGroup:
        description: Existing publisher RG containing pre-loaded TPC-DS datasets.
        required: false
        type: string
        default: "cl-ob-publisher-tpcds-analytics"
      consumerResourceGroup:
        description: Existing consumer RG containing pre-loaded TPC-DS datasets.
        required: false
        type: string
        default: "cl-ob-consumer-tpcds-analytics"
      retainResources:
        description: "Retain tagged ephemeral resource groups at end of run (default: delete them)."
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  checks: write
  id-token: write

env:
  # NOTE: keep these defaults in sync with the run-name fallbacks above
  # (SF/iterations/parallel) — run-name cannot read env, so those are literals.
  # Parallel query submissions scale with the SKU tier (heavier SKU -> fewer in
  # flight due to confidential-ACI capacity): small (SF 10/100/300/700) = 10,
  # large (SF 1000 & 2000) = 3. SF1000 uses large (not medium): on medium the
  # spill-heavy queries (query64/query14a) exhaust the ~50 GB/executor ephemeral
  # disk and fail with 'No space left on device' (run 33733399639).
  DEFAULT_SCALE_FACTOR: "700"
  DEFAULT_QUERY_IDS: "query1 query14 query24 query64 query72"
  DEFAULT_DATA_FORMATS: "csv,parquet"
  DEFAULT_ITERATIONS: "1"
  DEFAULT_PARALLEL: "10"
  DEFAULT_MEDIUM_SKU_PARALLEL: "6"
  DEFAULT_LARGE_SKU_PARALLEL: "3"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/pr_build_all.yml
    with:
      ref: ${{ inputs.ref }}

  tpcds-stresstest:
    runs-on: ["self-hosted", "1ES.Pool=azure-cleanroom-public", "1ES.JobId=tpcds-stresstest-${{ github.run_id }}-${{ github.run_attempt }}"]
    needs: [build]
    environment: pr
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      RUN_ID: ${{ github.run_id }}
      JOB_ID: ${{ github.job }}
      RUN_ATTEMPT: ${{ github.run_attempt }}
      USE_PREPROVISIONED_OIDC: "true"
      # The cron string that triggered a scheduled run; the resolve step maps it to a
      # slot in the weekly matrix. Empty for manual dispatch.
      SCHEDULE_CRON: ${{ github.event.schedule }}
      SCALE_FACTOR: ${{ github.event.inputs.scaleFactor }}
      QUERY_IDS: ${{ github.event.inputs.queryIds }}
      DATA_FORMATS: ${{ github.event.inputs.dataFormats }}
      ITERATIONS: ${{ github.event.inputs.iterations }}
      PARALLEL: ${{ github.event.inputs.parallel }}
      SCALE_SKU: ${{ github.event.inputs.scaleSku }}
      PUBLISHER_RESOURCE_GROUP: ${{ github.event.inputs.publisherResourceGroup || 'cl-ob-publisher-tpcds-analytics' }}
      CONSUMER_RESOURCE_GROUP: ${{ github.event.inputs.consumerResourceGroup || 'cl-ob-consumer-tpcds-analytics' }}
      DEPLOYMENT_CONFIG_DIR: ${{ github.workspace }}/test/onebox/workload-samples-aks/generated
      KUBECONFIG_PATH: ${{ github.workspace }}/test/onebox/workload-samples-aks/generated/cl-cluster/k8s-credentials.yaml
      STRESSTEST_ROOT: ${{ github.workspace }}/test/onebox/multi-party-collab/analytics-load-testing-TPC-DS/stresstest
      TPCDS_OUT_DIR: ${{ github.workspace }}/test/onebox/workload-samples-aks/generated/tpcds-analytics
      LOCATION: centralindia
      # AKS agent-pool VM size (overridable via the aksNodeVmSize input). Larger nodes
      # pack the VN2 kubelet pods (~2 vCPU each) onto fewer nodes; read by
      # cleanroom-cluster-up.ps1 -> az cleanroom cluster up --node-vm-size -> providerConfig.nodeVmSize.
      CLEANROOM_CLUSTER_NODE_VM_SIZE: ${{ github.event.inputs.aksNodeVmSize || 'Standard_D8ds_v5' }}
      # VN2 analytics workload-pool node count (overridable via analyticsPoolNodeCount;
      # read by enable-analytics-workload.ps1 -> --analytics-workload-pool-node-count).
      CLEANROOM_ANALYTICS_POOL_NODE_COUNT: ${{ github.event.inputs.analyticsPoolNodeCount || '3' }}
      # AKS agent-pool initial node count (overridable via aksNodeCount; read by
      # cleanroom-cluster-up.ps1 -> az cleanroom cluster up --initial-node-count ->
      # providerConfig.initialNodeCount). The cluster autoscaler stays enabled, seeded
      # at this initial count.
      CLEANROOM_CLUSTER_INITIAL_NODE_COUNT: ${{ github.event.inputs.aksNodeCount || '3' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          ref: ${{ inputs.ref }}

      - name: Resolve run parameters
        shell: bash
        run: |
          set -eo pipefail
          # Scheduled runs map the triggering cron (SCHEDULE_CRON = github.event.schedule)
          # to a slot in the weekly matrix and derive SF / parallel / SKU / nodeCount / vn2
          # from it. Manual dispatch uses the provided inputs (falling back to repo
          # defaults + the SKU-tier parallel below).
          apply_slot() {
            case "$1" in
              # SLOT_NC = stable agent-node count = VN2 nodes + 1 system node. VN2 pod =
              # 2.8 vCPU / 9 GiB and, with the 30-pods/node cap, system+spark consume a full
              # node, so seed NC = ceil(SLOT_VN / perNodeVn2) + 1 to avoid the +1 autoscale
              # (perNodeVn2: D4=1, D8=2). D4 vn2=2 -> 2 VN2 nodes + 1 = 3 ; D8 vn2=4 -> 2 + 1 = 3 ;
              # D8 vn2=6 -> 3 + 1 = 4.
              MON) SLOT_SF=700;  SLOT_PAR=8;  SLOT_SKU=Standard_D4ds_v5; SLOT_NC=3; SLOT_VN=2 ;;
              TUE) SLOT_SF=1000; SLOT_PAR=2;  SLOT_SKU=Standard_D4ds_v5; SLOT_NC=3; SLOT_VN=2 ;;
              WED) SLOT_SF=2000; SLOT_PAR=2;  SLOT_SKU=Standard_D4ds_v5; SLOT_NC=3; SLOT_VN=2 ;;
              THU) SLOT_SF=700;  SLOT_PAR=16; SLOT_SKU=Standard_D8ds_v5; SLOT_NC=3; SLOT_VN=4 ;;
              FRI) SLOT_SF=1000; SLOT_PAR=4;  SLOT_SKU=Standard_D8ds_v5; SLOT_NC=3; SLOT_VN=4 ;;
              SAT) SLOT_SF=2000; SLOT_PAR=4;  SLOT_SKU=Standard_D8ds_v5; SLOT_NC=3; SLOT_VN=4 ;;
              SUN) SLOT_SF=2000; SLOT_PAR=6;  SLOT_SKU=Standard_D8ds_v5; SLOT_NC=4; SLOT_VN=6 ;;
            esac
          }
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            case "$SCHEDULE_CRON" in
              "0 19 * * 0") SLOT=MON ;;
              "0 19 * * 1") SLOT=TUE ;;
              "0 19 * * 2") SLOT=WED ;;
              "0 19 * * 3") SLOT=THU ;;
              "0 19 * * 4") SLOT=FRI ;;
              "0 19 * * 5") SLOT=SAT ;;
              "0 19 * * 6") SLOT=SUN ;;
              *) SLOT="" ;;
            esac
            if [ -n "$SLOT" ]; then
              apply_slot "$SLOT"
              SCALE_FACTOR="$SLOT_SF"
              PARALLEL="$SLOT_PAR"
              ITERATIONS="1"
              CLEANROOM_CLUSTER_NODE_VM_SIZE="$SLOT_SKU"
              CLEANROOM_CLUSTER_INITIAL_NODE_COUNT="$SLOT_NC"
              CLEANROOM_ANALYTICS_POOL_NODE_COUNT="$SLOT_VN"
              echo "Scheduled slot=$SLOT -> SF=$SCALE_FACTOR parallel=$PARALLEL sku=$SLOT_SKU nodeCount=$SLOT_NC vn2=$SLOT_VN"
            fi
          fi
          SCALE_FACTOR="${SCALE_FACTOR:-$DEFAULT_SCALE_FACTOR}"
          QUERY_IDS="${QUERY_IDS:-$DEFAULT_QUERY_IDS}"
          ITERATIONS="${ITERATIONS:-$DEFAULT_ITERATIONS}"
          # Manual-dispatch parallel fallback (schedule runs already set it per slot):
          # scale with the SKU tier — small (10/100/300/700)=10, large (1000 & 2000)=3.
          if [ -z "$PARALLEL" ]; then
            case "$SCALE_FACTOR" in
              1000|2000) PARALLEL="$DEFAULT_LARGE_SKU_PARALLEL" ;;  # large (sf1000 & sf2000)
              *)         PARALLEL="$DEFAULT_PARALLEL" ;;            # small (10/100/300/700)
            esac
          fi
          DATA_FORMATS="${DATA_FORMATS:-$DEFAULT_DATA_FORMATS}"
          [ "$DATA_FORMATS" = "auto" ] && DATA_FORMATS="$DEFAULT_DATA_FORMATS"
          # scaleSku tier override (blank/auto => submit_tpcds_job.py auto-derives it
          # from the scale factor, matching the scheduled-run defaults).
          SCALE_SKU="${SCALE_SKU:-}"
          [ "$SCALE_SKU" = "auto" ] && SCALE_SKU=""
          metrics_file="$TPCDS_OUT_DIR/results/tpcds_submission_metrics_sf${SCALE_FACTOR}_run${RUN_ID}_attempt${RUN_ATTEMPT}.json"
          for kv in SCALE_FACTOR QUERY_IDS DATA_FORMATS ITERATIONS PARALLEL SCALE_SKU CLEANROOM_CLUSTER_NODE_VM_SIZE CLEANROOM_CLUSTER_INITIAL_NODE_COUNT CLEANROOM_ANALYTICS_POOL_NODE_COUNT; do
            echo "$kv=${!kv}" >> "$GITHUB_ENV"
          done
          # Retain ephemeral RGs only when explicitly requested (default: delete).
          # Automated/scheduled runs leave the flag unset -> RGs get deleted.
          RETAIN_RESOURCES="${{ inputs.retainResources }}"
          RETAIN_RESOURCES="${RETAIN_RESOURCES:-false}"
          echo "RETAIN_RESOURCES=$RETAIN_RESOURCES" >> "$GITHUB_ENV"
          echo "METRICS_FILE=$metrics_file" >> "$GITHUB_ENV"
          echo "Resolved -> SF=$SCALE_FACTOR | parallel=$PARALLEL | scaleSku=${SCALE_SKU:-auto} | sku=$CLEANROOM_CLUSTER_NODE_VM_SIZE | nodeCount=$CLEANROOM_CLUSTER_INITIAL_NODE_COUNT | vn2=$CLEANROOM_ANALYTICS_POOL_NODE_COUNT | queries='$QUERY_IDS' | formats=$DATA_FORMATS | iters=$ITERATIONS | retain=$RETAIN_RESOURCES"

      - uses: ./.github/actions/setup-docker-on-data-disk

      - name: Login to Azure
        uses: ./.github/actions/login-to-azure
        env:
          CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Setup environment (AKS + CACI CCF)
        id: setup_env
        uses: ./.github/actions/test-workloads/setup-env
        with:
          repo: ${{ vars.ACR_URL }}
          tag: ${{ github.run_id }}
          infraType: aks
          location: ${{ env.LOCATION }}
          outDir: ${{ env.DEPLOYMENT_CONFIG_DIR }}

      # Protect this run's resource groups from the subscription cleanup job that
      # prunes untagged/idle RGs. Without this, a long run's RGs can be deleted
      # mid-run ("ResourceGroupBeingDeleted"). The tag is removed at end of run
      # so the RGs become eligible for cleanup again.
      - name: Tag run resource groups SkipCleanup=true
        if: ${{ steps.setup_env.outcome == 'success' }}
        shell: bash
        env:
          RG_TAG: github_actions=${{ env.JOB_ID }}-${{ env.RUN_ID }}
        run: |
          set -eo pipefail
          for rid in $(az group list --tag "$RG_TAG" --query '[].id' -o tsv); do
            echo "SkipCleanup=true -> $rid"
            az tag update --resource-id "$rid" --operation merge --tags SkipCleanup=true -o none
          done

      - name: Print run fingerprint
        if: always()
        shell: bash
        env:
          SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          CONFIG_DIR: ${{ env.DEPLOYMENT_CONFIG_DIR }}
        run: |
          set +e
          CFG="$CONFIG_DIR/deployment-config.json"
          TAG="github_actions=${JOB_ID}-${RUN_ID}"
          CCF_EP=$(jq -r '.ccf_endpoint // "n/a"' "$CFG" 2>/dev/null || echo "n/a")

          mapfile -t RGS < <(az group list --tag "$TAG" --query '[].name' -o tsv)
          CCF_RG=$(printf '%s\n' "${RGS[@]}" | grep '^cl-ob-isv-' | head -n1)
          AKS_RG=$(printf '%s\n' "${RGS[@]}" | grep -v '^cl-ob-isv-' | head -n1)
          AKS_NAME=""
          if [ -n "$AKS_RG" ]; then
            AKS_NAME=$(az aks list --resource-group "$AKS_RG" --query '[0].name' -o tsv 2>/dev/null)
          fi

          {
            echo "## TPC-DS Stresstest - Run Fingerprint"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Subscription | \`$SUBSCRIPTION_ID\` |"
            echo "| Region | \`${LOCATION}\` |"
            echo "| AKS RG | \`${AKS_RG:-n/a}\` |"
            echo "| AKS cluster | \`${AKS_NAME:-n/a}\` |"
            echo "| CCF RG | \`${CCF_RG:-n/a}\` |"
            echo "| CCF endpoint | \`$CCF_EP\` |"
            if [ -n "$AKS_RG" ]; then
              echo ""
              echo "### Portal"
              echo "- [AKS RG](https://portal.azure.com/#@/resource/subscriptions/$SUBSCRIPTION_ID/resourceGroups/$AKS_RG)"
              echo "- [CCF RG](https://portal.azure.com/#@/resource/subscriptions/$SUBSCRIPTION_ID/resourceGroups/$CCF_RG)"
              echo ""
              echo "### Reproduce locally"
              echo '```bash'
              echo "az login"
              echo "az group list --tag '$TAG' -o table"
              echo "az aks get-credentials --resource-group '$AKS_RG' --name '$AKS_NAME'"
              echo "kubectl -n observability get secret cleanroom-grafana -o jsonpath='{.data.admin-password}' | base64 -d ; echo"
              echo "k9s --context '$AKS_NAME' -n analytics"
              echo "kubectl -n observability port-forward svc/cleanroom-grafana 3000:80"
              echo '```'
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Install az cleanroom extension
        shell: bash
        run: |
          set -eo pipefail
          for i in 1 2 3; do
            oras pull ${{ vars.ACR_URL }}/cli/cleanroom-whl:${{ github.run_id }} && break
            echo "oras pull failed (attempt $i); retrying in 5s" >&2
            sleep 5
          done
          az extension add --allow-preview true --source ./cleanroom-*-py2.py3-none-any.whl -y

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Setup Python venv for stresstest
        shell: bash
        run: |
          set -eo pipefail
          uv python install 3.12
          uv venv .venv-tpcds --python 3.12
          # shellcheck disable=SC1091
          source .venv-tpcds/bin/activate
          uv pip install -r "$STRESSTEST_ROOT/requirements.txt"
          echo "$PWD/.venv-tpcds/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$PWD/.venv-tpcds" >> "$GITHUB_ENV"

      - name: Deploy governance + cluster provider clients
        shell: bash
        run: |
          set -eo pipefail
          cfg="$DEPLOYMENT_CONFIG_DIR/deployment-config.json"
          project_name=$(jq -r '.project_name' "$cfg")
          initial_member_name=$(jq -r '.initial_member_name' "$cfg")
          ccf_endpoint=$(jq -r '.ccf_endpoint' "$cfg")
          out_dir=$(jq -r '.out_dir' "$cfg")
          cluster_provider_project_name=$(jq -r '.cluster_provider_project_name' "$cfg")

          az cleanroom governance client deploy \
            --ccf-endpoint "$ccf_endpoint" \
            --signing-key "$out_dir/ccf/${initial_member_name}_privk.pem" \
            --signing-cert "$out_dir/ccf/${initial_member_name}_cert.pem" \
            --service-cert "$out_dir/ccf/service_cert.pem" \
            --name "$project_name" \
            --env-file "$out_dir/ccf/governance-client.env"

          az cleanroom cluster provider deploy \
            --name "$cluster_provider_project_name" \
            --env-file "$out_dir/cl-cluster/cluster-provider.env"

      - name: Run TPC-DS scenario setup
        shell: bash
        run: |
          set -eo pipefail
          cfg="$DEPLOYMENT_CONFIG_DIR/deployment-config.json"
          pwsh "$STRESSTEST_ROOT/runner/run-scenario.ps1" \
            -ccfEndpoint "$(jq -r '.ccf_endpoint' "$cfg")" \
            -ownerClient "$(jq -r '.project_name' "$cfg")" \
            -ownerName "$(jq -r '.initial_member_name' "$cfg")" \
            -deploymentConfigDir "$DEPLOYMENT_CONFIG_DIR" \
            -outDir "$TPCDS_OUT_DIR" \
            -registry acr \
            -repo "${{ vars.ACR_URL }}" \
            -tag "${{ github.run_id }}" \
            -location "$LOCATION" \
            -scaleFactor "$SCALE_FACTOR" \
            -dataFormats "$DATA_FORMATS" \
            -queryIds "$QUERY_IDS" \
            -encryptionMode SSE \
            -publisherResourceGroup "$PUBLISHER_RESOURCE_GROUP" \
            -consumerResourceGroup "$CONSUMER_RESOURCE_GROUP" \
            -identitySuffix "$RUN_ID"

      - name: Submit TPC-DS queries
        continue-on-error: true
        shell: bash
        run: |
          set -eo pipefail
          mkdir -p "$TPCDS_OUT_DIR/results"
          # Keep submit non-blocking so verify_run can emit structured diagnostics.
          # shellcheck disable=SC2086
          python3 -u "$STRESSTEST_ROOT/runner/submit_tpcds_job.py" \
            --config "$TPCDS_OUT_DIR/submitSqlJobConfig.json" \
            --kube-config "$KUBECONFIG_PATH" \
            --metrics-file "$METRICS_FILE" \
            --query-ids $QUERY_IDS \
            --iterations "$ITERATIONS" \
            --parallel "$PARALLEL" \
            --scale-sku "$SCALE_SKU" \
            --data-format "$DATA_FORMATS"

      - name: Verify TPC-DS run
        if: ${{ !cancelled() && steps.setup_env.outcome == 'success' }}
        shell: bash
        env:
          MIN_SUCCESS_RATE: "100"
        run: |
          set -eo pipefail
          if [ ! -f "$METRICS_FILE" ]; then
            echo "::error::No metrics file at $METRICS_FILE; submit step likely crashed before writing results."
            exit 1
          fi

          set +e
          python3 "$STRESSTEST_ROOT/analysis/verify_run.py" \
            --metrics-file "$METRICS_FILE" \
            --query-ids "$QUERY_IDS" \
            --formats "$DATA_FORMATS" \
            --iterations "$ITERATIONS" \
            --min-success-rate "$MIN_SUCCESS_RATE" \
            --duration-threshold-grace-pct 100 \
            --thresholds "$STRESSTEST_ROOT/analysis/thresholds"
          verify_rc=$?

          exit "$verify_rc"

      - name: Stage TPC-DS stresstest results for upload
        if: ${{ !cancelled() && steps.setup_env.outcome == 'success' }}
        shell: bash
        run: |
          set -eo pipefail
          src="${{ env.TPCDS_OUT_DIR }}/results"
          dst="${{ runner.temp }}/tpcds-stresstest-artifact"
          rm -rf "$dst"
          mkdir -p "$dst"
          if [ -d "$src" ]; then
            cp -a "$src/." "$dst/"
          fi

      - name: Upload TPC-DS stresstest results
        if: ${{ !cancelled() && steps.setup_env.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tpcds-stresstest-results-sf${{ env.SCALE_FACTOR }}
          path: ${{ runner.temp }}/tpcds-stresstest-artifact
          if-no-files-found: ignore
          overwrite: true

      # Cleanup: deletes RGs tagged for this run (skips RGs tagged SkipCleanup=true).
      # Refresh OIDC first for the end-of-run path since long SF runs can outlive
      # the original token; skipped for setup-failure cleanup (still in lifetime).
      - name: Refresh Azure login before end-of-run cleanup
        if: ${{ always() && steps.setup_env.outcome == 'success' }}
        uses: ./.github/actions/login-to-azure
        env:
          CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Delete this run's identity resource groups (which hold the managed
      # identities + their federated credentials) so FICs do not leak. The data
      # (storage/key vault) resource groups are separate and stay locked. The
      # identity RGs are named "<data-rg>-id-<run id>", so they can be derived
      # here directly from RUN_ID. Best-effort: never fails the run.
      - name: Clean up run identity resource groups
        if: ${{ always() && steps.setup_env.outcome == 'success' }}
        shell: bash
        run: |
          set +e
          for rg in "${PUBLISHER_RESOURCE_GROUP}-id-${RUN_ID}" "${CONSUMER_RESOURCE_GROUP}-id-${RUN_ID}"; do
            if [ "$(az group exists --name "$rg")" = "true" ]; then
              echo "Deleting identity resource group $rg"
              az group delete --name "$rg" --yes --no-wait
            else
              echo "Identity resource group $rg does not exist; skipping."
            fi
          done

      # Remove the SkipCleanup protection so the RGs are eligible for cleanup
      # again (the delete step below, or the subscription cleanup job later).
      - name: Remove SkipCleanup tag from run resource groups
        if: ${{ always() && steps.setup_env.outcome == 'success' }}
        shell: bash
        env:
          RG_TAG: github_actions=${{ env.JOB_ID }}-${{ env.RUN_ID }}
        run: |
          set +e
          for rid in $(az group list --tag "$RG_TAG" --query '[].id' -o tsv); do
            echo "Removing SkipCleanup -> $rid"
            az tag update --resource-id "$rid" --operation delete --tags SkipCleanup=true -o none
          done

      - name: Dump cleanroom-cluster logs on failure
        if: ${{ failure() && !cancelled() && steps.setup_env.outcome == 'success' }}
        shell: bash
        run: |
          cfg="$DEPLOYMENT_CONFIG_DIR/deployment-config.json"
          docker compose -p "$(jq -r '.cluster_provider_project_name' "$cfg")" logs || true
          pwsh ./test/onebox/multi-party-collab/big-data-query-analytics/dump-cleanroom-cluster-logs.ps1 \
            -kubeConfig "$KUBECONFIG_PATH" \
            -jobConfig "$TPCDS_OUT_DIR/submitSqlJobConfig.json" || true

      # Tear down this run's resources (success or failure) UNLESS retention was
      # requested (retainResources=true). Runs LAST so the failure log-dump above
      # can still reach the cluster before teardown.
      - name: Delete tagged resource groups
        if: ${{ always() && env.RETAIN_RESOURCES != 'true' }}
        shell: pwsh
        run: ./test/onebox/multi-party-collab/remove-resources.ps1 -tag "github_actions=${{ env.JOB_ID }}-${{ env.RUN_ID }}"

      # When retention was requested, skip deletion and surface the retained RGs.
      # NOTE: SkipCleanup protection is only for the run's duration and has been
      # removed above, so these RGs will be pruned by the periodic subscription
      # cleanup job later; delete them manually sooner if desired.
      - name: Retain tagged resource groups (skip delete)
        if: ${{ always() && env.RETAIN_RESOURCES == 'true' }}
        shell: bash
        env:
          RG_TAG: github_actions=${{ env.JOB_ID }}-${{ env.RUN_ID }}
        run: |
          set +e
          echo "retainResources=true → NOT deleting this run's resource groups."
          {
            echo "## TPC-DS Stresstest - Retained resource groups"
            echo ""
            echo "\`retainResources=true\` was set, so these RGs were kept for inspection"
            echo "(no longer SkipCleanup-protected; the periodic subscription cleanup will"
            echo "prune them later):"
            echo ""
            for rg in $(az group list --tag "$RG_TAG" --query '[].name' -o tsv); do
              echo "- \`$rg\`"
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"
