name: "PR Validation"

on:
  workflow_dispatch:
  pull_request:
    branches:
      - develop
      - release
      - main

permissions:
  id-token: write
  contents: read  # This is required for actions/checkout
  checks: write   # This is required to generate the test report


# When a new revision is pushed to a PR, cancel all in-progress CI runs for that
# PR. See https://docs.github.com/en/actions/using-jobs/using-concurrency
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ["self-hosted", "1ES.Pool=azure-cleanroom-public", "1ES.JobId=lint-${{ github.run_id }}-${{ github.run_attempt }}"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - name: Run Ruff format and lint check
        run: ./scripts/ruff-check.sh

  detect-changes:
    needs: [lint]
    runs-on: ubuntu-latest
    outputs:
      build-groups: ${{ steps.resolve.outputs.build-groups }}
      test-stages: ${{ steps.resolve.outputs.test-stages }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Resolve impacted CI stages
        id: resolve
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 ./scripts/resolve_pr_impacts.py

  build:
    needs: [detect-changes]
    if: ${{ needs.detect-changes.outputs.build-groups != '' }}
    uses: ./.github/workflows/pr_build_all.yml
    with:
      build-groups: ${{ needs.detect-changes.outputs.build-groups }}

  test-cgs:
    needs: [detect-changes]
    if: ${{ contains(needs.detect-changes.outputs.test-stages, 'test-cgs') }}
    uses: ./.github/workflows/pr_cgs_tests.yml

  test-ccf:
    needs: [detect-changes, build]
    if: ${{ contains(needs.detect-changes.outputs.test-stages, 'test-ccf') }}
    uses: ./.github/workflows/pr_ccf.yml

  test-cleanroom-cluster:
    needs: [detect-changes, build]
    if: ${{ contains(needs.detect-changes.outputs.test-stages, 'test-cleanroom-cluster') }}
    uses: ./.github/workflows/pr_cleanroom_cluster.yml

  # TODO (gsinha): GitHub Actions don't have access to the CVM over public IP due to network restrictions.
  # Enable once we have a solution in place (e.g. self-hosted runner in the same VNet as the CVM).
  # test-cvm:
  #   needs: [build]
  #   uses: ./.github/workflows/pr_cvm.yml

  test-multi-party-collab:
    needs: [detect-changes, build]
    if: ${{ contains(needs.detect-changes.outputs.test-stages, 'test-multi-party-collab') }}
    uses: ./.github/workflows/pr_multi_party_collab_samples.yml

  test-workloads:
    needs: [detect-changes, build]
    if: ${{ contains(needs.detect-changes.outputs.test-stages, 'test-workloads') }}
    uses: ./.github/workflows/pr_workload_samples.yml

  test-flex-node:
    needs: [detect-changes]
    if: ${{ contains(needs.detect-changes.outputs.test-stages, 'test-flex-node') }}
    uses: ./.github/workflows/pr_flex_node.yml

  # Single gate job for branch protection. Always runs and aggregates results
  # from all build/test jobs. Use this as the sole required status check to
  # avoid "Expected — Waiting for status" when the resolver skips test stages
  # (skipped reusable workflow jobs don't produce child check runs).
  ci-gate:
    if: always()
    needs:
      - lint
      - detect-changes
      - build
      - test-cgs
      - test-ccf
      - test-cleanroom-cluster
      - test-multi-party-collab
      - test-workloads
      - test-flex-node
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        run: |
          failed=0
          jobs=(
            "lint"
            "detect-changes"
            "build"
            "test-cgs"
            "test-ccf"
            "test-cleanroom-cluster"
            "test-multi-party-collab"
            "test-workloads"
            "test-flex-node"
          )
          results=(
            "${{ needs.lint.result }}"
            "${{ needs.detect-changes.result }}"
            "${{ needs.build.result }}"
            "${{ needs.test-cgs.result }}"
            "${{ needs.test-ccf.result }}"
            "${{ needs.test-cleanroom-cluster.result }}"
            "${{ needs.test-multi-party-collab.result }}"
            "${{ needs.test-workloads.result }}"
            "${{ needs.test-flex-node.result }}"
          )
          for i in "${!jobs[@]}"; do
            echo "${jobs[$i]}: ${results[$i]}"
            if [[ "${results[$i]}" == "failure" || "${results[$i]}" == "cancelled" ]]; then
              failed=1
            fi
          done
          if [[ "$failed" -eq 1 ]]; then
            echo "::error::CI gate failed: one or more jobs failed or were cancelled"
            exit 1
          fi
          echo "CI gate passed: all jobs succeeded or were skipped"
