name: Official Build Test (No Azure Auth)

on:
  workflow_dispatch:
  workflow_call:
  # Bootstrap branch testing without pushing or merging to the default branch.
  push:
    branches:
      - users/yavohra/github-build-only-cgs
    paths:
      - .github/workflows/official_build_test.yml
      - .github/actions/package-build-only-output/**
      - build/Get-OfficialBuildPlan.ps1
      - build/Invoke-OfficialBuildOutput.ps1

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve full official output set
        id: plan
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Install-Module -Name powershell-yaml -RequiredVersion 0.4.12 -Force -Scope CurrentUser
          $Plan = ./build/Get-OfficialBuildPlan.ps1
          "matrix=$Plan" >> $env:GITHUB_OUTPUT
          $Plan | Set-Content build-plan.json -Encoding utf8NoBOM
          $Outputs = ($Plan | ConvertFrom-Json).include
          "## Official build plan: $($Outputs.Count) outputs" >> $env:GITHUB_STEP_SUMMARY
          $Outputs | ForEach-Object {
              "- $($_.name) ($($_.kind))" >> $env:GITHUB_STEP_SUMMARY
          }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: official-build-plan
          path: build-plan.json
          if-no-files-found: error
          retention-days: 14

  build:
    needs: plan
    name: Build ${{ matrix.name }}
    runs-on:
      - self-hosted
      - 1ES.Pool=azure-cleanroom-public
      - 1ES.JobId=poc-${{ matrix.name }}-${{ github.run_id }}-${{ github.run_attempt }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    permissions:
      contents: read
      id-token: write # GitHub provenance signing only; no Azure authentication.
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: ${{ matrix.name == 'blobfuse-launcher' && 'recursive' || 'false' }}
      - name: Check build storage
        shell: bash
        run: |
          set -euo pipefail
          docker info --format '{{.DockerRootDir}}'
          df -h . /mnt
      - name: Setup Helm
        if: matrix.kind == 'helm'
        uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4.3.0
      - name: Build constitution using existing action
        if: matrix.kind == 'constitution'
        uses: ./.github/actions/build-cgs-constitution
        with:
          tag: ${{ github.sha }}
      - name: Build official output without publishing
        shell: pwsh
        env:
          OUTPUT_NAME: ${{ matrix.name }}
          OUTPUT_KIND: ${{ matrix.kind }}
          BUILD_CONTEXT: ${{ matrix.path }}
          DOCKERFILE: ${{ matrix.dockerfile }}
        run: |
          ./build/Invoke-OfficialBuildOutput.ps1 -Name $env:OUTPUT_NAME `
              -Kind $env:OUTPUT_KIND -Context $env:BUILD_CONTEXT -Dockerfile $env:DOCKERFILE
      - name: Package per-output evidence
        uses: ./.github/actions/package-build-only-output
        with:
          name: ${{ matrix.name }}
          kind: ${{ matrix.kind }}
          dockerfile: ${{ matrix.dockerfile }}

  inventory:
    needs: [plan, build]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Require every official output to succeed
        shell: bash
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          set -euo pipefail
          if [[ "$PLAN_RESULT" != success || "$BUILD_RESULT" != success ]]; then
            echo "::error::Full build incomplete: plan=$PLAN_RESULT build=$BUILD_RESULT"
            exit 1
          fi
      - name: Verify published artifact inventory
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_PLAN: ${{ needs.plan.outputs.matrix }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $Response = gh api --paginate --slurp `
              "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID/artifacts"
          $Artifacts = @($Response | ConvertFrom-Json | ForEach-Object { $_.artifacts })
          $Plan = $env:BUILD_PLAN | ConvertFrom-Json
          $Inventory = foreach ($Output in $Plan.include) {
              $Name = "handoff-$($Output.name)-$env:GITHUB_SHA"
              $Artifact = @($Artifacts | Where-Object { $_.name -eq $Name -and -not $_.expired })
              if ($Artifact.Count -ne 1 -or $Artifact[0].size_in_bytes -le 0) {
                  throw "Expected one nonempty, unexpired artifact: $Name"
              }
              [ordered]@{ output = $Output; artifact = $Artifact[0] }
          }
          [ordered]@{
              repository = $env:GITHUB_REPOSITORY
              commit = $env:GITHUB_SHA
              run_id = $env:GITHUB_RUN_ID
              run_attempt = $env:GITHUB_RUN_ATTEMPT
              outputs = @($Inventory)
          } | ConvertTo-Json -Depth 20 | Set-Content build-inventory.json -Encoding utf8NoBOM
          "## Full build complete: $($Inventory.Count) verified artifact entries" `
              >> $env:GITHUB_STEP_SUMMARY
      - name: Attest complete inventory
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: build-inventory.json
      - name: Retain inventory provenance
        shell: bash
        env:
          BUNDLE_PATH: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          set -euo pipefail
          test -s "$BUNDLE_PATH"
          cp "$BUNDLE_PATH" inventory-provenance.jsonl
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: official-build-inventory-${{ github.sha }}
          path: |
            build-inventory.json
            inventory-provenance.jsonl
          if-no-files-found: error
          retention-days: 14
