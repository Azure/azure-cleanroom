name: Cleanup stale resources created by BVTs

on:
  workflow_dispatch:
  schedule:
    - cron: "45 18 * * *"  # 00:15 IST daily (18:45 UTC prev day)

permissions:
  id-token: write
  contents: read  # This is required for actions/checkout

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  cleanup-stale-resources:
    runs-on: ["self-hosted", "1ES.Pool=azure-cleanroom-public", "1ES.JobId=cleanup-stale-bvt-resources-${{ github.run_id }}-${{ github.run_attempt }}"]
    environment: test
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        submodules: recursive

    - uses: ./.github/actions/setup-docker-on-data-disk

    - name: Login to Azure
      uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
      with:
        client-id: ${{ vars.AZURE_CLIENT_ID }}
        tenant-id: ${{ vars.AZURE_TENANT_ID }}
        subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

    - name: Execute cleanup
      env:
        AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      run: pwsh ./.github/scripts/cleanup.ps1 -environment "bvt"