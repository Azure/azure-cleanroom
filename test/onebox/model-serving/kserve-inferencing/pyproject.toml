[project]
name = "test-kserve-inferencing"
version = "0.1.0"
description = "Test workload for kserve inferencing using Azure Cleanroom"
requires-python = ">=3.12"
dependencies = [
    "agent-framework-core>=1.0.0rc5",
    "agent-framework-openai>=1.0.0rc5",
    "httpx>=0.27.0",
    "openai>=1.99.0",
    "requests>=2.33.0",
]

[tool.uv]
prerelease = "allow"

[tool.uv.sources]
agent-framework-openai = { git = "https://github.com/microsoft/agent-framework.git", subdirectory = "python/packages/openai" }
