[project]
name = "image-prep"
version = "0.1.0"
description = "Cloud-init image preparation for Cleanroom Flex Node VMs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "jinja2>=3.1.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "click>=8.0",
]

[project.scripts]
image-prep-pipeline = "image_prep.pipeline.cli:main"

[build-system]
requires = ["uv_build>=0.9.3,<0.10.0"]
build-backend = "uv_build"
