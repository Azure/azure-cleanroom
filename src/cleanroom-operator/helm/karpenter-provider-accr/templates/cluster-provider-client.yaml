apiVersion: v1
kind: ServiceAccount
metadata:
  name: cluster-provider-client
  namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-provider-client-config
  namespace: {{ .Release.Namespace }}
data:
  {{- range $key, $value := .Values.providerClient.env }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cluster-provider-client
  namespace: {{ .Release.Namespace }}
  labels:
    app: cluster-provider-client
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cluster-provider-client
  template:
    metadata:
      labels:
        app: cluster-provider-client
    spec:
      serviceAccountName: cluster-provider-client
      {{- if .Values.providerClient.virtual.enabled }}
      # In virtual (Kind) deployments the provider client needs
      # access to the host Docker socket to manage child Kind
      # worker nodes. The socket is only bind-mounted on the
      # control-plane node, so pin the pod there.
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      {{- end }}
      containers:
        - name: cluster-provider-client
          image: "{{ .Values.providerClient.image.repository }}:{{ .Values.providerClient.image.tag | toString }}"
          imagePullPolicy: {{ .Values.providerClient.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: cluster-provider-client-config
          livenessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.providerClient.resources | nindent 12 }}
          volumeMounts:
            {{- if .Values.providerClient.virtual.enabled }}
            - name: docker-socket
              mountPath: /var/run/docker.sock
            - name: shared-dir
              mountPath: /app/shared
            {{- end }}
      volumes:
        {{- if .Values.providerClient.virtual.enabled }}
        - name: docker-socket
          hostPath:
            path: /var/run/docker.sock
            type: Socket
        - name: shared-dir
          hostPath:
            path: {{ .Values.providerClient.virtual.sharedDir }}
            type: DirectoryOrCreate
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: cluster-provider-client
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: cluster-provider-client
  ports:
    - port: 8080
      targetPort: http
      protocol: TCP
  type: ClusterIP
