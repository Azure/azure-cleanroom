---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.0
  name: environments.cleanroom.azure.com
spec:
  group: cleanroom.azure.com
  names:
    kind: Environment
    listKind: EnvironmentList
    plural: environments
    shortNames:
    - env
    singular: environment
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.infraType
      name: InfraType
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Environment is the Schema for the environments API.
          It is the top-level resource that creates and manages
          CcfMember, CcfNetwork, GovernanceContract, and Cluster
          child resources.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: EnvironmentSpec defines the desired state of an Environment.
            properties:
              autoApprove:
                description: |-
                  AutoApprove controls whether the operator member
                  automatically votes accept on all governance
                  proposals. Set to true for single-operator scenarios.
                type: boolean
              ccfNetwork:
                description: CcfNetwork overrides CCF network settings.
                properties:
                  nodeCount:
                    default: 1
                    description: NodeCount is the number of CCF nodes.
                    minimum: 1
                    type: integer
                  nodeLogLevel:
                    description: NodeLogLevel sets the CCF node log level.
                    enum:
                    - Trace
                    - Debug
                    - Info
                    - Fail
                    - Fatal
                    type: string
                  providerConfig:
                    description: |-
                      ProviderConfig is opaque provider-specific
                      configuration for the CCF network.
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                  securityPolicyCreationOption:
                    description: |-
                      SecurityPolicyCreationOption controls security
                      policy generation for CCF CACI deployments.
                    enum:
                    - cached
                    - cachedDebug
                    - allowAll
                    type: string
                type: object
              cleanRoomPolicy:
                description: CleanRoomPolicy is the governance policy JSON.
                type: object
                x-kubernetes-preserve-unknown-fields: true
              clusterProviderConfig:
                description: |-
                  ClusterProviderConfig is opaque provider-specific
                  configuration for the Cluster.
                type: object
                x-kubernetes-preserve-unknown-fields: true
              contractId:
                description: |-
                  ContractId is the governance contract identifier.
                  Defaults to the Environment name if not specified.
                type: string
              deletionPolicy:
                description: |-
                  DeletionPolicy controls whether external infrastructure
                  (CCF network, cluster) is deleted or retained when the
                  Environment is deleted. Defaults to "delete" for virtual
                  infraType and "retain" otherwise.
                enum:
                - retain
                - delete
                type: string
              deploymentSpec:
                description: |-
                  DeploymentSpec is the ARM deployment template JSON
                  for the governance contract.
                type: object
                x-kubernetes-preserve-unknown-fields: true
              enableCA:
                description: |-
                  EnableCA enables the certificate authority for the
                  governance contract.
                type: boolean
              governanceService:
                description: |-
                  GovernanceService optionally overrides the governance
                  service deployment settings (constitution image, JS
                  app image, tenant ID). When omitted the controller
                  resolves images from CGS_CONSTITUTION_IMAGE and
                  CGS_JS_APP_IMAGE environment variables.
                properties:
                  constitutionImage:
                    description: |-
                      ConstitutionImage is the OCI image for the
                      constitution bundle. Resolved from env var
                      CGS_CONSTITUTION_IMAGE if not set.
                    type: string
                  jsAppImage:
                    description: |-
                      JsAppImage is the OCI image for the JS app bundle.
                      Resolved from env var CGS_JS_APP_IMAGE if not set.
                    type: string
                  oidcContainerName:
                    description: |-
                      OidcContainerName is the container name used in the
                      shared OIDC storage account for this environment's
                      OpenID configuration documents. Must be unique
                      across all developers/CI runs. Typically set by the
                      CLI using the resource group name.
                    type: string
                  tenantId:
                    description: |-
                      TenantId is the Azure AD tenant ID for JWT issuer
                      configuration.
                    type: string
                type: object
              infraType:
                description: |-
                  InfraType is the infrastructure type for all child
                  resources (CCF network, cluster).
                enum:
                - virtual
                - aks
                type: string
                x-kubernetes-validations:
                - message: infraType is immutable once set
                  rule: self == oldSelf
              initialMember:
                description: |-
                  InitialMember optionally overrides the non-operator
                  member (member0) settings. A second member and its
                  GovernanceService are always created; this field
                  allows customising the member identifier or CGS image.
                properties:
                  cgsImage:
                    description: CgsImage overrides the governance client image.
                    type: string
                  identifier:
                    description: |-
                      Identifier is the human-readable name for this
                      member. Defaults to "member0".
                    type: string
                type: object
              member:
                description: Member configures the operator member.
                properties:
                  cgsImage:
                    description: CgsImage overrides the governance client image.
                    type: string
                  generateEncryptionKey:
                    description: |-
                      GenerateEncryptionKey controls whether an RSA
                      encryption key pair is generated.
                    type: boolean
                  identifier:
                    description: |-
                      Identifier is the human-readable name for the
                      operator member. Defaults to "operator".
                    type: string
                type: object
              prereqsConfigRef:
                description: |-
                  PrereqsConfigRef is the name of a ConfigMap created by
                  the prepare-prereqs command. It contains provider
                  configuration for both the CCF network and the cluster.
                  When set, the controller reads ccfProviderConfig and
                  clusterProviderConfig keys from the ConfigMap as
                  fallbacks for the inline CcfNetwork.ProviderConfig and
                  ClusterProviderConfig fields.
                type: string
              profiles:
                description: |-
                  Profiles configures workload and infrastructure
                  profiles for the cluster.
                properties:
                  aad:
                    description: Aad configures Azure AD integration.
                    properties:
                      adminGroupObjectIds:
                        description: |-
                          AdminGroupObjectIds is a list of AAD group object IDs that are
                          granted admin access.
                        items:
                          type: string
                        type: array
                      enabled:
                        description: |-
                          Enabled controls whether AAD integration is enabled during
                          cluster creation.
                        type: boolean
                    required:
                    - adminGroupObjectIds
                    type: object
                  analytics:
                    description: Analytics configures the analytics workload.
                    properties:
                      configurationUrl:
                        description: |-
                          ConfigurationUrl is the URL for analytics workload configuration.
                          Required when enabled is true.
                        type: string
                      configurationUrlCaCert:
                        description: |-
                          ConfigurationUrlCaCert is a PEM-encoded CA certificate for the
                          configuration URL.
                        type: string
                      enabled:
                        description: Enabled controls whether the analytics workload
                          is enabled.
                        type: boolean
                      poolProfile:
                        description: PoolProfile configures the workload pool.
                        properties:
                          nodeCount:
                            description: NodeCount is the number of nodes in the pool.
                            minimum: 1
                            type: integer
                        required:
                        - nodeCount
                        type: object
                      securityPolicyCreationOption:
                        description: SecurityPolicyCreationOption controls security
                          policy generation.
                        enum:
                        - cached
                        - cachedDebug
                        - allowAll
                        type: string
                    required:
                    - enabled
                    type: object
                  flexNode:
                    description: FlexNode configures flex node provisioning.
                    properties:
                      enabled:
                        description: Enabled controls whether flex nodes are provisioned.
                        type: boolean
                      governanceConfigRef:
                        description: |-
                          GovernanceConfigRef is the name of a ConfigMap written by
                          a WorkloadGovernance controller. When set, the Cluster
                          waits for this ConfigMap before provisioning flex nodes
                          and reads policySigningCertPem from it.
                        type: string
                      insecure:
                        description: |-
                          Insecure disables security checks on flex nodes.
                          When nil, defaults to true.
                        type: boolean
                      maxPodsPerNode:
                        default: 110
                        description: MaxPodsPerNode is the maximum number of pods
                          per flex node.
                        type: integer
                      mode:
                        description: |-
                          Mode controls how flex nodes are provisioned.
                          "manual" provisions a fixed NodeCount of nodes
                          directly. "auto" delegates lifecycle to the
                          Karpenter autoscaler via the accr CloudProvider.
                          When empty, defaults to "manual" behaviour.
                        enum:
                        - manual
                        - auto
                        type: string
                      nodeCount:
                        default: 1
                        description: NodeCount is the number of flex nodes to provision.
                        minimum: 1
                        type: integer
                      osDiskSizeInGB:
                        description: OsDiskSizeInGB is the OS disk size in GB.
                        type: integer
                      policySigningCertPem:
                        description: |-
                          PolicySigningCertPem is the PEM-encoded policy signing certificate.
                          Mutually exclusive with PolicySigningCertSecretRef.
                        type: string
                      policySigningCertSecretRef:
                        description: |-
                          PolicySigningCertSecretRef references a Kubernetes Secret containing
                          the policy signing certificate. Mutually exclusive with
                          PolicySigningCertPem.
                        properties:
                          key:
                            description: Key is the key within the Secret data.
                            type: string
                          name:
                            description: Name is the name of the Secret.
                            type: string
                        required:
                        - key
                        - name
                        type: object
                      provisionUsingSSH:
                        description: |-
                          ProvisionUsingSSH controls how flex node VMs are provisioned on
                          AKS. When true, a stock Ubuntu CVM image is created and the node
                          software is installed via SSH at deploy time (no pre-baked gallery
                          image / cleanroom-image-digests artifact is required). When false,
                          a pre-built gallery image is used. When nil, defaults to true for
                          the operator flow. Ignored for virtual (Kind) clusters.
                        type: boolean
                      requirePreProvisionedKindNodes:
                        description: |-
                          RequirePreProvisionedKindNodes requires that flex worker nodes are
                          pre-provisioned in the Kind cluster config. When true, the flow fails
                          if the requested nodes are not already present. Defaults to false
                          (kindscaler dynamically adds nodes).
                        type: boolean
                      sshPrivateKeyPem:
                        description: SshPrivateKeyPem is the PEM-encoded SSH private
                          key for node access.
                        type: string
                      sshPrivateKeySecretRef:
                        description: |-
                          SshPrivateKeySecretRef references a Secret containing the SSH
                          private key. Mutually exclusive with SshPrivateKeyPem.
                        properties:
                          key:
                            description: Key is the key within the Secret data.
                            type: string
                          name:
                            description: Name is the name of the Secret.
                            type: string
                        required:
                        - key
                        - name
                        type: object
                      sshPublicKey:
                        description: SshPublicKey is the SSH public key for node access.
                        type: string
                      sshPublicKeySecretRef:
                        description: |-
                          SshPublicKeySecretRef references a Secret containing the SSH
                          public key. Mutually exclusive with SshPublicKey.
                        properties:
                          key:
                            description: Key is the key within the Secret data.
                            type: string
                          name:
                            description: Name is the name of the Secret.
                            type: string
                        required:
                        - key
                        - name
                        type: object
                      vmSize:
                        description: VmSize is the Azure VM size for flex nodes.
                        type: string
                    required:
                    - enabled
                    type: object
                  inferencing:
                    description: Inferencing configures the inferencing workload.
                    properties:
                      kserveProfile:
                        description: KServeProfile configures KServe-based inferencing.
                        properties:
                          configurationUrl:
                            description: |-
                              ConfigurationUrl is the URL for inferencing configuration.
                              Required when enabled is true and governanceConfigRef is
                              not set.
                            type: string
                          configurationUrlCaCert:
                            description: |-
                              ConfigurationUrlCaCert is a PEM-encoded CA certificate for the
                              configuration URL.
                            type: string
                          enabled:
                            description: Enabled controls whether KServe inferencing
                              is enabled.
                            type: boolean
                          governanceConfigRef:
                            description: |-
                              GovernanceConfigRef is the name of a ConfigMap written by
                              a WorkloadGovernance controller. When set, the Cluster
                              waits for this ConfigMap before provisioning the KServe
                              profile and reads configurationUrl from it.
                            type: string
                          securityPolicyCreationOption:
                            description: SecurityPolicyCreationOption controls security
                              policy generation.
                            enum:
                            - cached
                            - cachedDebug
                            - allowAll
                            type: string
                        required:
                        - enabled
                        type: object
                    type: object
                  monitoring:
                    description: Monitoring configures monitoring capabilities.
                    properties:
                      enabled:
                        description: Enabled controls whether monitoring is turned
                          on.
                        type: boolean
                    required:
                    - enabled
                    type: object
                  observability:
                    description: |-
                      Observability configures observability (metrics, logs,
                      traces).
                    properties:
                      enabled:
                        description: Enabled controls whether observability is turned
                          on.
                        type: boolean
                    required:
                    - enabled
                    type: object
                type: object
              runtimeOptions:
                description: RuntimeOptions configures optional runtime features.
                properties:
                  enableLogging:
                    description: EnableLogging enables logging for the clean room.
                    type: boolean
                  enableTelemetry:
                    description: EnableTelemetry enables telemetry for the clean room.
                    type: boolean
                type: object
            required:
            - infraType
            type: object
          status:
            description: |-
              EnvironmentStatus defines the observed state of an
              Environment.
            properties:
              conditions:
                description: |-
                  Conditions represent the latest available observations
                  of the environment's state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              lastHandledReconcileAt:
                description: |-
                  LastHandledReconcileAt is the timestamp of the last
                  reconciliation request processed by the controller.
                  Set by the controller when it begins handling a
                  reconcile.cleanroom.azure.com/requestedAt annotation.
                type: string
              lastOperationTraceId:
                description: |-
                  LastOperationTraceId is the trace ID of the most recent
                  create/update operation. Persists after completion for
                  debugging.
                type: string
              message:
                description: |-
                  Message is a human-readable summary of why the
                  environment is in its current phase.
                type: string
              observedGeneration:
                description: |-
                  ObservedGeneration is the most recent generation
                  observed by the controller.
                format: int64
                type: integer
              phase:
                description: Phase is the current lifecycle phase.
                enum:
                - Pending
                - Provisioning
                - Ready
                - Failed
                - Deleting
                type: string
              traceParent:
                description: |-
                  TraceParent is the W3C traceparent header for the
                  in-flight operation. Used internally for cross-reconcile
                  span correlation. Cleared when the operation completes.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
