---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.0
  name: clusters.cleanroom.azure.com
spec:
  group: cleanroom.azure.com
  names:
    kind: Cluster
    listKind: ClusterList
    plural: clusters
    shortNames:
    - crc
    singular: cluster
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.infraType
      name: InfraType
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Cluster is the Schema for the clusters API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ClusterSpec defines the desired state of a Cluster.
            properties:
              aadProfile:
                description: AadProfile configures Azure Active Directory integration.
                properties:
                  adminGroupObjectIds:
                    description: |-
                      AdminGroupObjectIds is a list of AAD group object IDs that are
                      granted admin access.
                    items:
                      type: string
                    type: array
                  enabled:
                    description: |-
                      Enabled controls whether AAD integration is enabled during
                      cluster creation.
                    type: boolean
                required:
                - adminGroupObjectIds
                type: object
              analyticsWorkloadProfile:
                description: AnalyticsWorkloadProfile configures the analytics workload.
                properties:
                  configurationUrl:
                    description: |-
                      ConfigurationUrl is the URL for analytics workload configuration.
                      Required when enabled is true.
                    type: string
                  configurationUrlCaCert:
                    description: |-
                      ConfigurationUrlCaCert is a PEM-encoded CA certificate for the
                      configuration URL.
                    type: string
                  enabled:
                    description: Enabled controls whether the analytics workload is
                      enabled.
                    type: boolean
                  poolProfile:
                    description: PoolProfile configures the workload pool.
                    properties:
                      nodeCount:
                        description: NodeCount is the number of nodes in the pool.
                        minimum: 1
                        type: integer
                    required:
                    - nodeCount
                    type: object
                  securityPolicyCreationOption:
                    description: SecurityPolicyCreationOption controls security policy
                      generation.
                    enum:
                    - cached
                    - cachedDebug
                    - allowAll
                    type: string
                required:
                - enabled
                type: object
              deletionPolicy:
                description: |-
                  DeletionPolicy controls whether the external cluster
                  is deleted or retained when this resource is deleted.
                  When empty, defaults to "retain" (safe).
                enum:
                - retain
                - delete
                type: string
              flexNodeProfile:
                description: FlexNodeProfile configures flex node provisioning.
                properties:
                  enabled:
                    description: Enabled controls whether flex nodes are provisioned.
                    type: boolean
                  governanceConfigRef:
                    description: |-
                      GovernanceConfigRef is the name of a ConfigMap written by
                      a WorkloadGovernance controller. When set, the Cluster
                      waits for this ConfigMap before provisioning flex nodes
                      and reads policySigningCertPem from it.
                    type: string
                  insecure:
                    description: |-
                      Insecure disables security checks on flex nodes.
                      When nil, defaults to true.
                    type: boolean
                  maxPodsPerNode:
                    default: 110
                    description: MaxPodsPerNode is the maximum number of pods per
                      flex node.
                    type: integer
                  mode:
                    description: |-
                      Mode controls how flex nodes are provisioned.
                      "manual" provisions a fixed NodeCount of nodes
                      directly. "auto" delegates lifecycle to the
                      Karpenter autoscaler via the accr CloudProvider.
                      When empty, defaults to "manual" behaviour.
                    enum:
                    - manual
                    - auto
                    type: string
                  nodeCount:
                    default: 1
                    description: NodeCount is the number of flex nodes to provision.
                    minimum: 1
                    type: integer
                  osDiskSizeInGB:
                    description: OsDiskSizeInGB is the OS disk size in GB.
                    type: integer
                  policySigningCertPem:
                    description: |-
                      PolicySigningCertPem is the PEM-encoded policy signing certificate.
                      Mutually exclusive with PolicySigningCertSecretRef.
                    type: string
                  policySigningCertSecretRef:
                    description: |-
                      PolicySigningCertSecretRef references a Kubernetes Secret containing
                      the policy signing certificate. Mutually exclusive with
                      PolicySigningCertPem.
                    properties:
                      key:
                        description: Key is the key within the Secret data.
                        type: string
                      name:
                        description: Name is the name of the Secret.
                        type: string
                    required:
                    - key
                    - name
                    type: object
                  provisionUsingSSH:
                    description: |-
                      ProvisionUsingSSH controls how flex node VMs are provisioned on
                      AKS. When true, a stock Ubuntu CVM image is created and the node
                      software is installed via SSH at deploy time (no pre-baked gallery
                      image / cleanroom-image-digests artifact is required). When false,
                      a pre-built gallery image is used. When nil, defaults to true for
                      the operator flow. Ignored for virtual (Kind) clusters.
                    type: boolean
                  requirePreProvisionedKindNodes:
                    description: |-
                      RequirePreProvisionedKindNodes requires that flex worker nodes are
                      pre-provisioned in the Kind cluster config. When true, the flow fails
                      if the requested nodes are not already present. Defaults to false
                      (kindscaler dynamically adds nodes).
                    type: boolean
                  sshPrivateKeyPem:
                    description: SshPrivateKeyPem is the PEM-encoded SSH private key
                      for node access.
                    type: string
                  sshPrivateKeySecretRef:
                    description: |-
                      SshPrivateKeySecretRef references a Secret containing the SSH
                      private key. Mutually exclusive with SshPrivateKeyPem.
                    properties:
                      key:
                        description: Key is the key within the Secret data.
                        type: string
                      name:
                        description: Name is the name of the Secret.
                        type: string
                    required:
                    - key
                    - name
                    type: object
                  sshPublicKey:
                    description: SshPublicKey is the SSH public key for node access.
                    type: string
                  sshPublicKeySecretRef:
                    description: |-
                      SshPublicKeySecretRef references a Secret containing the SSH
                      public key. Mutually exclusive with SshPublicKey.
                    properties:
                      key:
                        description: Key is the key within the Secret data.
                        type: string
                      name:
                        description: Name is the name of the Secret.
                        type: string
                    required:
                    - key
                    - name
                    type: object
                  vmSize:
                    description: VmSize is the Azure VM size for flex nodes.
                    type: string
                required:
                - enabled
                type: object
              inferencingWorkloadProfile:
                description: InferencingWorkloadProfile configures the inferencing
                  workload.
                properties:
                  kserveProfile:
                    description: KServeProfile configures KServe-based inferencing.
                    properties:
                      configurationUrl:
                        description: |-
                          ConfigurationUrl is the URL for inferencing configuration.
                          Required when enabled is true and governanceConfigRef is
                          not set.
                        type: string
                      configurationUrlCaCert:
                        description: |-
                          ConfigurationUrlCaCert is a PEM-encoded CA certificate for the
                          configuration URL.
                        type: string
                      enabled:
                        description: Enabled controls whether KServe inferencing is
                          enabled.
                        type: boolean
                      governanceConfigRef:
                        description: |-
                          GovernanceConfigRef is the name of a ConfigMap written by
                          a WorkloadGovernance controller. When set, the Cluster
                          waits for this ConfigMap before provisioning the KServe
                          profile and reads configurationUrl from it.
                        type: string
                      securityPolicyCreationOption:
                        description: SecurityPolicyCreationOption controls security
                          policy generation.
                        enum:
                        - cached
                        - cachedDebug
                        - allowAll
                        type: string
                    required:
                    - enabled
                    type: object
                type: object
              infraType:
                description: InfraType is the infrastructure type for the cluster.
                enum:
                - virtual
                - aks
                type: string
                x-kubernetes-validations:
                - message: infraType is immutable once set
                  rule: self == oldSelf
              monitoringProfile:
                description: MonitoringProfile configures monitoring capabilities.
                properties:
                  enabled:
                    description: Enabled controls whether monitoring is turned on.
                    type: boolean
                required:
                - enabled
                type: object
              observabilityProfile:
                description: ObservabilityProfile configures observability (metrics,
                  logs, traces).
                properties:
                  enabled:
                    description: Enabled controls whether observability is turned
                      on.
                    type: boolean
                required:
                - enabled
                type: object
              providerConfig:
                description: |-
                  ProviderConfig is opaque provider-specific configuration passed
                  through to the provider client API as-is.
                type: object
                x-kubernetes-preserve-unknown-fields: true
            required:
            - infraType
            type: object
            x-kubernetes-validations:
            - message: providerConfig is required when infraType is aks
              rule: self.infraType != 'aks' || has(self.providerConfig)
          status:
            description: ClusterStatus defines the observed state of a Cluster.
            properties:
              analyticsWorkloadProfile:
                description: AnalyticsWorkloadProfile reflects the observed analytics
                  state.
                properties:
                  enabled:
                    type: boolean
                  endpoint:
                    type: string
                  namespace:
                    type: string
                required:
                - enabled
                type: object
              conditions:
                description: |-
                  Conditions represent the latest available observations of the
                  cluster's state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              flexNodeProfile:
                description: FlexNodeProfile reflects the observed flex node state.
                properties:
                  enabled:
                    type: boolean
                  nodes:
                    items:
                      description: FlexNodeStatus represents the status of a single
                        flex node.
                      properties:
                        name:
                          type: string
                        status:
                          type: string
                      type: object
                    type: array
                required:
                - enabled
                type: object
              inferencingWorkloadProfile:
                description: InferencingWorkloadProfile reflects the observed inferencing
                  state.
                properties:
                  kserveProfile:
                    description: KServeProfile reflects the KServe inferencing status.
                    properties:
                      enabled:
                        type: boolean
                      endpoint:
                        type: string
                      namespace:
                        type: string
                    required:
                    - enabled
                    type: object
                type: object
              lastHandledReconcileAt:
                description: |-
                  LastHandledReconcileAt is the timestamp of the last
                  reconcile request handled by the controller.
                type: string
              lastOperationTraceId:
                description: |-
                  LastOperationTraceId is the trace ID of the most recent
                  create/update operation. Persists after completion for debugging.
                type: string
              monitoringProfile:
                description: MonitoringProfile reflects the observed monitoring state.
                properties:
                  enabled:
                    type: boolean
                required:
                - enabled
                type: object
              observabilityProfile:
                description: ObservabilityProfile reflects the observed observability
                  state.
                properties:
                  enabled:
                    type: boolean
                  logsEndpoint:
                    type: string
                  metricsEndpoint:
                    type: string
                  tracesEndpoint:
                    type: string
                  visualizationEndpoint:
                    type: string
                required:
                - enabled
                type: object
              observedGeneration:
                description: |-
                  ObservedGeneration is the most recent generation observed by the
                  controller.
                format: int64
                type: integer
              operationId:
                description: OperationId is the ID of the in-progress async operation,
                  if any.
                type: string
              phase:
                description: Phase is the current lifecycle phase of the cluster.
                enum:
                - Pending
                - Creating
                - Running
                - Failed
                - Deleting
                - Updating
                type: string
              providerProperties:
                description: ProviderProperties contains provider-specific output
                  properties.
                type: object
                x-kubernetes-preserve-unknown-fields: true
              traceParent:
                description: |-
                  TraceParent is the W3C traceparent header for the in-flight
                  operation. Used internally for cross-reconcile span correlation.
                  Cleared when the operation completes or fails.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
