{{- if .Values.credentialsProxy.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: credentials-proxy
  namespace: {{ .Values.namespace }}
  labels:
    app: credentials-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: credentials-proxy
  template:
    metadata:
      labels:
        app: credentials-proxy
    spec:
      containers:
        - name: credentials-proxy
          image: {{ .Values.credentialsProxy.image | quote }}
          securityContext:
            runAsUser: 0
          env:
            - name: ASPNETCORE_URLS
              value: "http://+:8098"
          ports:
            - name: http
              containerPort: 8098
              protocol: TCP
          volumeMounts:
            - name: azure-config
              mountPath: /app/.azure
      volumes:
        - name: azure-config
          hostPath:
            path: {{ .Values.credentialsProxy.azureDir }}
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: credentials-proxy
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: credentials-proxy
  ports:
    - port: 8098
      targetPort: http
      protocol: TCP
  type: ClusterIP
{{- end }}
