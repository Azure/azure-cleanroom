apiVersion: v1
kind: ServiceAccount
metadata:
  name: cleanroom-operator
  namespace: {{ .Values.namespace }}
  {{- if .Values.operator.azure.clientId }}
  annotations:
    azure.workload.identity/client-id: {{ .Values.operator.azure.clientId | quote }}
  {{- end }}
---
# The ClusterRole is auto-generated by controller-gen from +kubebuilder:rbac
# markers. See helm/chart/templates/rbac-role.yaml.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cleanroom-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cleanroom-operator
subjects:
  - kind: ServiceAccount
    name: cleanroom-operator
    namespace: {{ .Values.namespace }}
