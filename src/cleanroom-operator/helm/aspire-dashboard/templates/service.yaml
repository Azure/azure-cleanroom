apiVersion: v1
kind: Service
metadata:
  name: aspire-dashboard
  namespace: {{ .Values.namespace }}
  labels:
    app: aspire-dashboard
spec:
  selector:
    app: aspire-dashboard
  ports:
    - name: ui
      port: 18888
      targetPort: ui
      protocol: TCP
    - name: otlp-grpc
      port: 18889
      targetPort: otlp-grpc
      protocol: TCP
    - name: otlp-http
      port: 18890
      targetPort: otlp-http
      protocol: TCP
  type: ClusterIP
