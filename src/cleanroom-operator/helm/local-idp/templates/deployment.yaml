apiVersion: apps/v1
kind: Deployment
metadata:
  name: local-idp
  namespace: {{ .Values.namespace }}
  labels:
    app: local-idp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: local-idp
  template:
    metadata:
      labels:
        app: local-idp
    spec:
      containers:
        - name: local-idp
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | toString }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8399
              protocol: TCP
          {{- if .Values.existingKeysSecret }}
          env:
            - name: LOCAL_IDP_KEYS_DIR
              value: /keys
          volumeMounts:
            - name: idp-keys
              mountPath: /keys
              readOnly: true
          {{- end }}
          livenessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- if .Values.existingKeysSecret }}
      volumes:
        - name: idp-keys
          secret:
            secretName: {{ .Values.existingKeysSecret }}
      {{- end }}
