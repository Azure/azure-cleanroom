output-dir: "{cwd}/generated"
emit:
  - "@typespec/openapi3"
  - "@typespec/http-server-csharp"
  - "@typespec/http-client-python"  
options:
  "@typespec/openapi3":
    emitter-output-dir: "{output-dir}/schema"
    openapi-versions:
      - 3.1.0
  "@typespec/http-server-csharp":
    emitter-output-dir: "{output-dir}/server/aspnet"
    output-type: "all"
    emit-mocks: "mocks-and-project-files"
    use-swaggerui: true
    project-name: "Azure.Cleanroom.Governance.Client.Proxy"
  "@typespec/http-client-python":
    emitter-output-dir: "{output-dir}/clients/python"
