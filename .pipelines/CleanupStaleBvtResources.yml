################################################################################
# Cleanup Stale BVT Resources (migrated from
# .github/workflows/cleanup_stale_bvt_resources.yml). Same shape as
# CleanupStalePrResources.yml but cleans the "bvt" environment daily
# (00:15 IST). Extends OneBranch NonOfficial. See MIGRATION.md for detail.
################################################################################

schedules:
  - cron: "45 18 * * *"
    displayName: Daily stale BVT resource cleanup (00:15 IST / 18:45 UTC)
    branches:
      include:
        - develop
    always: true

trigger: none
pr: none

name: cleanup-stale-bvt-resources-$(Date:yyyyMMdd).$(Rev:r)

variables:
  # OneBranch `pool: { type: linux }` runs the job inside this container image;
  # it must be declared or the "Initialize containers" step fails to pull.
  - name: LinuxContainerImage
    value: "mcr.microsoft.com/onebranch/azurelinux/build:3.0"

resources:
  repositories:
    - repository: templates
      type: git
      name: OneBranch.Pipelines/GovernedTemplates
      ref: refs/heads/main

extends:
  template: v2/OneBranch.NonOfficial.CrossPlat.yml@templates
  parameters:
    cloudvault:
      enabled: false
    globalSdl:
      # Pure `az`/PowerShell cleanup job (no build artifacts) — SDL dependency
      # provenance is meaningless here and its buildwatch teardown times out on
      # the long file-heavy az run (see CleanupStalePrResources.yml). Disable it.
      disableDependencyAnalyzer: true
      tsa:
        enabled: false
      policheck:
        break: true
    stages:
      - stage: Cleanup
        displayName: Cleanup stale BVT resources
        jobs:
          - job: cleanup_stale_bvt_resources
            displayName: Cleanup stale BVT resources
            # GitHub's cleanup_stale_bvt_resources.yml sets no timeout-minutes
            # (defaults to 360). cleanup.ps1 needs ~2h for the SP/RG scan, so
            # match the source's effective budget instead of the old 120 cap.
            timeoutInMinutes: 360
            pool:
              type: linux
            variables:
              ob_outputDirectory: "$(Build.SourcesDirectory)/out"
              repoRoot: "$(Build.SourcesDirectory)/azure-cleanroom"
            steps:
              - checkout: self
                submodules: recursive

              # NOTE: cleanup.ps1 is pure `az`/PowerShell (no docker), so the
              # setup-docker-on-data-disk step is intentionally omitted here.

              - task: AzureCLI@2
                displayName: Execute cleanup
                inputs:
                  # Service connection inputs must be a literal (compile-time)
                  # value — ADO resolves them before runtime variables expand.
                  azureSubscription: cleanroom-pr-oidc
                  scriptType: pscore
                  scriptLocation: inlineScript
                  workingDirectory: $(repoRoot)
                  inlineScript: |
                    pwsh ./.github/scripts/cleanup.ps1 -environment "bvt"
