################################################################################
#         Cleanup Stale BVT Resources (Azure Pipelines) — scheduled            #
#                                                                              #
# Migrated from .github/workflows/cleanup_stale_bvt_resources.yml.             #
# Identical shape to the pilot CleanupStalePrResources.yml, but cleans the      #
# "bvt" environment on a WEEKLY schedule (Sundays 02:00 UTC) instead of daily.  #
#                                                                              #
# Original GitHub trigger: workflow_dispatch + schedule cron "0 2 * * 0".      #
#                                                                              #
# TODO(Phase 1C): azureServiceConnection (OIDC SC) + a 1ES pool with Docker.   #
################################################################################

schedules:
  - cron: "0 2 * * 0"
    displayName: Weekly stale BVT resource cleanup (Sun 02:00 UTC)
    branches:
      include:
        - develop
    always: true

trigger: none
pr: none

name: cleanup-stale-bvt-resources-$(Date:yyyyMMdd).$(Rev:r)

resources:
  repositories:
    - repository: templates
      type: git
      name: OneBranch.Pipelines/GovernedTemplates
      ref: refs/heads/main

extends:
  template: v2/OneBranch.NonOfficial.CrossPlat.yml@templates
  parameters:
    cloudvault:
      enabled: false
    globalSdl:
      tsa:
        enabled: false
      policheck:
        break: true
    stages:
      - stage: Cleanup
        displayName: Cleanup stale BVT resources
        jobs:
          - job: cleanup_stale_bvt_resources
            displayName: Cleanup stale BVT resources
            timeoutInMinutes: 120
            pool:
              type: linux # TODO(Phase 1C): 1ES pool that provides a Docker daemon
            variables:
              ob_outputDirectory: "$(Build.SourcesDirectory)/out"
              repoRoot: "$(Build.SourcesDirectory)/azure-cleanroom"
              # OIDC service connection replaces azure/login + the AZURE_* repo vars.
              azureServiceConnection: "cleanroom-pr-cleanup-oidc" # TODO(Phase 1C)
            steps:
              - checkout: self
                submodules: recursive

              - template: templates/steps/setup-docker-on-data-disk.yml

              - task: AzureCLI@2
                displayName: Execute cleanup
                inputs:
                  azureSubscription: $(azureServiceConnection)
                  scriptType: pscore
                  scriptLocation: inlineScript
                  workingDirectory: $(repoRoot)
                  inlineScript: |
                    pwsh ./.github/scripts/cleanup.ps1 -environment "bvt"
