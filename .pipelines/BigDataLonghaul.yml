################################################################################
# Big Data Analytics Longhaul — scheduled (migrated from
# .github/workflows/bigdata-longhaul.yml, cron "0 0 * * *" +
# durationMinutes/pauseMinutes/enableChaos manual inputs). Structure: build
# (pr-build-all-jobs; a force_build_groups=all job seeds a full build) ->
# longhaul_test. See MIGRATION.md for detail.
################################################################################

schedules:
  - cron: "0 0 * * *"
    displayName: Daily big data analytics longhaul (00:00 UTC)
    branches:
      include:
        - develop
    always: true

trigger: none
pr: none

name: bigdata-longhaul-$(Date:yyyyMMdd).$(Rev:r)

parameters:
  - name: durationMinutes
    type: string
    default: "240"
  - name: pauseMinutes
    type: string
    default: "20"
  - name: enableChaos
    type: boolean
    default: true

variables:
  # Shared build vars (var group + ACR_URL + AZURE_* + RUN_ID/RUN_ATTEMPT/JOB_ID +
  # GITHUB_ACTIONS=true) at PIPELINE scope so custom (isCustom) jobs' own vars can
  # stay pure maps (OneBranch reads ob_outputDirectory statically). File-relative
  # (pre-extends), no @self.
  - template: templates/variables/build-common.yml
  - name: LinuxContainerImage
    value: "mcr.microsoft.com/onebranch/azurelinux/build:3.0"
  - name: CDP_DEFINITION_BUILD_COUNT
    value: $[counter('', 0)]
  # OneBranch requires ob_outputDirectory on every job (container + custom). Set a
  # pipeline-level default so the docker-free seed_build_groups job has it too;
  # the custom jobs also set it in their own pure-map vars.
  - name: ob_outputDirectory
    value: "$(Build.SourcesDirectory)/out"

resources:
  repositories:
    - repository: templates
      type: git
      name: OneBranch.Pipelines/GovernedTemplates
      ref: refs/heads/main

extends:
  template: v2/OneBranch.NonOfficial.CrossPlat.yml@templates
  parameters:
    cloudvault:
      enabled: false
    globalSdl:
      tsa:
        enabled: false
      policheck:
        break: true
    stages:
      - stage: BigDataLonghaul
        displayName: Big Data Analytics Longhaul
        jobs:
          # Seed buildGroups='all' so every pr-build-all job runs (full build),
          # satisfying the template's detectChangesJob output contract.
          - job: seed_build_groups
            displayName: Seed build groups (all)
            pool:
              type: linux
            variables:
              ob_outputDirectory: "$(Build.SourcesDirectory)/out"
            steps:
              # No `checkout: none` — OneBranch container jobs auto-inject a
              # checkout and reject an explicit `checkout: none` alongside it.
              - bash: echo "##vso[task.setvariable variable=buildGroups;isOutput=true]all"
                name: resolve
                displayName: Force full build

          # Reuse the PR build job template; each build job gates on buildGroups.
          - template: .pipelines/templates/pr-build-all-jobs.yml@self
            parameters:
              detectChangesJob: seed_build_groups

          - job: longhaul_test
            displayName: Longhaul test
            timeoutInMinutes: 600
            dependsOn:
              - build_ccr_governance_containers
              - build_ccr_containers
              - build_ccf_containers
              - build_cgs_containers
              - build_analytics_workload_containers
            condition: succeeded()
            pool:
              type: linux
              isCustom: true
              name: cleanroom-emu-ado
            variables:
              repoRoot: "$(Build.SourcesDirectory)"
              ob_outputDirectory: "$(Build.SourcesDirectory)/out"
              outDir: "$(Build.SourcesDirectory)/test/onebox/workload-samples/generated"
            steps:
              - checkout: self
                submodules: recursive
              - template: .pipelines/templates/steps/setup-docker-on-data-disk.yml@self
              - template: .pipelines/templates/steps/login-to-azure.yml@self
              - pwsh: |
                  ./samples/ccf/azcli/deploy-ccf.ps1 -infraType virtual -nodeCount 1 `
                    -confidentialRecovery -registry acr -repo $(ACR_URL) -tag $(Build.BuildId)
                displayName: Deploy virtual CCF network with confidential recovery
                workingDirectory: $(repoRoot)
              # test-workloads/setup-env (virtual) + test-big-data-analytics +
              # test-big-data-analytics-longhaul (duration/pause/chaos params).
              - template: .pipelines/templates/steps/workload-setup-env.yml@self
                parameters:
                  infraType: virtual
                  location: centralindia
                  outDir: $(outDir)
              - template: .pipelines/templates/steps/workload-test-big-data-analytics.yml@self
                parameters:
                  location: centralindia
                  deploymentConfigDir: $(outDir)
              - template: .pipelines/templates/steps/workload-test-big-data-analytics-longhaul.yml@self
                parameters:
                  deploymentConfigDir: $(outDir)
                  durationMinutes: "${{ parameters.durationMinutes }}"
                  pauseMinutes: "${{ parameters.pauseMinutes }}"
                  enableChaos: "${{ parameters.enableChaos }}"
              # Custom (isCustom bare-VM) jobs allow only the single drop artifact;
              # copy results into $(ob_outputDirectory) instead of a named upload.
              - bash: |
                  mkdir -p "$(ob_outputDirectory)/bigdata-longhaul-results"
                  cp -r "$(outDir)/." "$(ob_outputDirectory)/bigdata-longhaul-results/" || true
                displayName: Collect test results (into drop)
                condition: not(canceled())
              - pwsh: docker logs ccf-provider-client-1
                displayName: Dump ccf-provider-client logs
                condition: not(canceled())
                workingDirectory: $(repoRoot)
              - pwsh: ./samples/ccf/azcli/show-docker-logs.ps1 -label "ccf-network/type=recovery-agent"
                displayName: Dump ccf-recovery-agent logs
                condition: not(canceled())
                workingDirectory: $(repoRoot)
              - pwsh: ./samples/ccf/azcli/show-docker-logs.ps1 -label "ccf-recovery-service/type=recovery-service"
                displayName: Dump ccf-recovery-service logs
                condition: not(canceled())
                workingDirectory: $(repoRoot)
              - pwsh: |
                  ./test/onebox/multi-party-collab/big-data-query-analytics/delete-bucket.ps1 -bucketName "consumer-input-$(Agent.JobName)-$(Build.BuildId)"
                  ./test/onebox/multi-party-collab/big-data-query-analytics/delete-bucket.ps1 -bucketName "consumer-output-$(Agent.JobName)-$(Build.BuildId)"
                displayName: Delete AWS buckets
                condition: succeeded()
                workingDirectory: $(repoRoot)
              - pwsh: ./test/onebox/multi-party-collab/remove-resources.ps1 -tag "github_actions=$(Agent.JobName)-$(Build.BuildId)"
                displayName: Delete resource groups
                condition: succeeded()
                workingDirectory: $(repoRoot)
