################################################################################
# Cleanup Stale PR Resources (migrated from
# .github/workflows/cleanup_stale_pr_resources.yml). Single job / single script;
# runs daily via `schedules:` cron "30 18 * * *" (00:00 IST). Extends OneBranch NonOfficial.
# See MIGRATION.md for detail.
################################################################################

schedules:
  - cron: "30 18 * * *"
    displayName: Daily stale PR resource cleanup (00:00 IST / 18:30 UTC)
    branches:
      include:
        - develop
    always: true

trigger: none
pr: none

name: cleanup-stale-pr-resources-$(Date:yyyyMMdd).$(Rev:r)

variables:
  # OneBranch `pool: { type: linux }` runs the job inside this container image;
  # it must be declared or the "Initialize containers" step fails to pull.
  - name: LinuxContainerImage
    value: "mcr.microsoft.com/onebranch/azurelinux/build:3.0"

resources:
  repositories:
    - repository: templates
      type: git
      name: OneBranch.Pipelines/GovernedTemplates
      ref: refs/heads/main

extends:
  template: v2/OneBranch.NonOfficial.CrossPlat.yml@templates
  parameters:
    cloudvault:
      enabled: false
    globalSdl:
      # This is a pure `az`/PowerShell cleanup job that produces NO build
      # artifacts, so SDL dependency-provenance tracking has no meaning here.
      # The analyzer's buildwatch logs every file access; over the ~2h run of
      # thousands of `az` calls that reached ~2.4 GB and its 5-min teardown
      # (Kusto upload) timed out -> partiallySucceeded. Disable it for cleanup.
      disableDependencyAnalyzer: true
      tsa:
        enabled: false
      policheck:
        break: true
    stages:
      - stage: Cleanup
        displayName: Cleanup stale PR resources
        jobs:
          - template: .pipelines/templates/cleanup-stale-pr-resources-jobs.yml@self
