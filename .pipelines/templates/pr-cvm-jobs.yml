# CVM Attestation PR test job (migrated from .github/workflows/pr_cvm.yml).
# Consumed by PR-Validation.yml. checkout -> setup-docker -> login ->
# deploy-cvm.ps1 -> test-cvm-attestation-agent.ps1. See MIGRATION.md for detail.
#   6. actions/upload-artifact@v7                  -> PublishPipelineArtifact@1
#   7. az group delete (cleanup)                   -> pwsh step (ambient az session)
#
# The `environment: pr` + `vars.AZURE_*` from GitHub map to an ADO variable group
# (name TBD) and the OIDC service connection; the SC encapsulates client/tenant/
# subscription, so the AZURE_* values are no longer passed for login.
#
# Pool note: this job needs a Docker daemon (setup-docker-on-data-disk + CVM
# deploy). On OneBranch, `type: linux` is a governed container; if it lacks
# docker-in-docker this must target a 1ES pool that provides Docker (see optimus's
# separate docker/kind pool). Marked TODO until the ADO 1ES pool is provisioned.
#
# Parameters let the PR-Validation orchestrator gate this job on the resolver's
# output (dependsOn detect_changes + condition contains(testStages,'test-cvm')).
# Defaults make the template runnable standalone.
#
# NOTE: pr_validation.yml currently keeps test-cvm DISABLED (GitHub-hosted runners
# can't reach the CVM over public IP). Kept here for when a same-VNet pool exists.

parameters:
  - name: dependsOn
    type: object
    default: []
  - name: condition
    type: string
    default: ""

jobs:
  - job: cvm_attestation
    displayName: CVM Attestation
    timeoutInMinutes: 120
    dependsOn: ${{ parameters.dependsOn }}
    ${{ if ne(parameters.condition, '') }}:
      condition: ${{ parameters.condition }}
    pool:
      type: linux # TODO(Phase 1C): switch to the 1ES pool that provides a Docker daemon
    variables:
      ob_outputDirectory: "$(Build.SourcesDirectory)/out"
      repoRoot: "$(Build.SourcesDirectory)/azure-cleanroom"
      # OIDC service connection replaces ./.github/actions/login-to-azure + the
      # AZURE_* repo vars. TODO(Phase 1C): set to the created SC name.
      azureServiceConnection: "cleanroom-pr-oidc"
    steps:
      - checkout: self
        submodules: recursive

      - template: steps/setup-docker-on-data-disk.yml

      - template: steps/login-to-azure.yml

      - pwsh: ./src/cvm/tests/deploy-cvm.ps1
        displayName: Deploy Azure Confidential VM
        workingDirectory: $(repoRoot)

      - pwsh: ./src/cvm/tests/test-cvm-attestation-agent.ps1
        displayName: Test CVM attestation agent
        workingDirectory: $(repoRoot)

      - task: PublishPipelineArtifact@1
        displayName: Upload generated artifacts
        condition: always()
        inputs:
          targetPath: $(repoRoot)/src/cvm/tests/generated
          artifact: cvm-attestation

      - pwsh: |
          $deploy = Get-Content ./src/cvm/tests/generated/cvm-deploy.json | ConvertFrom-Json
          Write-Host "Deleting resource group $($deploy.resource_group) ..."
          az group delete --name $deploy.resource_group --yes --no-wait
        displayName: Delete resource group
        condition: succeeded()
        workingDirectory: $(repoRoot)
