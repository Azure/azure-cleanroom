# Job definitions for the CGS CCF Tests PR validation, referenced via `- template:`
# (mirrors optimus's convention of keeping job lists in a separate template file).
#
# Migrated from .github/workflows/pr_cgs_tests.yml (a `workflow_call` reusable
# sub-workflow invoked by the pr_validation orchestrator). Because it is
# `workflow_call`, it becomes a JOB TEMPLATE consumed by PR-Validation.yml — not
# a standalone pipeline.
#
# Original GitHub Actions steps -> ADO mapping:
#   1. actions/checkout@v4 (submodules recursive) -> checkout: self (submodules)
#   2. ./.github/actions/setup-docker-on-data-disk -> steps/setup-docker-on-data-disk.yml
#   3. ./.github/actions/login-to-azure            -> steps/login-to-azure.yml (OIDC SC)
#   4. pwsh ./src/governance/test/deploy-cgs.ps1                 -> pwsh step
#   5. pwsh ./src/governance/test/roles/deploy-cgs.ps1          -> pwsh step
#   6. pwsh ./src/governance/test/multi-ccf/deploy-cgs.ps1      -> pwsh step
#   7. pwsh ./src/governance/test/test-cgs.ps1                  -> pwsh step
#   8. dorny/test-reporter@v3 (dotnet-trx)         -> PublishTestResults@2 (VSTest/.trx)
#
# The `environment: pr` + `vars.AZURE_*` from GitHub map to an ADO variable group
# (name TBD) and the OIDC service connection; the SC encapsulates client/tenant/
# subscription, so the AZURE_* values are no longer passed for login.
#
# Pool note: this job needs a Docker daemon (setup-docker-on-data-disk + CCF
# deploy). On OneBranch, `type: linux` is a governed container; if it lacks
# docker-in-docker this must target a 1ES pool that provides Docker (see optimus's
# separate docker/kind pool). Marked TODO until the ADO 1ES pool is provisioned.
#
# Parameters let the PR-Validation orchestrator gate this job on the resolver's
# output (dependsOn detect_changes + condition contains(testStages,'test-cgs')).
# Defaults make the template runnable standalone.

parameters:
  - name: dependsOn
    type: object
    default: []
  - name: condition
    type: string
    default: ""

jobs:
  - job: cgs_test
    displayName: CGS CCF Tests
    timeoutInMinutes: 120
    dependsOn: ${{ parameters.dependsOn }}
    ${{ if ne(parameters.condition, '') }}:
      condition: ${{ parameters.condition }}
    pool:
      type: linux # TODO(Phase 1C): switch to the 1ES pool that provides a Docker daemon
    variables:
      ob_outputDirectory: "$(Build.SourcesDirectory)/out"
      repoRoot: "$(Build.SourcesDirectory)/azure-cleanroom"
      # OIDC service connection replaces ./.github/actions/login-to-azure + the
      # AZURE_* repo vars. TODO(Phase 1C): set to the created SC name.
      azureServiceConnection: "cleanroom-pr-oidc"
    steps:
      - checkout: self
        submodules: recursive

      - template: steps/setup-docker-on-data-disk.yml

      - template: steps/login-to-azure.yml

      - pwsh: ./src/governance/test/deploy-cgs.ps1
        displayName: Deploy CGS
        workingDirectory: $(repoRoot)

      - pwsh: ./src/governance/test/roles/deploy-cgs.ps1
        displayName: Deploy CGS for roles testing
        workingDirectory: $(repoRoot)

      - pwsh: ./src/governance/test/multi-ccf/deploy-cgs.ps1
        displayName: Deploy CGS for testing with headers
        workingDirectory: $(repoRoot)

      - pwsh: ./src/governance/test/test-cgs.ps1
        displayName: Run CGS unit tests
        workingDirectory: $(repoRoot)

      - task: PublishTestResults@2
        displayName: CGS test reporter
        condition: always()
        inputs:
          testResultsFormat: VSTest
          testResultsFiles: $(repoRoot)/src/governance/test/TestResults/TestRunResult-CGS.trx
          testRunTitle: Test report-CGS
