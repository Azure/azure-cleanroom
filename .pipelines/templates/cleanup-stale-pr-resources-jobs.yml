# Job definitions for CleanupStalePrResources.yml, referenced via `- template:`
# (mirrors optimus's convention of keeping job lists in a separate template file).
#
# Migrated from the single `cleanup-stale-resources` job in
# .github/workflows/cleanup_stale_pr_resources.yml.
#
# Original GitHub Actions steps:
#   1. actions/checkout@v4 (submodules: recursive)   -> checkout: self (submodules)
#   2. ./.github/actions/setup-docker-on-data-disk    -> steps template below
#   3. azure/login@v2 (client/tenant/subscription)    -> AzureCLI@2 + OIDC svc conn
#   4. pwsh ./.github/scripts/cleanup.ps1 -environment "pr"
#
# Pool note: this job needs a Docker daemon (setup-docker-on-data-disk). On
# OneBranch, `type: linux` is a governed container; if it lacks docker-in-docker
# this must target a 1ES pool that provides Docker (see optimus's separate
# docker/kind pool). Marked TODO until the ADO 1ES pool is provisioned (Phase 1C).

jobs:
  - job: cleanup_stale_pr_resources
    displayName: Cleanup stale PR resources
    timeoutInMinutes: 120
    pool:
      type: linux # TODO(Phase 1C): switch to the 1ES pool that provides a Docker daemon
    variables:
      ob_outputDirectory: "$(Build.SourcesDirectory)/out"
      # OIDC service connection replaces azure/login + the AZURE_* repo vars.
      # TODO(Phase 1C): set to the created Azure service connection name.
      azureServiceConnection: "cleanroom-pr-cleanup-oidc"
    steps:
      - checkout: self
        submodules: recursive

      - template: steps/setup-docker-on-data-disk.yml

      - task: AzureCLI@2
        displayName: Execute cleanup
        inputs:
          azureSubscription: $(azureServiceConnection)
          scriptType: pscore
          scriptLocation: inlineScript
          workingDirectory: $(Build.SourcesDirectory)/azure-cleanroom
          inlineScript: |
            pwsh ./.github/scripts/cleanup.ps1 -environment "pr"
