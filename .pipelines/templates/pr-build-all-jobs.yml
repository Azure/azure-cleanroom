      type: linux
      isCustom: true
      name: cleanroom-emu-ado
    variables:
      repoRoot: "$(Build.SourcesDirectory)"
      ob_outputDirectory: "$(Build.SourcesDirectory)/out"
    steps:
      - checkout: self
        submodules: recursive
      - template: steps/build-container-prereqs.yml
        parameters:
          installYaml: true
          installConfcom: true
      - pwsh: ./build/ccr/build-ccr-digests.ps1 -repo $(ACR_URL) -tag $(Build.BuildId) -push
        displayName: Build ccr containers policy
        workingDirectory: $(repoRoot)
      - pwsh: ./build/ccr/build-cvm-measurements.ps1 -repo $(ACR_URL) -tag $(Build.BuildId) -push
        displayName: Build cvm measurements document
        workingDirectory: $(repoRoot)
      - pwsh: ./build/ccr/build-cvm-measurements-virtual.ps1 -repo $(ACR_URL) -tag $(Build.BuildId) -push
        displayName: Build cvm virtual measurements document
        workingDirectory: $(repoRoot)
      - pwsh: ./build/inferencing/build-inferencing-digests.ps1 -repo $(ACR_URL) -tag $(Build.BuildId) -push
        displayName: Build inferencing digests document
        workingDirectory: $(repoRoot)

  # === more container builds ==================================================
  - job: build_cleanroom_cluster_containers
    displayName: Build cleanroom-cluster containers
    timeoutInMinutes: 120
    dependsOn:
      - ${{ parameters.detectChangesJob }}
    condition: and(succeeded(), or(eq(dependencies.${{ parameters.detectChangesJob }}.outputs['resolve.buildGroups'], 'all'), contains(dependencies.${{ parameters.detectChangesJob }}.outputs['resolve.buildGroups'], 'build-cleanroom-cluster-containers')))
    pool:
      type: linux
      isCustom: true
      name: cleanroom-emu-ado
    strategy:
      matrix:
        cleanroom-cluster-provider-client: { container: cleanroom-cluster-provider-client }
    variables:
      repoRoot: "$(Build.SourcesDirectory)"
      ob_outputDirectory: "$(Build.SourcesDirectory)/out"
    steps:
      - checkout: self
        submodules: recursive
      - template: steps/build-container-prereqs.yml
      - pwsh: ./build/cleanroom-cluster/build-cleanroom-cluster-infra-containers.ps1 -tag $(Build.BuildId) -repo $(ACR_URL) -push -containers $(container)
        displayName: Build $(container)
        workingDirectory: $(repoRoot)

