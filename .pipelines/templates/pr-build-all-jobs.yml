      - checkout: self
        submodules: recursive
      - template: steps/build-container-prereqs.yml
        parameters:
          addDockerUser: true
      - pwsh: ./build/workloads/analytics/build-workload-infra-containers.ps1 -tag $(Build.BuildId) -repo $(ACR_URL) -push -containers $(container)
