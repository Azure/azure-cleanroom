    timeoutInMinutes: 120
    dependsOn:
      - ${{ parameters.detectChangesJob }}
      - build_frontend_service_containers
      - build_cgs_containers
      - build_ccr_proxy_containers
      - build_ccr_governance_containers
      - build_ccr_skr_containers
    condition: and(succeeded(), or(eq(dependencies.${{ parameters.detectChangesJob }}.outputs['resolve.buildGroups'], 'all'), contains(dependencies.${{ parameters.detectChangesJob }}.outputs['resolve.buildGroups'], 'build-frontend-service-containers')))
    pool:
      type: linux
      isCustom: true
      name: cleanroom-emu-ado
    strategy:
