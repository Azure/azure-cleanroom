      - pwsh: ./build/onebox/build-containers.ps1 -tag $(Build.BuildId) -repo $(ACR_URL) -containers $(container)
        displayName: Build k8s node containers
        workingDirectory: $(repoRoot)

  - job: build_ccf_containers
    displayName: Build ccf containers
    timeoutInMinutes: 120
    dependsOn:
      - ${{ parameters.detectChangesJob }}
    condition: and(succeeded(), or(eq(dependencies.${{ parameters.detectChangesJob }}.outputs['resolve.buildGroups'], 'all'), contains(dependencies.${{ parameters.detectChangesJob }}.outputs['resolve.buildGroups'], 'build-ccf-containers')))
    pool:
