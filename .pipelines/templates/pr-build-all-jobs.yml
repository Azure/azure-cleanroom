    displayName: Build ccf container policies
    timeoutInMinutes: 120
    dependsOn:
      - ${{ parameters.detectChangesJob }}
      - build_ccf_containers
      - build_ccr_governance_containers
      - build_cvm_containers
    condition: and(succeeded(), or(eq(dependencies.${{ parameters.detectChangesJob }}.outputs['resolve.buildGroups'], 'all'), contains(dependencies.${{ parameters.detectChangesJob }}.outputs['resolve.buildGroups'], 'build-ccf-containers')))
    pool:
      type: linux
      isCustom: true
      name: cleanroom-emu-ado
    strategy:
      matrix:
        ccf-network: { container: ccf-network }
        ccf-recovery-service: { container: ccf-recovery-service }
        ccf-consortium-manager: { container: ccf-consortium-manager }
    variables:
      repoRoot: "$(Build.SourcesDirectory)"
      ob_outputDirectory: "$(Build.SourcesDirectory)/out"
    steps:
      - checkout: self
        submodules: recursive
      - template: steps/build-container-prereqs.yml
        parameters:
          installYaml: true
          installConfcom: true
      - pwsh: ./build/ccf/build-ccf-infra-containers-policy.ps1 -tag $(Build.BuildId) -repo $(ACR_URL) -push -containers $(container)
        displayName: Build $(container) policy
        workingDirectory: $(repoRoot)

  - job: build_ccr_container_policies
    displayName: Build ccr container policies
    timeoutInMinutes: 120
    dependsOn:
      - ${{ parameters.detectChangesJob }}
      - build_ccr_containers
      - build_ccr_governance_containers
      - build_ccr_proxy_containers
      - build_ccr_skr_containers
    condition: and(succeeded(), or(eq(dependencies.${{ parameters.detectChangesJob }}.outputs['resolve.buildGroups'], 'all'), contains(dependencies.${{ parameters.detectChangesJob }}.outputs['resolve.buildGroups'], 'build-ccr-containers')))
