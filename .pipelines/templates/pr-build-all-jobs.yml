      - pwsh: ./build/workloads/inferencing/build-workload-infra-containers-policy.ps1 -tag $(Build.BuildId) -repo $(ACR_URL) -push -containers $(container)
        displayName: Build $(container) policy
        workingDirectory: $(repoRoot)

  - job: build_frontend_service_containers
    displayName: Build frontend-service containers
    timeoutInMinutes: 120
    dependsOn:
      - ${{ parameters.detectChangesJob }}
    condition: and(succeeded(), or(eq(dependencies.${{ parameters.detectChangesJob }}.outputs['resolve.buildGroups'], 'all'), contains(dependencies.${{ parameters.detectChangesJob }}.outputs['resolve.buildGroups'], 'build-frontend-service-containers')))
    pool:
      type: linux
      isCustom: true
      name: cleanroom-emu-ado
    strategy:
      matrix:
        frontend-service: { container: frontend-service }
    variables:
      repoRoot: "$(Build.SourcesDirectory)"
      ob_outputDirectory: "$(Build.SourcesDirectory)/out"
    steps:
      - checkout: self
        submodules: recursive
      - template: steps/build-container-prereqs.yml
        parameters:
          addDockerUser: true
          installYaml: true
      - pwsh: ./build/workloads/frontend/build-frontend-infra-containers.ps1 -tag $(Build.BuildId) -repo $(ACR_URL) -push -containers $(container)
