    timeoutInMinutes: 120
    dependsOn:
      - ${{ parameters.detectChangesJob }}
    condition: and(succeeded(), or(eq(dependencies.${{ parameters.detectChangesJob }}.outputs['resolve.buildGroups'], 'all'), contains(dependencies.${{ parameters.detectChangesJob }}.outputs['resolve.buildGroups'], 'build-cleanroom-operator-containers')))
