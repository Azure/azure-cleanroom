################################################################################
# PR Validation build jobs (migrated from .github/workflows/pr_build_all.yml).
# Consumed by PR-Validation.yml. Each job takes `dependsOn: detect_changes` (plus
# real cross-job needs) and a runtime `condition:` on
# dependencies.detect_changes.outputs['resolve.buildGroups'] (all | build-x), so
# skipped build groups skip dependent policy jobs. The common step prefix is in
# steps/build-container-prereqs.yml; common env in variables/build-common.yml;
# GitHub matrix `container: [a,b]` -> ADO strategy.matrix. See MIGRATION.md.
################################################################################

parameters:
  # Name of the resolver job whose `resolve.buildGroups` output gates these jobs.
  - name: detectChangesJob
    type: string
    default: detect_changes

jobs:
  # === basic container builds ================================================
  - job: build_ccr_governance_containers
    displayName: Build ccr-governance containers
    timeoutInMinutes: 120
    dependsOn:
      - ${{ parameters.detectChangesJob }}
    condition: and(succeeded(), or(eq(dependencies.${{ parameters.detectChangesJob }}.outputs['resolve.buildGroups'], 'all'), contains(dependencies.${{ parameters.detectChangesJob }}.outputs['resolve.buildGroups'], 'build-ccr-governance-containers')))
    pool:
      type: linux
      isCustom: true
      name: cleanroom-emu-ado
    strategy:
      matrix:
        ccr-governance: { container: ccr-governance }
        ccr-governance-virtual: { container: ccr-governance-virtual }
    variables:
      repoRoot: "$(Build.SourcesDirectory)"
      ob_outputDirectory: "$(Build.SourcesDirectory)/out"
    steps:
      - checkout: self
        submodules: recursive
      - template: steps/build-container-prereqs.yml
        parameters:
          addDockerUser: true
      - pwsh: ./build/onebox/build-containers.ps1 -tag $(Build.BuildId) -repo $(ACR_URL) -containers $(container)
        displayName: Build governance containers
        workingDirectory: $(repoRoot)

  - job: build_ccr_proxy_containers
    displayName: Build ccr-proxy containers
    timeoutInMinutes: 120
    dependsOn:
      - ${{ parameters.detectChangesJob }}
    condition: and(succeeded(), or(eq(dependencies.${{ parameters.detectChangesJob }}.outputs['resolve.buildGroups'], 'all'), contains(dependencies.${{ parameters.detectChangesJob }}.outputs['resolve.buildGroups'], 'build-ccr-proxy-containers')))
    pool:
      type: linux
      isCustom: true
      name: cleanroom-emu-ado
    strategy:
      matrix:
        ccr-proxy: { container: ccr-proxy }
    variables:
      repoRoot: "$(Build.SourcesDirectory)"
      ob_outputDirectory: "$(Build.SourcesDirectory)/out"
    steps:
      - checkout: self
        submodules: recursive
      - template: steps/build-container-prereqs.yml
        parameters:
          addDockerUser: true
      - pwsh: ./build/onebox/build-containers.ps1 -tag $(Build.BuildId) -repo $(ACR_URL) -containers $(container)
        displayName: Build proxy containers
        workingDirectory: $(repoRoot)

  - job: build_ccr_skr_containers
