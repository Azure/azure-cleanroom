      - pwsh: ./build/workloads/inferencing/build-workload-infra-containers.ps1 -tag $(Build.BuildId) -repo $(ACR_URL) -push -containers $(container)
        displayName: Build workload containers
        workingDirectory: $(repoRoot)

  - job: build_kserve_inferencing_workload_container_policies
    displayName: Build kserve-inferencing-workload container policies
    timeoutInMinutes: 120
    dependsOn:
      - ${{ parameters.detectChangesJob }}
      - build_kserve_inferencing_workload_containers
      - build_ccr_governance_containers
      - build_ccr_proxy_containers
      - build_ccr_skr_containers
      - build_ccr_containers
    condition: and(succeeded(), or(eq(dependencies.${{ parameters.detectChangesJob }}.outputs['resolve.buildGroups'], 'all'), contains(dependencies.${{ parameters.detectChangesJob }}.outputs['resolve.buildGroups'], 'build-kserve-inferencing-workload-containers')))
