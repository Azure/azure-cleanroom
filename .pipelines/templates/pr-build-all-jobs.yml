      - pwsh: ./build/onebox/build-containers.ps1 -tag $(Build.BuildId) -repo $(ACR_URL) -containers $(container)
        displayName: Build SKR containers
        workingDirectory: $(repoRoot)

  - job: build_ccr_tools_containers
