      - pwsh: ./build/ccf/build-ccf-infra-containers.ps1 -tag $(Build.BuildId) -repo $(ACR_URL) -push -containers $(container)
        displayName: Build ccf containers
        workingDirectory: $(repoRoot)

  - job: build_cgs_containers
