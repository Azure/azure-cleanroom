    timeoutInMinutes: 120
    dependsOn:
      - ${{ parameters.detectChangesJob }}
    condition: and(succeeded(), or(eq(dependencies.${{ parameters.detectChangesJob }}.outputs['resolve.buildGroups'], 'all'), contains(dependencies.${{ parameters.detectChangesJob }}.outputs['resolve.buildGroups'], 'build-analytics-workload-containers')))
    pool:
      type: linux
      isCustom: true
      name: cleanroom-emu-ado
    strategy:
      matrix:
        cleanroom-spark-analytics-agent: { container: cleanroom-spark-analytics-agent }
        cleanroom-spark-frontend: { container: cleanroom-spark-frontend }
        cleanroom-spark-analytics-app: { container: cleanroom-spark-analytics-app }
    variables:
      repoRoot: "$(Build.SourcesDirectory)"
      ob_outputDirectory: "$(Build.SourcesDirectory)/out"
