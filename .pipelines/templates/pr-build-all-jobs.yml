          installConfcom: true
      - pwsh: ./build/workloads/frontend/build-frontend-infra-containers-policy.ps1 -tag $(Build.BuildId) -repo $(ACR_URL) -push -containers $(container)
        displayName: Build $(container) policy
        workingDirectory: $(repoRoot)

  # === standalone builds ======================================================
  - job: build_azcliext_cleanroom
    displayName: Build azcliext-cleanroom
    timeoutInMinutes: 120
    dependsOn:
      - ${{ parameters.detectChangesJob }}
    condition: and(succeeded(), or(eq(dependencies.${{ parameters.detectChangesJob }}.outputs['resolve.buildGroups'], 'all'), contains(dependencies.${{ parameters.detectChangesJob }}.outputs['resolve.buildGroups'], 'build-azcliext-cleanroom')))
    pool:
      type: linux
      isCustom: true
      name: cleanroom-emu-ado
    variables:
      repoRoot: "$(Build.SourcesDirectory)"
      ob_outputDirectory: "$(Build.SourcesDirectory)/out"
    steps:
      - checkout: self
        submodules: recursive
      - template: steps/build-container-prereqs.yml
      - pwsh: ./build/build-azcliext-cleanroom.ps1 -tag $(Build.BuildId) -repo $(ACR_URL) -push -skipInstall
        displayName: Build cleanroom az cli extension
        workingDirectory: $(repoRoot)

  # generate-dev-up-env: no docker/login; runs whenever any build group is set.
  - job: generate_dev_up_env
    displayName: Generate dev-up.env
    timeoutInMinutes: 60
    dependsOn:
      - ${{ parameters.detectChangesJob }}
    condition: and(succeeded(), ne(dependencies.${{ parameters.detectChangesJob }}.outputs['resolve.buildGroups'], ''))
    pool:
      type: linux
      isCustom: true
      name: cleanroom-emu-ado
    variables:
      repoRoot: "$(Build.SourcesDirectory)"
      ob_outputDirectory: "$(Build.SourcesDirectory)/out"
    steps:
      - checkout: self
        submodules: recursive
      - pwsh: |
          pwsh ./build/onebox/generate-dev-up-env.ps1 `
            -repo $(ACR_URL) `
            -tag $(Build.BuildId) `
            -outDir $(Agent.TempDirectory)/dev-up-env
        displayName: Generate dev-up.env
        workingDirectory: $(repoRoot)
      # Custom (isCustom bare-VM) jobs allow only the single drop_<stage>_<job>
      # artifact, so copy into $(ob_outputDirectory) instead of a named upload.
      - bash: |
          mkdir -p "$(ob_outputDirectory)/dev-up-env"
          cp "$(Agent.TempDirectory)/dev-up-env/dev-up.env" "$(ob_outputDirectory)/dev-up-env/" || true
        displayName: Collect dev-up.env (into drop)

  # === publish release-metadata catalog ======================================
  # Mirrors GitHub pr_build_all.yml's `publish-release-metadata-catalog` job.
  # After every image/policy group is pushed to the PR registry, publish the
  # versioned release-metadata catalog once as an OCI artifact
  # (oci://$(ACR_URL)/release-metadata). Post-#866 (helm-based image resolution),
  # `az cleanroom ccf network up` resolves images from this catalog, so any
  # consumer that deploys a CCF network from the PR registry (PR-Validation CCF
  # jobs, TpcdsStresstest) needs it — the ADO migration originally dropped it.
  # Refs point at the ACR (-publishRepo == -repo), not MCR (images aren't
  # mirrored). -skipMissing tolerates groups not built this run; -includeDevImages
  # adds the onebox-only local-skr the virtual provider resolves from the catalog.
  - job: publish_release_metadata_catalog
    displayName: Publish release-metadata catalog
    timeoutInMinutes: 60
    dependsOn:
      - ${{ parameters.detectChangesJob }}
      - build_ccr_governance_containers
      - build_ccr_proxy_containers
      - build_ccr_skr_containers
      - build_ccr_tools_containers
      - build_cvm_containers
      - build_k8s_node_containers
      - build_ccf_containers
      - build_cgs_containers
      - build_ccr_containers
      - build_ccf_container_policies
      - build_ccr_container_policies
      - build_cleanroom_cluster_containers
      - build_cleanroom_operator_containers
      - build_analytics_workload_containers
      - build_analytics_workload_container_policies
      - build_kserve_inferencing_workload_containers
      - build_kserve_inferencing_workload_container_policies
      - build_frontend_service_containers
      - build_frontend_service_container_policies
      - build_azcliext_cleanroom
    # GitHub: if !cancelled() && !contains(needs.*.result, 'failure'). ADO
    # not(failed()) allows succeeded+skipped deps (some build groups may be
    # skipped by buildGroups); only run when a build group was actually produced.
    condition: and(not(failed()), not(canceled()), ne(dependencies.${{ parameters.detectChangesJob }}.outputs['resolve.buildGroups'], ''))
    pool:
      type: linux
      isCustom: true
      name: cleanroom-emu-ado
    variables:
      repoRoot: "$(Build.SourcesDirectory)"
      ob_outputDirectory: "$(Build.SourcesDirectory)/out"
    steps:
      - checkout: self
        submodules: recursive
      - template: steps/build-container-prereqs.yml
        parameters:
          installYaml: true
      - pwsh: |
          if (-not (Get-Command helm -ErrorAction SilentlyContinue)) {
            Write-Host "helm not found; installing helm 3."
            curl -sSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          }
          ./build/build-release-metadata-chart.ps1 -repo $(ACR_URL) -publishRepo $(ACR_URL) -tag $(Build.BuildId) -push -skipMissing -includeDevImages
        displayName: Publish release-metadata catalog
        workingDirectory: $(repoRoot)
