# Step template: `az acr login` deriving the ACR name from a full repo URL.
# Migrated from the repeated composite step:
#   $pattern = '(.*?)(\.azurecr\.io.*)'; if ("<repo>" -match $pattern) { $acrName = $matches[1] } else { $acrName = "<repo>" }; az acr login -n $acrName
# Assumes an authenticated az session (call steps/login-to-azure.yml first).

parameters:
  - name: repo
    type: string
    default: "$(ACR_URL)"

steps:
  - pwsh: |
      $pattern = '(.*?)(\.azurecr\.io.*)'
      if ("${{ parameters.repo }}" -match $pattern) { $acrName = $matches[1] } else { $acrName = "${{ parameters.repo }}" }
      az acr login -n $acrName
    displayName: Log in to Azure Container Registry
    workingDirectory: $(repoRoot)
