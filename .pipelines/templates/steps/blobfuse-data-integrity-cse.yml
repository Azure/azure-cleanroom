# blobfuse-data-integrity-cse step template (migrated from
# .github/actions/blobfuse-data-integrity-cse). Uses steps/blobfuse-mount.yml for
# the source mount plus an inline plain+encrypted (CSE) mount pair; gen-test-config
# reads STO_ACC_NAME/ACCOUNT_TYPE/ACCOUNT_ENDPOINT/LOG_FILE_PATH/BLOCK_SIZE_MB/
# MEM_SIZE_MB/DISK_SIZE_MB from the job-level env. See MIGRATION.md for detail.

parameters:
  - name: account_type
    type: string
  - name: mount_dir_plain
    type: string
  - name: mount_dir_encrypted
    type: string
  - name: temp_dir_plain
    type: string
  - name: temp_dir_encrypted
    type: string
  - name: config_file_plain
    type: string
  - name: config_file_encrypted
    type: string
  - name: mount_dir_source
    type: string
  - name: temp_dir_source
    type: string
  - name: config_file_source
    type: string

steps:
  # 1-2. source mount config
  - bash: |
      blobfuse2 gen-test-config \
        --config-file=./test/blobfuse/testdata/config/block_cache.yaml \
        --container-name=$(SOURCE_CONTAINER_NAME) \
        --temp-path=${{ parameters.temp_dir_source }} \
        --output-file=${{ parameters.config_file_source }}
    displayName: Create config file for source mount
    workingDirectory: $(repoRoot)
    env:
      STO_ACC_NAME: $(STORAGE_ACCOUNT)
      ACCOUNT_TYPE: ${{ parameters.account_type }}
      ACCOUNT_ENDPOINT: $(STORAGE_ACCOUNT_ENDPOINT)
      # gen-test-config substitutes these placeholders in block_cache.yaml. The
      # GitHub action set them; the ADO migration dropped them, leaving the
      # config fields empty. Restore them (values mirror the GitHub action).
      LOG_FILE_PATH: $(repoRoot)/blobfuse2-source-logs.txt
      BLOCK_SIZE_MB: "16"
      MEM_SIZE_MB: "2048"
      DISK_SIZE_MB: "6144"
  - bash: cat ${{ parameters.config_file_source }}
    displayName: Print config file for source mount
  # 3. source mount
  - template: blobfuse-mount.yml
    parameters:
      mount_dir: ${{ parameters.mount_dir_source }}
      temp_dir: ${{ parameters.temp_dir_source }}
      mountStep: sudo AZURE_CONFIG_DIR="$HOME/.azure" blobfuse2 mount ${{ parameters.mount_dir_source }} --config-file=${{ parameters.config_file_source }} -o allow_other
  # 4-5. plain mount config
  - bash: |
      blobfuse2 gen-test-config \
        --config-file=./test/blobfuse/testdata/config/block_cache.yaml \
        --container-name=$(CONTAINER_NAME) \
        --temp-path=${{ parameters.temp_dir_plain }} \
        --output-file=${{ parameters.config_file_plain }}
    displayName: Create config file for plain mount
    workingDirectory: $(repoRoot)
    env:
      STO_ACC_NAME: $(STORAGE_ACCOUNT)
      ACCOUNT_TYPE: ${{ parameters.account_type }}
      ACCOUNT_ENDPOINT: $(STORAGE_ACCOUNT_ENDPOINT)
      LOG_FILE_PATH: $(repoRoot)/blobfuse2-plain-logs.txt
      BLOCK_SIZE_MB: "16"
      MEM_SIZE_MB: "2048"
      DISK_SIZE_MB: "6144"
  - bash: cat ${{ parameters.config_file_plain }}
    displayName: Print config file for plain mount
  # 6-7. encrypted mount config
  - bash: |
      blobfuse2 gen-test-config \
        --config-file=./test/blobfuse/testdata/config/encryptor.yaml \
        --container-name=$(CONTAINER_NAME) \
        --temp-path=${{ parameters.temp_dir_encrypted }} \
        --output-file=${{ parameters.config_file_encrypted }}
    displayName: Create config file for encrypted mount
    workingDirectory: $(repoRoot)
    env:
      STO_ACC_NAME: $(STORAGE_ACCOUNT)
      ACCOUNT_TYPE: ${{ parameters.account_type }}
      ACCOUNT_ENDPOINT: $(STORAGE_ACCOUNT_ENDPOINT)
      # CRITICAL: PLAIN_MOUNT fills encryptor.encrypted-mount-path in
      # encryptor.yaml. Without it that field is empty and the encryptor plugin
      # has no target to route writes -> every write returns Input/output error
      # (the exact CSE failure). The GitHub action set PLAIN_MOUNT; the ADO
      # migration dropped it.
      PLAIN_MOUNT: ${{ parameters.mount_dir_plain }}
      LOG_FILE_PATH: $(repoRoot)/blobfuse2-encrypted-logs.txt
      BLOCK_SIZE_MB: "16"
      MEM_SIZE_MB: "2048"
      DISK_SIZE_MB: "6144"
  - bash: cat ${{ parameters.config_file_encrypted }}
    displayName: Print config file for encrypted mount
  # 8. collect config files into the OneBranch drop. Custom (isCustom bare-VM)
  # jobs allow ONLY the single drop_<stage>_<job> artifact, so named
  # PublishPipelineArtifact uploads are rejected — copy into $(ob_outputDirectory)
  # instead, which OneBranch auto-publishes as that one drop.
  - bash: |
      mkdir -p "$(ob_outputDirectory)/blobfuse-cse-config"
      cp "${{ parameters.config_file_plain }}" "$(ob_outputDirectory)/blobfuse-cse-config/" || true
    displayName: Collect config files (into drop)
    condition: not(canceled())
  # 9. CSE mount (plain + encrypted)
  - template: blobfuse-mount.yml
    parameters:
      mount_dir: ${{ parameters.mount_dir_plain }}
      temp_dir: ${{ parameters.temp_dir_plain }}
      mountStep: sudo AZURE_CONFIG_DIR="$HOME/.azure" blobfuse2 mount ${{ parameters.mount_dir_plain }} --config-file=${{ parameters.config_file_plain }} -o allow_other
  - template: blobfuse-mount.yml
    parameters:
      mount_dir: ${{ parameters.mount_dir_encrypted }}
      temp_dir: ${{ parameters.temp_dir_encrypted }}
      mountStep: sudo AZURE_CONFIG_DIR="$HOME/.azure" BLOBFUSE_PLUGIN_PATH=$(repoRoot)/external/azure-storage-fuse/encryptor/encryptor.so blobfuse2 mount ${{ parameters.mount_dir_encrypted }} --config-file=${{ parameters.config_file_encrypted }} -o allow_other
      pluginPath: $(repoRoot)/external/azure-storage-fuse/encryptor/encryptor.so
  # 10. generate files in source mount
  - bash: |
      sudo mkdir -p /mnt/parallel-tmp
      sudo chmod 1777 /mnt/parallel-tmp
      mkdir -p ${{ parameters.mount_dir_source }}/testData
      for i in {1,3,7,16,50,100,1024,20480,51200}; do echo $i; done | \
      parallel --will-cite --tmpdir /mnt/parallel-tmp -j 5 'head -c {}M < /dev/urandom > ${{ parameters.mount_dir_source }}/testData/testfile_{}'
      ls -lh ${{ parameters.mount_dir_source }}/testData/testfile_*
    displayName: Generate files in source mount
    env:
      TMPDIR: /mnt/parallel-tmp
  # 11. upload test files to cse mount
  - bash: |
      for i in {1,3,7,16,50,100,1024,20480,51200}; do echo $i; done | \
      parallel --will-cite --tmpdir /mnt/parallel-tmp -j 5 'cp ${{ parameters.mount_dir_source }}/testData/testfile_{} ${{ parameters.mount_dir_encrypted }}/testfile_{}'
      ls -lh ${{ parameters.mount_dir_encrypted }}/testfile_*
    displayName: Upload test files to cse mount
    env:
      TMPDIR: /mnt/parallel-tmp
  # 12. unmount
  - bash: |
      sudo blobfuse2 unmount ${{ parameters.mount_dir_plain }}
      sudo blobfuse2 unmount ${{ parameters.mount_dir_encrypted }}
      sleep 60s
    displayName: Unmount
  # 13. remount read-only. The encryptor reads the raw encrypted blobs THROUGH
  # the plain mount (encryptor.encrypted-mount-path == the plain mount dir), so
  # BOTH mounts must be re-established — matching GitHub's blobfuse-cse-mount with
  # ro_mount=true: plain mounted `-o ro`, encrypted mounted via the plugin (no ro).
  # Re-mounting only the encrypted mount (as before) leaves the encryptor with no
  # backing store -> files appear missing -> sha256 "No such file or directory".
  - template: blobfuse-mount.yml
    parameters:
      mount_dir: ${{ parameters.mount_dir_plain }}
      temp_dir: ${{ parameters.temp_dir_plain }}
      mountStep: sudo AZURE_CONFIG_DIR="$HOME/.azure" blobfuse2 mount ${{ parameters.mount_dir_plain }} --config-file=${{ parameters.config_file_plain }} -o allow_other -o ro
      ro_mount: "true"
  - template: blobfuse-mount.yml
    parameters:
      mount_dir: ${{ parameters.mount_dir_encrypted }}
      temp_dir: ${{ parameters.temp_dir_encrypted }}
      mountStep: sudo AZURE_CONFIG_DIR="$HOME/.azure" BLOBFUSE_PLUGIN_PATH=$(repoRoot)/external/azure-storage-fuse/encryptor/encryptor.so blobfuse2 mount ${{ parameters.mount_dir_encrypted }} --config-file=${{ parameters.config_file_encrypted }} -o allow_other
      pluginPath: $(repoRoot)/external/azure-storage-fuse/encryptor/encryptor.so
  # 14. compare sha256
  - bash: |
      for i in {1,3,7,16,50,100,1024,20480,51200}; do
        local_sha256=$(sha256sum ${{ parameters.mount_dir_source }}/testData/testfile_$i | cut -d ' ' -f 1)
        remote_sha256=$(sha256sum ${{ parameters.mount_dir_encrypted }}/testfile_$i | cut -d ' ' -f 1)
        if [ "$local_sha256" != "$remote_sha256" ]; then
          echo "SHA256 mismatch for file $i: $local_sha256 (local) vs $remote_sha256 (remote)"
          echo "Data integrity validation failed."
          exit 1
        fi
      done
    displayName: Compare SHA256 checksums
  # 15. blobfuse logs
  - bash: |
      cat $(repoRoot)/blobfuse2-source-logs.txt || true
      cat $(repoRoot)/blobfuse2-plain-logs.txt || true
      cat $(repoRoot)/blobfuse2-encrypted-logs.txt || true
    displayName: Blobfuse logs
    continueOnError: true
    condition: always()
  # 16. collect blobfuse logs into the OneBranch drop (see note at step 8).
  - bash: |
      mkdir -p "$(ob_outputDirectory)/blobfuse-cse-logs"
      cp "$(repoRoot)/blobfuse2-encrypted-logs.txt" "$(ob_outputDirectory)/blobfuse-cse-logs/" || true
    displayName: Collect blobfuse logs (into drop)
    condition: always()
