# Step template: dump `docker logs` for a set of containers as a single
# diagnostic step. Migrated from the many `docker logs <container>` diagnostic
# steps in pr_ccf.yml (each was `if: !cancelled()`).

parameters:
  - name: displayName
    type: string
    default: Dump docker logs
  - name: containers
    type: object

steps:
  - bash: |
      for c in ${{ join(' ', parameters.containers) }}; do
        echo "===== docker logs $c ====="
        docker logs "$c" || true
      done
    displayName: ${{ parameters.displayName }}
    condition: not(canceled())
    continueOnError: true
    workingDirectory: $(repoRoot)
