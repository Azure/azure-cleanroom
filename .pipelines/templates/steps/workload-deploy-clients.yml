# Step template: deploy the governance client + cluster provider client from a
# deployment-config.json (shared by the workload analytics/kserve/longhaul tests).
# Migrated from the repeated composite steps in test-workloads/* and
# test-big-data-analytics/test-kserve-inferencing.

parameters:
  - name: deploymentConfigDir
    type: string

steps:
  - bash: |
      set -euo pipefail
      cfg="${{ parameters.deploymentConfigDir }}/deployment-config.json"
      project_name=$(jq -r '.project_name' "$cfg")
      initial_member_name=$(jq -r '.initial_member_name' "$cfg")
      ccf_endpoint=$(jq -r '.ccf_endpoint' "$cfg")
      out_dir=$(jq -r '.out_dir' "$cfg")
      az cleanroom governance client deploy \
        --ccf-endpoint "$ccf_endpoint" \
        --signing-key "$out_dir/ccf/${initial_member_name}_privk.pem" \
        --signing-cert "$out_dir/ccf/${initial_member_name}_cert.pem" \
        --service-cert "$out_dir/ccf/service_cert.pem" \
        --name "$project_name" \
        --env-file "$out_dir/ccf/governance-client.env"
    displayName: Deploy governance client
    workingDirectory: $(repoRoot)
  - bash: |
      set -euo pipefail
      cfg="${{ parameters.deploymentConfigDir }}/deployment-config.json"
      cluster_provider_project_name=$(jq -r '.cluster_provider_project_name' "$cfg")
      out_dir=$(jq -r '.out_dir' "$cfg")
      az cleanroom cluster provider deploy --name "$cluster_provider_project_name" --env-file "$out_dir/cl-cluster/cluster-provider.env"
    displayName: Deploy cluster provider client
    workingDirectory: $(repoRoot)
