# Builds ONE container image with plain `docker build` on the isCustom pool and
# saves it to a tarball drop (custom-pool counterpart of build-container-image.yml).
# Decouples Release-and-Test from the governed pool / internal feed / CodeQL: the
# Dockerfiles self-compile against the public NuGet feed. Output tarball is consumed
# unchanged by steps/release-container.yml. See MIGRATION.md for detail.

parameters:
  - name: name
    type: string
  - name: dockerfile
    type: string
  - name: context
    type: string
    default: "."
  - name: buildArgs
    type: string
    default: ""
  # Runtime build tag, passed from the build job as an output variable.
  - name: buildTag
    type: string
    default: "$(buildTag)"

steps:
  - bash: |
      set -euo pipefail
      buildArgs=""
      if [ -n "${{ parameters.buildArgs }}" ]; then
        buildArgs="${{ parameters.buildArgs }}"
      fi
      docker build \
        -t "${{ parameters.name }}:${{ parameters.buildTag }}" \
        -f "${{ parameters.dockerfile }}" \
        $buildArgs \
        "${{ parameters.context }}"
      # docker save to images/<name>-<tag>.tar; the build_images job publishes the
      # whole images/ dir once as the isCustom drop release-container.yml consumes.
      mkdir -p "$(ob_outputDirectory)/images"
      docker save "${{ parameters.name }}:${{ parameters.buildTag }}" \
        -o "$(ob_outputDirectory)/images/${{ parameters.name }}-${{ parameters.buildTag }}.tar"
      # Free the local image to conserve disk on the bare-VM agent.
      docker image rm "${{ parameters.name }}:${{ parameters.buildTag }}" --force || true
    displayName: Build ${{ parameters.name }} image (custom)
    workingDirectory: $(repoRoot)
