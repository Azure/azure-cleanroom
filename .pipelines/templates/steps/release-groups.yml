# Step template: ALL release-* promotion groups, gated by releaseType.
# Migrated from the 24 release-* composites wrapped by release.yml /
# release-and-test.yml. Used by both:
#   - Release/OneBranch.Release.Prod.yml  (environment: unlisted, needsAttestation: true)
#   - templates/release-and-test-jobs.yml (environment: internal, needsAttestation: param)
#
# Container promotions use steps/release-container.yml; script-based groups
# (policies/digests/version-documents/bundles) use steps/release-script.yml.
# Attestation is provided by the OneBranch Official template's governed signing.

parameters:
  - name: tag
    type: string
  - name: environment
    type: string
  - name: releaseType
    type: string
  - name: needsAttestation
    type: boolean
    default: true

steps:
  # --- cleanroom-containers (images + ccr artefacts + digests + version doc) --
  - ${{ if contains(parameters.releaseType, 'cleanroom-containers') }}:
      - ${{ each c in split('ccr-init,identity,blobfuse-launcher,s3fs-launcher,code-launcher,otel-collector,ccr-secrets,ccr-governance,cleanroom-client,ccr-proxy,ccr-proxy-ext-processor,skr', ',') }}:
          - template: release-container.yml
            parameters:
              name: ${{ c }}
              tag: ${{ parameters.tag }}
              environment: ${{ parameters.environment }}
              needsAttestation: ${{ parameters.needsAttestation }}
      - template: release-container.yml
        parameters:
          name: cvm/cvm-attestation-agent
          artefactName: cvm-attestation-agent
          tag: ${{ parameters.tag }}
          environment: ${{ parameters.environment }}
          needsAttestation: ${{ parameters.needsAttestation }}
      # release-cleanroom-artefacts (ccr artefacts + cvm measurements)
      - template: release-script.yml
        parameters:
          displayName: Release cleanroom (ccr) artefacts
          tag: ${{ parameters.tag }}
          environment: ${{ parameters.environment }}
          script: |
            ./build/ccr/build-ccr-artefacts.ps1 -repo $repo -tag $tag -push -outputPath $(repoRoot)/ccr-artefacts
            ./build/ccr/build-cvm-measurements.ps1 -repo $repo -tag $tag -push
      - bash: |
          set -euo pipefail
          mkdir -p "$(ob_outputDirectory)/ccr-artefacts"
          cp "$(repoRoot)/ccr-artefacts/ccr-governance-opa-policy.tar.gz" "$(ob_outputDirectory)/ccr-artefacts/ccr-governance-opa-policy-${{ parameters.environment }}.tar.gz"
        displayName: Collect ccr-governance-opa-policy (into drop)
      # release-sidecar-digests
      - template: release-script.yml
        parameters:
          displayName: Release sidecar digests
          tag: ${{ parameters.tag }}
          environment: ${{ parameters.environment }}
          installConfcom: true
          script: |
            ./build/ccr/build-ccr-digests.ps1 -repo $repo -tag $tag -push
      - bash: |
          set -euo pipefail
          mkdir -p "$(ob_outputDirectory)"
          cp "$(repoRoot)/sidecar-digests.yaml" "$(ob_outputDirectory)/sidecar-digests-${{ parameters.environment }}.yaml"
        displayName: Collect sidecar-digests.yaml (into drop)
      # release-ccr-containers-version-document
      - template: release-script.yml
        parameters:
          displayName: Release ccr containers version document
          tag: ${{ parameters.tag }}
          environment: ${{ parameters.environment }}
          script: |
            pwsh ./.github/scripts/release-ccr-version-document.ps1 -tag $tag -environment $environment -registryName $registry
      # release cli/cleanroom-whl (az cleanroom CLI extension wheel).
      # The build publishes the wheel INSIDE drop_Build_build_artefacts under
      # cleanroom-cli-whl/cleanroom-<ver>-py2.py3-none-any.whl. GitHub's release
      # had a dedicated release-azcliext-cleanroom action that oras-pushed it to
      # <registry>/<environment>/azurecleanroom/cli/cleanroom-whl:<tag>; the ADO
      # migration dropped it, so every BVT failed at 'Install az cleanroom
      # extension' with 'cli/cleanroom-whl:<tag>: not found' (verified 175776207).
      # Pattern-download the wheel from the drop, stage it, then oras-push it to
      # the release registry at the same tag the BVTs pull with.
      - task: DownloadPipelineArtifact@2
        displayName: Download cleanroom-cli wheel
        inputs:
          artifact: drop_Build_build_artefacts
          patterns: "cleanroom-cli-whl/**"
          path: $(Pipeline.Workspace)/cleanroom-cli-whl-dl
      - bash: |
          set -euo pipefail
          cp "$(Pipeline.Workspace)/cleanroom-cli-whl-dl/cleanroom-cli-whl/"cleanroom-*-py2.py3-none-any.whl "$(repoRoot)/"
        displayName: Stage cleanroom-cli wheel
        workingDirectory: $(repoRoot)
      - template: release-script.yml
        parameters:
          displayName: Release cli/cleanroom-whl
          tag: ${{ parameters.tag }}
          environment: ${{ parameters.environment }}
          script: |
            $whl = (Get-ChildItem ./cleanroom-*-py2.py3-none-any.whl | Select-Object -First 1).Name
            oras push "$repo/cli/cleanroom-whl:$tag" "./$whl"

  # --- governance-client-containers (+ version documents) --------------------
  - ${{ if contains(parameters.releaseType, 'governance-client-containers') }}:
      - ${{ each c in split('cgs-client,cgs-ui', ',') }}:
          - template: release-container.yml
            parameters:
              name: ${{ c }}
              tag: ${{ parameters.tag }}
              environment: ${{ parameters.environment }}
              needsAttestation: ${{ parameters.needsAttestation }}
      - template: release-script.yml
        parameters:
          displayName: Release governance client version documents
          tag: ${{ parameters.tag }}
          environment: ${{ parameters.environment }}
          script: |
            ./.github/scripts/release-governance-client-version-documents.ps1 -tag $tag -environment $environment -registryName $registry

  # --- cgs-js-app (+ version document) ---------------------------------------
  - ${{ if contains(parameters.releaseType, 'cgs-js-app') }}:
      # The build publishes the bundle INSIDE drop_Build_build_artefacts under
      # cgs-js-app/cgs-js-app-<tag>.json (not as a standalone artifact); pattern-
      # download it, then stage to $(repoRoot)/bundle.json where the oras release
      # script below does `cat bundle.json`.
      - task: DownloadPipelineArtifact@2
        displayName: Download cgs-js-app bundle
        inputs:
          artifact: drop_Build_build_artefacts
          patterns: "cgs-js-app/cgs-js-app-${{ parameters.tag }}.json"
          path: $(Pipeline.Workspace)/cgs-js-app-dl
      - bash: |
          set -euo pipefail
          cp "$(Pipeline.Workspace)/cgs-js-app-dl/cgs-js-app/cgs-js-app-${{ parameters.tag }}.json" "$(repoRoot)/bundle.json"
        displayName: Stage cgs-js-app bundle.json
        workingDirectory: $(repoRoot)
      - template: release-script.yml
        parameters:
          displayName: Release cgs-js-app bundle
          tag: ${{ parameters.tag }}
          environment: ${{ parameters.environment }}
          script: |
            $bundle_digest = cat bundle.json | jq -S -j | sha256sum | cut -d ' ' -f 1
            oras push "$repo/cgs-js-app:$tag,$bundle_digest,latest" ./bundle.json --annotation "cleanroom.version=$tag" --annotation "bundle.json.digest=sha256:$bundle_digest"
      - template: release-script.yml
        parameters:
          displayName: Release cgs-js-app version document
          tag: ${{ parameters.tag }}
          environment: ${{ parameters.environment }}
          script: |
            pwsh ./.github/scripts/release-ccf-artefact-version-document.ps1 -containerName cgs-js-app -tag $tag -environment $environment -registryName $registry

  # --- cgs-constitution (+ version document) ---------------------------------
  - ${{ if contains(parameters.releaseType, 'cgs-constitution') }}:
      # Same as cgs-js-app: the constitution is inside drop_Build_build_artefacts
      # under cgs-constitution/cgs-constitution-<tag>.json; stage to
      # $(repoRoot)/constitution.json for the oras release script.
      - task: DownloadPipelineArtifact@2
        displayName: Download cgs-constitution
        inputs:
          artifact: drop_Build_build_artefacts
          patterns: "cgs-constitution/cgs-constitution-${{ parameters.tag }}.json"
          path: $(Pipeline.Workspace)/cgs-constitution-dl
      - bash: |
          set -euo pipefail
          cp "$(Pipeline.Workspace)/cgs-constitution-dl/cgs-constitution/cgs-constitution-${{ parameters.tag }}.json" "$(repoRoot)/constitution.json"
        displayName: Stage cgs-constitution constitution.json
        workingDirectory: $(repoRoot)
      - template: release-script.yml
        parameters:
          displayName: Release cgs-constitution
          tag: ${{ parameters.tag }}
          environment: ${{ parameters.environment }}
          script: |
            $constitution_digest = cat constitution.json | jq -S -j | sha256sum | cut -d ' ' -f 1
            oras push "$repo/cgs-constitution:$tag,$constitution_digest,latest" ./constitution.json --annotation "cleanroom.version=$tag" --annotation "constitution.js.digest=sha256:$constitution_digest"
      - template: release-script.yml
        parameters:
          displayName: Release cgs-constitution version document
          tag: ${{ parameters.tag }}
          environment: ${{ parameters.environment }}
          script: |
            pwsh ./.github/scripts/release-ccf-artefact-version-document.ps1 -containerName cgs-constitution -tag $tag -environment $environment -registryName $registry

  # --- ccf-provider-client ---------------------------------------------------
  - ${{ if contains(parameters.releaseType, 'ccf-provider-client') }}:
      - template: release-container.yml
        parameters:
          name: ccf/ccf-provider-client
          artefactName: ccf-provider-client
          tag: ${{ parameters.tag }}
          environment: ${{ parameters.environment }}
          needsAttestation: ${{ parameters.needsAttestation }}

  # --- ccf-network-containers (+ security policy) ----------------------------
  - ${{ if contains(parameters.releaseType, 'ccf-network-containers') }}:
      # ccr-proxy / skr are named identically as image + registry path.
      - ${{ each c in split('ccr-proxy,skr', ',') }}:
          - template: release-container.yml
            parameters:
              name: ${{ c }}
              tag: ${{ parameters.tag }}
              environment: ${{ parameters.environment }}
              needsAttestation: ${{ parameters.needsAttestation }}
      # The CCF/CVM images use a SLASHED registry path (name) but the build saves
      # the tarball with a DASHED filename (artefactName) — e.g. registry
      # ccf/app/run-js/snp but tarball ccf-app-run-js-snp-<tag>.tar. Pass both so
      # release-container.yml downloads/docker-loads the dash tarball while pushing
      # to the slash registry path. (Fixes 175685600 'open .../ccf/app/run-js/snp-
      # <tag>.tar: no such file'.)
      - template: release-container.yml
        parameters:
          name: ccf/app/run-js/snp
          artefactName: ccf-app-run-js-snp
          tag: ${{ parameters.tag }}
          environment: ${{ parameters.environment }}
          needsAttestation: ${{ parameters.needsAttestation }}
      - template: release-container.yml
        parameters:
          name: ccf/app/run-js/virtual
          artefactName: ccf-app-run-js-virtual
          tag: ${{ parameters.tag }}
          environment: ${{ parameters.environment }}
          needsAttestation: ${{ parameters.needsAttestation }}
      - template: release-container.yml
        parameters:
          name: ccf/ccf-recovery-agent
          artefactName: ccf-recovery-agent
          tag: ${{ parameters.tag }}
          environment: ${{ parameters.environment }}
          needsAttestation: ${{ parameters.needsAttestation }}
      - template: release-container.yml
        parameters:
          name: cvm/cvm-attestation-verifier
          artefactName: cvm-attestation-verifier
          tag: ${{ parameters.tag }}
          environment: ${{ parameters.environment }}
          needsAttestation: ${{ parameters.needsAttestation }}
      - template: release-script.yml
        parameters:
          displayName: Release ccf network security policy
          tag: ${{ parameters.tag }}
          environment: ${{ parameters.environment }}
          installConfcom: true
          script: |
            ./build/ccf/build-ccf-network-security-policy.ps1 -repo $repo -tag $tag -push

  # --- ccf-recovery-service-containers (+ security policy) -------------------
  - ${{ if contains(parameters.releaseType, 'ccf-recovery-service-containers') }}:
      - ${{ each c in split('ccr-proxy,skr', ',') }}:
          - template: release-container.yml
            parameters:
              name: ${{ c }}
              tag: ${{ parameters.tag }}
              environment: ${{ parameters.environment }}
              needsAttestation: ${{ parameters.needsAttestation }}
      # Slashed registry path, dashed tarball (see ccf-network-containers note).
      - template: release-container.yml
        parameters:
          name: ccf/ccf-recovery-service
          artefactName: ccf-recovery-service
          tag: ${{ parameters.tag }}
          environment: ${{ parameters.environment }}
          needsAttestation: ${{ parameters.needsAttestation }}
      - template: release-script.yml
        parameters:
          displayName: Release ccf recovery service security policy
          tag: ${{ parameters.tag }}
          environment: ${{ parameters.environment }}
          installConfcom: true
          script: |
            ./build/ccf/build-ccf-recovery-service-security-policy.ps1 -repo $repo -tag $tag -push

  # --- ccf-consortium-manager-containers (+ security policy) -----------------
  - ${{ if contains(parameters.releaseType, 'ccf-consortium-manager-containers') }}:
      - ${{ each c in split('ccr-proxy,skr', ',') }}:
          - template: release-container.yml
            parameters:
              name: ${{ c }}
              tag: ${{ parameters.tag }}
              environment: ${{ parameters.environment }}
              needsAttestation: ${{ parameters.needsAttestation }}
      # Slashed registry path, dashed tarball (see ccf-network-containers note).
      - template: release-container.yml
        parameters:
          name: ccf/ccf-consortium-manager
          artefactName: ccf-consortium-manager
          tag: ${{ parameters.tag }}
          environment: ${{ parameters.environment }}
          needsAttestation: ${{ parameters.needsAttestation }}
      - template: release-script.yml
        parameters:
          displayName: Release ccf consortium manager security policy
          tag: ${{ parameters.tag }}
          environment: ${{ parameters.environment }}
          installConfcom: true
          script: |
            ./build/ccf/build-ccf-consortium-manager-security-policy.ps1 -repo $repo -tag $tag -push

  # --- cleanroom-workload-infra-containers (+ policy) ------------------------
  - ${{ if contains(parameters.releaseType, 'cleanroom-workload-infra-containers') }}:
      # Promote the 6 workload-infra images to <acr>/internal/.../workloads/<name>
      # BEFORE the policy scripts run — those scripts `oras manifest fetch` the
      # pushed image to compute its digest, so the image must already be in the
      # registry (verified 175745161: 'workloads/cleanroom-spark-analytics-agent:
      # <tag>: not found'). Slashed registry path (name) + dashed tarball
      # (artefactName), same pattern as the CCF/CVM images.
      - ${{ each w in split('cleanroom-spark-analytics-agent,cleanroom-spark-frontend,cleanroom-spark-analytics-app,kserve-inferencing-agent,kserve-inferencing-frontend,ohttp-gateway', ',') }}:
          - template: release-container.yml
            parameters:
              name: workloads/${{ w }}
              artefactName: ${{ w }}
              tag: ${{ parameters.tag }}
              environment: ${{ parameters.environment }}
              needsAttestation: ${{ parameters.needsAttestation }}
      - template: release-script.yml
        parameters:
          displayName: Release cleanroom workload infra containers policy
          tag: ${{ parameters.tag }}
          environment: ${{ parameters.environment }}
          installConfcom: true
          script: |
            ./build/workloads/analytics/build-workload-infra-containers-policy.ps1 -repo $repo -tag $tag -push
            ./build/workloads/inferencing/build-workload-infra-containers-policy.ps1 -repo $repo -tag $tag -push
      # Publish the workload helm charts (frontend-service + spark + kserve).
      # GitHub released these via release-cleanroom-workload-infra-containers ->
      # release-helm-chart (helm push <chart>.tgz oci://<reg>/<env>/.../workloads/helm);
      # the ADO migration dropped it, so setup-env-aks failed at 'FetchReference'
      # workloads/helm/frontend-service:<semver>: not found (verified 175802243).
      # Charts are pure repo YAML — package them directly from src (no image build)
      # with the semantic version, then helm push to the release registry.
      - template: release-script.yml
        parameters:
          displayName: Release workload helm charts
          tag: ${{ parameters.tag }}
          environment: ${{ parameters.environment }}
          script: |
            . ./build/helpers.ps1
            $semanticVersion = Get-SemanticVersionFromTag $tag
            if (-not (Get-Command helm -ErrorAction SilentlyContinue)) {
              Write-Host "helm not found; installing helm 3."
              curl -sSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
            }
            $charts = [ordered]@{
              "frontend-service"                = "src/workloads/frontend/helmchart"
              "cleanroom-spark-analytics-agent" = "src/workloads/analytics/cleanroom-spark-analytics-agent/helm/chart"
              "cleanroom-spark-frontend"        = "src/workloads/analytics/cleanroom-spark-frontend/helm/chart"
              "kserve-inferencing-agent"        = "src/workloads/inferencing/kserve-inferencing-agent/helm/chart"
              "kserve-inferencing-frontend"     = "src/workloads/inferencing/kserve-inferencing-frontend/helm/chart"
            }
            foreach ($name in $charts.Keys) {
              Write-Host "Packaging + pushing helm chart $name ($semanticVersion)"
              Push-Location $charts[$name]
              helm package . --version $semanticVersion --destination .
              $tgz = (Get-ChildItem -Filter "*.tgz" | Select-Object -First 1).FullName
              helm push $tgz "oci://$repo/workloads/helm"
              Pop-Location
            }

  # --- cleanroom-cluster-provider-client (+ version documents) ---------------
  - ${{ if contains(parameters.releaseType, 'cleanroom-cluster-provider-client') }}:
      - template: release-container.yml
        parameters:
          name: cleanroom-cluster/cleanroom-cluster-provider-client
          artefactName: cleanroom-cluster-provider-client
          tag: ${{ parameters.tag }}
          environment: ${{ parameters.environment }}
          needsAttestation: ${{ parameters.needsAttestation }}
      - template: release-script.yml
        parameters:
          displayName: Release cleanroom cluster provider client version documents
          tag: ${{ parameters.tag }}
          environment: ${{ parameters.environment }}
          script: |
            ./.github/scripts/release-cleanroom-cluster-provider-client-version-documents.ps1 -tag $tag -environment $environment -registryName $registry

  # --- frontend-service (+ security policy) ----------------------------------
  - ${{ if contains(parameters.releaseType, 'frontend-service') }}:
      - ${{ each c in split('frontend-service,cgs-client,ccr-proxy,skr', ',') }}:
          - template: release-container.yml
            parameters:
              name: ${{ c }}
              tag: ${{ parameters.tag }}
              environment: ${{ parameters.environment }}
              needsAttestation: ${{ parameters.needsAttestation }}
      - template: release-script.yml
        parameters:
          displayName: Release frontend service security policy
          tag: ${{ parameters.tag }}
          environment: ${{ parameters.environment }}
          installConfcom: true
          script: |
            ./build/workloads/frontend/build-frontend-service-security-policy.ps1 -repo $repo -tag $tag -push

  # --- release-metadata catalog (OCI dogfood chart) --------------------------
  # MUST be LAST: build-release-metadata-chart.ps1 resolves every catalog image's
  # digest from the just-promoted images (Get-Digest via oras), so all the image
  # groups above must already be pushed.
  #
  # GitHub published the versioned release-metadata catalog two ways: the
  # MCR/pages-branch flow (.github/scripts/release-metadata.ps1, gh release +
  # chart-releaser — GitHub-specific, not migrated) and the onebox/CI OCI dogfood
  # chart (build/build-release-metadata-chart.ps1 -push -> oci://<repo>/release-metadata,
  # e.g. pr_build_all.yml). The ADO migration dropped the latter, so every
  # CCF-based BVT (nginx-hello, ml-training, encrypted-storage, and setup-env-aks's
  # CCF-Governance) failed at 'az cleanroom ccf network up' resolving
  # oci://<acr>/internal/azurecleanroom/release-metadata:<ver>: not found
  # (verified build 175909946). This is the same class of dropped-release-artefact
  # gap as the cli/cleanroom-whl and workloads/helm fixes above.
  #
  # Publish the OCI catalog for the 'internal' (release-to-test / BVT dogfood)
  # environment only; the prod MCR/pages catalog is owned by the GitHub flow.
  - ${{ if eq(parameters.environment, 'internal') }}:
      - template: release-script.yml
        parameters:
          displayName: Release release-metadata catalog
          tag: ${{ parameters.tag }}
          environment: ${{ parameters.environment }}
          script: |
            if (-not (Get-Command helm -ErrorAction SilentlyContinue)) {
              Write-Host "helm not found; installing helm 3."
              curl -sSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
            }
            # -skipMissing: release-to-test promotes the shipped surface; tolerate any
            # catalog entry not built this cycle (matches the CI dogfood invocation).
            # publishRepo == repo: BVTs pull images from the internal ACR, not MCR.
            ./build/build-release-metadata-chart.ps1 -repo $repo -publishRepo $repo -tag $tag -push -skipMissing
