# Step template: test-workloads/test-big-data-analytics composite.
# Migrated from .github/actions/test-workloads/test-big-data-analytics/action.yml.
# Assumes login-to-azure.yml already ran.

parameters:
  - name: location
    type: string
  - name: deploymentConfigDir
    type: string
  - name: repo
    type: string
    default: "$(ACR_URL)"
  - name: tag
    type: string
    default: "$(Build.BuildId)"

steps:
  - template: install-cleanroom-cli.yml
    parameters:
      repo: ${{ parameters.repo }}
      tag: ${{ parameters.tag }}
  - template: install-uv-python.yml
  - template: workload-deploy-clients.yml
    parameters:
      deploymentConfigDir: ${{ parameters.deploymentConfigDir }}
  - pwsh: |
      pwsh -Command ./test/onebox/multi-party-collab/big-data-query-analytics/test-big-data-analytics.ps1 `
          -deploymentConfigDir "${{ parameters.deploymentConfigDir }}" -additionalFormats json,parquet -location ${{ parameters.location }}
    displayName: Run big data analytics test
    workingDirectory: $(repoRoot)
  - bash: |
      cluster_provider_project_name=$(jq -r '.cluster_provider_project_name' "${{ parameters.deploymentConfigDir }}/deployment-config.json")
      docker compose -p "$cluster_provider_project_name" logs
    displayName: Dump cleanroom-cluster-provider logs
    condition: not(canceled())
    workingDirectory: $(repoRoot)
  - pwsh: |
      ./test/onebox/multi-party-collab/big-data-query-analytics/dump-cleanroom-cluster-logs.ps1 `
          -kubeConfig "${{ parameters.deploymentConfigDir }}/cl-cluster/k8s-credentials.yaml" `
          -jobConfig "${{ parameters.deploymentConfigDir }}/analytics-workload/jobConfig.json"
    displayName: Dump cleanroom-cluster logs
    condition: not(canceled())
    workingDirectory: $(repoRoot)
