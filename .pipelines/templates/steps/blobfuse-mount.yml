# Step template: blobfuse-mount composite.
# Migrated from .github/actions/blobfuse-mount/action.yml.
# `mountStep` is the shell command that mounts the container (passed verbatim,
# as GitHub did). `pluginPath` sets BLOBFUSE_PLUGIN_PATH for encrypted mounts.

parameters:
  - name: mount_dir
    type: string
  - name: temp_dir
    type: string
  - name: mountStep
    type: string
  - name: ro_mount
    type: string
    default: "false"
  - name: pluginPath
    type: string
    default: ""

steps:
  - bash: |
      mkdir -p ${{ parameters.mount_dir }}
      mkdir -p ${{ parameters.temp_dir }}
    displayName: Create mount + temp dir
  - template: blobfuse-cleanup.yml
    parameters:
      mount_dir: ${{ parameters.mount_dir }}
      temp_dir: ${{ parameters.temp_dir }}
  - bash: |
      ${{ parameters.mountStep }}
    displayName: Mount the container
    ${{ if ne(parameters.pluginPath, '') }}:
      env:
        BLOBFUSE_PLUGIN_PATH: ${{ parameters.pluginPath }}
  - bash: sleep 10s
    displayName: Waiting for mount
  - bash: sudo ps -aux | grep blobfuse2
    displayName: Print process info
