# Atomic step template: promote ONE built container image to a target registry
# with SBOM attach + optional attestation. Converts the GitHub composite action
#   .github/actions/release-container
# which did: download image tarball -> az login -> az acr login -> docker load ->
#   tag -> push (:tag and :latest) -> oras attach SBOM -> attest-artefact, with a
#   released-containers-<env>.txt runtime dedup guard.
#
# The registry path convention is preserved exactly:
#   <registry>.azurecr.io/<environment>/azurecleanroom/<name>:<tag>  (+ :latest)
#
# Runs on a `pool: { type: linux }` job (needs docker + az CLI; NOT the docker
# image-build pool). The image tarball comes from the official build's published
# pipeline artifact (name = artefactName, file <artefactName>-<tag>.tar).
#
# The old released-containers-<env>.txt runtime dedup is handled at authoring
# time: each unique image is released ONCE in release-to-prod-jobs.yml.
#
# TODO(Phase 1C): azureServiceConnection here must be the PROD RELEASE OIDC SC
#   (was secrets.RELEASE_CLIENT_ID/TENANT_ID/SUBSCRIPTION_ID) — distinct from the
#   PR SC. registryName was secrets.RELEASE_ACR_NAME (variable group).
# TODO(Phase 1E): GitHub `attest-artefact` (build provenance/attestation) has no
#   1:1 ADO task — OneBranch Official provides governed provenance/signing. Confirm
#   coverage; the explicit attest step is left as a documented no-op below.

parameters:
  - name: name
    type: string
  - name: artefactName
    type: string
    default: "" # defaults to name when empty
  - name: tag
    type: string
  - name: environment
    type: string
  - name: registryName
    type: string
    default: "$(RELEASE_ACR_NAME)"
  - name: azureServiceConnection
    type: string
    default: "$(releaseServiceConnection)"
  - name: needsAttestation
    type: boolean
    default: true

steps:
  - task: DownloadPipelineArtifact@2
    displayName: Download ${{ coalesce(parameters.artefactName, parameters.name) }} image tarball
    inputs:
      artifact: ${{ coalesce(parameters.artefactName, parameters.name) }}
      path: $(Pipeline.Workspace)/release/${{ parameters.name }}

  - task: AzureCLI@2
    displayName: Promote ${{ parameters.name }} to ${{ parameters.environment }}
    inputs:
      azureSubscription: ${{ parameters.azureServiceConnection }}
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -euo pipefail
        REG="${{ parameters.registryName }}"
        ENVIRONMENT="${{ parameters.environment }}"
        NAME="${{ parameters.name }}"
        ARTEFACT="${{ coalesce(parameters.artefactName, parameters.name) }}"
        TAG="${{ parameters.tag }}"
        SRC="$(Pipeline.Workspace)/release/${NAME}"

        az acr login --name "$REG"

        docker load -i "${SRC}/${ARTEFACT}-${TAG}.tar"
        TARGET="${REG}.azurecr.io/${ENVIRONMENT}/azurecleanroom/${NAME}"

        docker tag "${ARTEFACT}:${TAG}" "${TARGET}:${TAG}"
        docker push "${TARGET}:${TAG}"

        # Attach the SBOM (spdx) generated alongside the image.
        oras attach --artifact-type application/spdx+json "${TARGET}:${TAG}" \
          "${SRC}/${ARTEFACT}-sbom/_manifest/spdx_2.2/manifest.spdx.json" \
          --disable-path-validation

        docker tag "${ARTEFACT}:${TAG}" "${TARGET}:latest"
        docker push "${TARGET}:latest"

  - ${{ if parameters.needsAttestation }}:
      - pwsh: |
          Write-Host "TODO(Phase 1E): GitHub attest-artefact has no 1:1 ADO task."
          Write-Host "OneBranch Official provides governed provenance/signing for ${{ parameters.name }}:${{ parameters.tag }}."
        displayName: "TODO: Attest ${{ parameters.name }}"
