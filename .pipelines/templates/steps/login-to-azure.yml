# Step template migrated from the composite action:
#   .github/actions/login-to-azure/action.yml
#
# GitHub Actions version logged in with a federated OIDC token and then spawned a
# background loop that re-ran `az login` every 4 minutes (the OIDC client
# assertion expires after 5 min; long-running jobs would otherwise fail with
# AADSTS700024). See:
#   https://github.com/Azure/azure-cli/issues/28708#issuecomment-2049014471
#
# In Azure DevOps this whole mechanism is replaced by an OIDC (workload identity
# federation) **service connection**:
#   - `AzureCLI@2` with `azureSubscription: <SC>` performs the federated login
#     automatically — no CLIENT_ID / TENANT_ID / SUBSCRIPTION_ID needed (the SC
#     encapsulates all three).
#   - `keepAzSessionActive: true` keeps the service-principal session alive and
#     auto-refreshes the token for subsequent (plain `pwsh`/`bash`) steps in the
#     same job. This is the native equivalent of the GitHub 4-minute refresh loop.
#
# Referenced via `- template: steps/login-to-azure.yml` from job templates (the
# ADO equivalent of GitHub's `uses: ./.github/actions/login-to-azure`).
#
# TODO(Phase 1C): set `azureServiceConnection` (below, or at the job level) to the
# real Azure OIDC service connection name once it is provisioned in ADO.

parameters:
  # Name of the Azure OIDC (workload identity federation) service connection.
  # Overridable per job; defaults to the job-level variable when omitted.
  - name: azureServiceConnection
    type: string
    default: "$(azureServiceConnection)"

steps:
  - task: AzureCLI@2
    displayName: Login to Azure (OIDC) and keep session active
    inputs:
      azureSubscription: ${{ parameters.azureServiceConnection }}
      scriptType: bash
      scriptLocation: inlineScript
      # Keeps the az CLI session alive + auto-refreshes the token for the rest of
      # the job, so subsequent plain pwsh/bash steps can use the logged-in context
      # (replaces the GitHub background `az login` refresh loop).
      keepAzSessionActive: true
      inlineScript: |
        az version
        az account show
