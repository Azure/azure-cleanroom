# Step template: blobfuse-setup composite.
# Migrated from .github/actions/blobfuse-setup/action.yml. Builds blobfuse2 from
# the vendored azure-storage-fuse, then creates the storage account + containers
# used by the data-integrity tests. Emits RESOURCE_GROUP / STORAGE_ACCOUNT /
# *_CONTAINER_NAME / *_ENDPOINT as pipeline variables for downstream steps.
#
# Assumes login-to-azure.yml already ran (needs an authenticated az session).

parameters:
  - name: resourceGroup
    type: string
  - name: storageAccount
    type: string
  - name: location
    type: string
    default: westus

steps:
  - bash: |
      sudo chmod +x ./build/go_installer.sh
      sudo ./build/go_installer.sh .
      echo "##vso[task.prependpath]/usr/local/go/bin"
    displayName: Install Go
    workingDirectory: $(repoRoot)
  - bash: |
      sudo apt-get update -y
      sudo apt-get install gcc libfuse3-dev parallel -y
      sudo apt-get install fuse3 -y
    displayName: Install Blobfuse dependencies
  - bash: |
      sudo chmod +x ./external/azure-storage-fuse/build.sh
      (cd ./external/azure-storage-fuse/ && ./build.sh)
      cp -r ./src/blobfuse-launcher/encryptor ./external/azure-storage-fuse/encryptor
      (cd ./external/azure-storage-fuse/encryptor && go build -buildmode=plugin -o encryptor.so)
      cp ./external/azure-storage-fuse/blobfuse2 /usr/local/bin/
      echo "user_allow_other" | sudo tee -a /etc/fuse.conf
    displayName: Build and install Blobfuse
    workingDirectory: $(repoRoot)
  - bash: |
      set -euo pipefail
      RESOURCE_GROUP="${{ parameters.resourceGroup }}"
      LOCATION="${{ parameters.location }}"
      STORAGE_ACCOUNT="${{ parameters.storageAccount }}"
      CONTAINER_NAME=di-test
      SOURCE_CONTAINER_NAME=di-source
      echo "##vso[task.setvariable variable=RESOURCE_GROUP]$RESOURCE_GROUP"
      echo "##vso[task.setvariable variable=STORAGE_ACCOUNT]$STORAGE_ACCOUNT"
      echo "##vso[task.setvariable variable=LOCATION]$LOCATION"
      echo "##vso[task.setvariable variable=CONTAINER_NAME]$CONTAINER_NAME"
      echo "##vso[task.setvariable variable=SOURCE_CONTAINER_NAME]$SOURCE_CONTAINER_NAME"

      az group create --name $RESOURCE_GROUP --location $LOCATION
      STORAGE_ACCOUNT_ENDPOINT=$(az storage account create --name $STORAGE_ACCOUNT \
        --resource-group $RESOURCE_GROUP --query "primaryEndpoints.blob" --output tsv)
      echo "##vso[task.setvariable variable=STORAGE_ACCOUNT_ENDPOINT]$STORAGE_ACCOUNT_ENDPOINT"
      az storage container create --resource-group $RESOURCE_GROUP --account-name $STORAGE_ACCOUNT \
        --name $CONTAINER_NAME --auth-mode login
      az storage container create --resource-group $RESOURCE_GROUP --account-name $STORAGE_ACCOUNT \
        --name $SOURCE_CONTAINER_NAME --auth-mode login
      az role assignment create --assignee $(AZURE_CLIENT_ID) \
        --role "Storage Blob Data Contributor" \
        --scope /subscriptions/$(AZURE_SUBSCRIPTION_ID)/resourceGroups/$RESOURCE_GROUP/providers/Microsoft.Storage/storageAccounts/$STORAGE_ACCOUNT
      sleep 120s
    displayName: Create Azure Storage Account and Container
    workingDirectory: $(repoRoot)
