################################################################################
# Release to Test + BVT jobs (migrated from .github/workflows/release-and-test.yml).
# Structure: build -> release_to_test (promote to <acr>/internal/azurecleanroom)
# + pick_location -> BVT jobs (ml_training, encrypted_storage, nginx_hello,
# skr_validation, setup_env_aks, big_data_query_analytics_aks, cleanup_aks).
# release_to_test promotes to environment 'internal' (prod uses 'unlisted'), both
# via steps/release-groups.yml. See MIGRATION.md for detail.
################################################################################

parameters:
  - name: tag
    type: string
    default: ""
  - name: releaseType
    type: string
    default: "cleanroom-containers, governance-client-containers, cgs-js-app, cgs-constitution, ccf-provider-client, ccf-network-containers, ccf-recovery-service-containers, ccf-consortium-manager-containers, cleanroom-workload-infra-containers, cleanroom-cluster-provider-client, frontend-service"
  - name: needsAttestation
    type: boolean
    default: false

jobs:
  # --- build (CUSTOM pool, PUBLIC feed, NO CodeQL) ---------------------------
  # release-build-jobs.yml exposes the SAME job names (build_solutions /
  # build_artefacts / build_images) as the official build, so the dependsOn refs
  # below are unchanged, but builds on the isCustom pool with the public feed and
  # plain docker build (governed official build is reserved for CodeQL).
  - template: release-build-jobs.yml
    parameters:
      tag: ${{ parameters.tag }}
      buildType: ${{ parameters.releaseType }}

  # --- release to test: promote images to <acr>/internal/azurecleanroom -------
  - job: release_to_test
    displayName: Release to test
    timeoutInMinutes: 240
    dependsOn:
      - build_solutions
      - build_images
    pool:
      type: linux
      isCustom: true
      name: cleanroom-emu-ado
    variables:
      # isCustom pure-map: RELEASE_ACR_NAME + releaseServiceConnection come from the
      # pipeline-level vars (ReleaseAndTest.yml); bare-VM checkout lands at
      # $(Build.SourcesDirectory), so repoRoot overrides build-common's subdir value.
      repoRoot: "$(Build.SourcesDirectory)"
      ob_outputDirectory: "$(Build.SourcesDirectory)/out"
      # The build derives the effective tag (parameters.tag or short commit hash) at
      # RUNTIME; parameters.tag is empty on a manual queue. Consume the build's
      # runtime output so release download of <name>-<tag>.tar matches the build's
      # docker save name (fixes 'ccr-init-.tar: no such file' — empty tag).
      effectiveTag: $[ dependencies.build_solutions.outputs['tagStep.effectiveTag'] ]
    steps:
      - checkout: self
        submodules: recursive
        fetchTags: true
      - template: steps/setup-docker-on-data-disk.yml
      - template: steps/login-to-azure.yml
      # All release-* promotion groups (environment 'internal'). Gated by
      # releaseType; see steps/release-groups.yml (shared with prod release).
      - template: steps/release-groups.yml
        parameters:
          tag: $(effectiveTag)
          environment: internal
          releaseType: ${{ parameters.releaseType }}
          needsAttestation: ${{ parameters.needsAttestation }}

  # --- pick a random Azure location (BVT) ------------------------------------
  - job: pick_location
    displayName: Pick location
    pool:
      type: linux
    variables:
      # OneBranch governed type:linux jobs need ob_outputDirectory (static map).
      ob_outputDirectory: "$(Build.SourcesDirectory)/out"
    steps:
      # No `checkout: none` — OneBranch injects a template checkout and rejects an
      # explicit `checkout: none` alongside it ("multiple checkouts").
      # release-and-test's list INCLUDES westeurope (unlike the PR flows).
      - bash: |
          set -euo pipefail
          # germanywestcentral removed earlier: persistent AKSCapacityHeavyUsage.
          # eastasia + southeastasia removed: Confidential ACI (VN2 virtual-node)
          # capacity exhaustion — verified by connecting to the live cluster on
          # build 175862697, where the big-data Spark EXECUTOR pod (5 CPU / 27.9 GB
          # on a confidential vn2 node) was stuck Init:0/7 with the kubelet event
          # "FailedCreatePodSandBox ... The requested resource is not available in
          # the location 'eastasia' at this moment" (x64 over 21 min). The driver
          # placed fine; the larger executor could not, so the query hung to the
          # 45-min timeout. This is a REGIONAL confidential-ACI capacity issue, not
          # concurrency/timeout — so restrict to the regions with reliable SEV-SNP
          # ACI capacity. Re-add eastasia/southeastasia once Azure restores it.
          locations=("westeurope" "northeurope" "centralindia")
          index=$((RANDOM % ${#locations[@]}))
          selected="${locations[$index]}"
          echo "Selected location: $selected"
          echo "##vso[task.setvariable variable=location;isOutput=true]$selected"
        name: pickLocation
        displayName: Pick a random Azure location

  # --- BVT: ml-training (matrix key-store) -----------------------------------
  - job: bvt_ml_training
    displayName: BVT ml-training
    timeoutInMinutes: 180
    dependsOn:
      - build_solutions
      - build_images
      - release_to_test
    pool:
      type: linux
      isCustom: true
      name: cleanroom-emu-ado
    strategy:
      matrix:
        akvpremium: { key-store: akvpremium }
    variables:
      repoRoot: "$(Build.SourcesDirectory)"
      ob_outputDirectory: "$(Build.SourcesDirectory)/out"
      effectiveTag: $[ dependencies.build_solutions.outputs['tagStep.effectiveTag'] ]
    steps:
      - checkout: self
        submodules: recursive
        fetchTags: true
      - template: steps/setup-docker-on-data-disk.yml
      - template: steps/login-to-azure.yml
      - pwsh: |
          # cleanroomemubvtregistry has anonymousPullEnabled=true and the BVT jobs
          # only PULL test images. The BVT login identity (cleanroom-pr-oidc) has no
          # AcrPull role on the release registry, so `az acr login` 401s — but the
          # pulls work anonymously without it. Make login best-effort so a 401
          # doesn't fail the BVT before the anonymous pulls even run.
          az acr login --name $(RELEASE_ACR_NAME)
          if ($LASTEXITCODE -ne 0) { Write-Host "az acr login non-zero (expected: no AcrPull); relying on anonymous pull." }
          $global:LASTEXITCODE = 0
        displayName: ACR login (internal, best-effort)
        workingDirectory: $(repoRoot)
      - template: steps/install-cleanroom-cli.yml
        parameters:
          repo: $(RELEASE_ACR_NAME).azurecr.io/internal/azurecleanroom
          tag: $(effectiveTag)
      - pwsh: |
          $env:TDP_HSM_RESOURCE_GROUP='azcleanroom-emu-bvt-rg'
          $env:TDP_MHSM_NAME='azcleanroomemubvthsm'
          $env:TDC_HSM_RESOURCE_GROUP='azcleanroom-emu-bvt-rg'
          $env:TDC_MHSM_NAME='azcleanroomemubvthsm'
          ./test/onebox/multi-party-collab/ml-training/run-collab-aci.ps1 -registry acr -repo $(RELEASE_ACR_NAME).azurecr.io/internal/azurecleanroom -tag $(effectiveTag) -kvType "$(key-store)"
        displayName: Run ml-training collab scenario on CACI
        workingDirectory: $(repoRoot)
      - pwsh: docker compose -p ob-ml-training-ccf-provider logs
        displayName: Dump ccf-provider logs
        condition: not(canceled())
        workingDirectory: $(repoRoot)
      - pwsh: docker logs ob-isv-client-cgs-client-1
        displayName: Dump ob-isv-client logs
        condition: not(canceled())
        workingDirectory: $(repoRoot)
      - bash: |
          mkdir -p "$(ob_outputDirectory)/bvt-generated-ml-training-$(key-store)"
          cp -r "$(repoRoot)/test/onebox/multi-party-collab/ml-training/generated/." "$(ob_outputDirectory)/bvt-generated-ml-training-$(key-store)/" || true
        displayName: Collect generated (into drop)
        condition: not(canceled())
        workingDirectory: $(repoRoot)
      - pwsh: ./test/onebox/multi-party-collab/remove-resources.ps1 -tag "github_actions=$(key-store)-$(Agent.JobName)-$(Build.BuildId)"
        displayName: Delete resource groups
        condition: succeeded()
        workingDirectory: $(repoRoot)

  # --- BVT: encrypted-storage -------------------------------------------------
  - job: bvt_encrypted_storage
    displayName: BVT encrypted-storage
    timeoutInMinutes: 180
    dependsOn:
      - build_solutions
      - build_images
      - release_to_test
    pool:
      type: linux
      isCustom: true
      name: cleanroom-emu-ado
    variables:
      repoRoot: "$(Build.SourcesDirectory)"
      ob_outputDirectory: "$(Build.SourcesDirectory)/out"
      effectiveTag: $[ dependencies.build_solutions.outputs['tagStep.effectiveTag'] ]
    steps:
      - checkout: self
        submodules: recursive
        fetchTags: true
      - template: steps/setup-docker-on-data-disk.yml
      - template: steps/login-to-azure.yml
      - pwsh: |
          # anonymous pull fallback — see ACR login note in bvt_ml_training.
          az acr login --name $(RELEASE_ACR_NAME)
          if ($LASTEXITCODE -ne 0) { Write-Host "az acr login non-zero (expected: no AcrPull); relying on anonymous pull." }
          $global:LASTEXITCODE = 0
        displayName: ACR login (internal, best-effort)
        workingDirectory: $(repoRoot)
      - template: steps/install-cleanroom-cli.yml
        parameters:
          repo: $(RELEASE_ACR_NAME).azurecr.io/internal/azurecleanroom
          tag: $(effectiveTag)
      - pwsh: ./test/onebox/multi-party-collab/encrypted-storage/run-collab-aci.ps1 -registry acr -repo $(RELEASE_ACR_NAME).azurecr.io/internal/azurecleanroom -tag $(effectiveTag)
        displayName: Run encrypted-storage collab scenario on CACI
        workingDirectory: $(repoRoot)
      - pwsh: docker compose -p ob-encrypted-storage-ccf-provider logs
        displayName: Dump ccf-provider logs
        condition: not(canceled())
        workingDirectory: $(repoRoot)
      - pwsh: docker logs ob-consumer-client-cgs-client-1
        displayName: Dump ob-consumer-client logs
        condition: not(canceled())
        workingDirectory: $(repoRoot)
      - pwsh: docker logs ob-publisher-client-cgs-client-1
        displayName: Dump ob-publisher-client logs
        condition: not(canceled())
        workingDirectory: $(repoRoot)
      - bash: |
          mkdir -p "$(ob_outputDirectory)/bvt-generated-encrypted-storage"
          cp -r "$(repoRoot)/test/onebox/multi-party-collab/encrypted-storage/generated/." "$(ob_outputDirectory)/bvt-generated-encrypted-storage/" || true
        displayName: Collect generated (into drop)
        condition: not(canceled())
        workingDirectory: $(repoRoot)
      - pwsh: ./test/onebox/multi-party-collab/remove-resources.ps1 -tag "github_actions=$(Agent.JobName)-$(Build.BuildId)"
        displayName: Delete resource groups
        condition: succeeded()
        workingDirectory: $(repoRoot)

  # --- BVT: nginx-hello ------------------------------------------------------
  - job: bvt_nginx_hello
    displayName: BVT nginx-hello
    timeoutInMinutes: 180
    dependsOn:
      - build_solutions
      - build_images
      - release_to_test
    pool:
      type: linux
      isCustom: true
      name: cleanroom-emu-ado
    variables:
      repoRoot: "$(Build.SourcesDirectory)"
      ob_outputDirectory: "$(Build.SourcesDirectory)/out"
      effectiveTag: $[ dependencies.build_solutions.outputs['tagStep.effectiveTag'] ]
    steps:
      - checkout: self
        submodules: recursive
        fetchTags: true
      - template: steps/setup-docker-on-data-disk.yml
      # nginx-hello BUILDS an OPA network-policy bundle (GET "/" only) and
      # `oras push`es it to the release registry; the confidential
      # ccr-proxy-ext-processor PULLS that bundle at startup to enforce the
      # policy — if it's missing the processor panics and every request 500s.
      # The default BVT identity (cleanroom-pr-oidc / cleanroom-emu-pr-mi) has
      # only anonymous PULL on cleanroomemubvtregistry, so the push failed and
      # the endpoint 500'd for the whole wait (verified 175831832). Use the
      # release identity cleanroom-prod-release-oidc (= cleanroom-emu-bvt-mi),
      # which has AcrPush on the registry AND full deploy roles on the test sub —
      # exactly the identity GitHub's release-and-test bvt-nginx-hello uses
      # (environment: test). This is the ONLY BVT that pushes an artifact.
      - template: steps/login-to-azure.yml
        parameters:
          azureServiceConnection: cleanroom-prod-release-oidc
          serviceConnectionId: e6b77a5f-7512-4955-8f36-22456ad98b3b
          clientId: 394518f3-5105-428e-9f54-6d1c9f432703
      - pwsh: |
          # Real login (cleanroom-emu-bvt-mi has AcrPush) — required for the
          # nginx-hello OPA policy `oras push` below, not just image pulls.
          az acr login --name $(RELEASE_ACR_NAME)
        displayName: ACR login (internal)
        workingDirectory: $(repoRoot)
      - template: steps/install-cleanroom-cli.yml
        parameters:
          repo: $(RELEASE_ACR_NAME).azurecr.io/internal/azurecleanroom
          tag: $(effectiveTag)
      - pwsh: ./test/onebox/multi-party-collab/nginx-hello/run-collab-aci.ps1 -registry acr -repo $(RELEASE_ACR_NAME).azurecr.io/internal/azurecleanroom -tag $(effectiveTag)
        displayName: Run nginx-hello collab scenario on CACI
        workingDirectory: $(repoRoot)
      - pwsh: docker compose -p ob-nginx-hello-ccf-provider logs
        displayName: Dump ccf-provider logs
        condition: not(canceled())
        workingDirectory: $(repoRoot)
      - pwsh: docker logs ob-nginx-client-cgs-client-1
        displayName: Dump ob-nginx-client logs
        condition: not(canceled())
        workingDirectory: $(repoRoot)
      - pwsh: docker logs ccr-client-proxy
        displayName: Dump ccr-client-proxy logs
        condition: not(canceled())
        workingDirectory: $(repoRoot)
      - bash: |
          mkdir -p "$(ob_outputDirectory)/bvt-generated-nginx-hello"
          cp -r "$(repoRoot)/test/onebox/multi-party-collab/nginx-hello/generated/configurations/." "$(ob_outputDirectory)/bvt-generated-nginx-hello/" || true
        displayName: Collect generated (into drop)
        condition: not(canceled())
        workingDirectory: $(repoRoot)
      - pwsh: ./test/onebox/multi-party-collab/remove-resources.ps1 -tag "github_actions=$(Agent.JobName)-$(Build.BuildId)"
        displayName: Delete resource groups
        condition: succeeded()
        workingDirectory: $(repoRoot)

  # --- BVT: skr-validation ---------------------------------------------------
  - job: bvt_skr_validation
    displayName: BVT skr-validation
    timeoutInMinutes: 120
    dependsOn:
      - build_solutions
      - build_images
      - release_to_test
      - pick_location
    pool:
      type: linux
      isCustom: true
      name: cleanroom-emu-ado
    variables:
      repoRoot: "$(Build.SourcesDirectory)"
      ob_outputDirectory: "$(Build.SourcesDirectory)/out"
      location: "$[ dependencies.pick_location.outputs['pickLocation.location'] ]"
    steps:
      - checkout: self
        submodules: recursive
        fetchTags: true
      - template: steps/login-to-azure.yml
      - pwsh: |
          ./test/onebox/skr-validation/setup-resources.ps1 `
            -resourceGroup "cl-skr-validation-eus-rg" -location "eastus"
        displayName: SKR validation setup (one-time, idempotent)
        workingDirectory: $(repoRoot)
      - pwsh: |
          ./test/onebox/skr-validation/run-skr-validation.ps1 `
            -resourceGroup "cl-skr-validation-eus-rg" -location "$(location)"
        displayName: Run SKR validation test
        workingDirectory: $(repoRoot)

  # --- BVT: setup env (AKS) --------------------------------------------------
  - job: bvt_setup_env_aks
    displayName: BVT setup env (AKS)
    timeoutInMinutes: 180
    dependsOn:
      - build_solutions
      - build_images
      - release_to_test
      - pick_location
    pool:
      type: linux
      isCustom: true
      name: cleanroom-emu-ado
    variables:
      repoRoot: "$(Build.SourcesDirectory)"
      ob_outputDirectory: "$(Build.SourcesDirectory)/out"
      # Big-data confidential-ACI executors (5 CPU / 27.9 GB CACI) are only
      # capacity-validated in centralindia — the same region hard-pinned by
      # BigDataLonghaul.yml, TpcdsStresstest.yml and the PR workload samples.
      # pick_location's other regions (westeurope/northeurope) are fine for the
      # lightweight BVTs but risk FailedCreatePodSandBox for big-data, so pin
      # setup-env-aks + big-data to centralindia rather than the random pick.
      location: centralindia
      effectiveTag: $[ dependencies.build_solutions.outputs['tagStep.effectiveTag'] ]
    steps:
      - checkout: self
        submodules: recursive
        fetchTags: true
      - template: steps/setup-docker-on-data-disk.yml
      - template: steps/login-to-azure.yml
      - pwsh: |
          # anonymous pull fallback — see ACR login note in bvt_ml_training.
          az acr login --name $(RELEASE_ACR_NAME)
          if ($LASTEXITCODE -ne 0) { Write-Host "az acr login non-zero (expected: no AcrPull); relying on anonymous pull." }
          $global:LASTEXITCODE = 0
        displayName: ACR login (internal, best-effort)
        workingDirectory: $(repoRoot)
      - template: steps/workload-setup-env.yml
        parameters:
          infraType: aks
          location: $(location)
          outDir: $(repoRoot)/test/onebox/workload-samples-aks/generated
          registry: acr
          repo: $(RELEASE_ACR_NAME).azurecr.io/internal/azurecleanroom
          tag: $(effectiveTag)
      # bvt_setup_env_aks is an isCustom (bare-VM) job, which does NOT auto-publish
      # $(ob_outputDirectory). Stage the deployment artifacts and publish the drop
      # EXPLICITLY as drop_<stage>_<job> = drop_Build_bvt_setup_env_aks, which is
      # exactly what bvt_big_data_query_analytics_aks downloads (verified 175831832:
      # setup-env-aks passed but 'Artifact drop_Build_bvt_setup_env_aks was not
      # found' → big-data failed at download).
      - bash: |
          mkdir -p "$(ob_outputDirectory)/cleanroom-deployment-artifacts-aks"
          cp -r "$(repoRoot)/test/onebox/workload-samples-aks/generated/." "$(ob_outputDirectory)/cleanroom-deployment-artifacts-aks/" || true
        displayName: Collect deployment artifacts (into drop)
        condition: succeeded()
        workingDirectory: $(repoRoot)
      - task: PublishPipelineArtifact@1
        displayName: Publish bvt_setup_env_aks drop
        condition: succeeded()
        inputs:
          targetPath: $(ob_outputDirectory)
          artifact: drop_Build_bvt_setup_env_aks

  # --- BVT: big data query analytics (AKS) -----------------------------------
  - job: bvt_big_data_query_analytics_aks
    displayName: BVT big data query analytics (AKS)
    timeoutInMinutes: 240
    dependsOn:
      - build_solutions
      - bvt_setup_env_aks
      - pick_location
    pool:
      type: linux
      isCustom: true
      name: cleanroom-emu-ado
    variables:
      repoRoot: "$(Build.SourcesDirectory)"
      ob_outputDirectory: "$(Build.SourcesDirectory)/out"
      # Must match bvt_setup_env_aks: big-data runs only in centralindia (the
      # capacity-validated confidential-ACI region). See the note on that job.
      location: centralindia
      effectiveTag: $[ dependencies.build_solutions.outputs['tagStep.effectiveTag'] ]
    steps:
      - checkout: self
        submodules: recursive
        fetchTags: true
      - template: steps/setup-docker-on-data-disk.yml
      - task: DownloadPipelineArtifact@2
        displayName: Download deployment artifacts
        inputs:
          source: current
          artifact: drop_Build_bvt_setup_env_aks
          patterns: "cleanroom-deployment-artifacts-aks/**"
          path: $(Build.ArtifactStagingDirectory)
      - bash: |
          mkdir -p "$(repoRoot)/test/onebox/workload-samples-aks/generated"
          cp -r "$(Build.ArtifactStagingDirectory)/cleanroom-deployment-artifacts-aks/." "$(repoRoot)/test/onebox/workload-samples-aks/generated/" || true
        displayName: Restore deployment artifacts from drop
        workingDirectory: $(Build.SourcesDirectory)
      - template: steps/login-to-azure.yml
      - pwsh: |
          # anonymous pull fallback — see ACR login note in bvt_ml_training.
          az acr login --name $(RELEASE_ACR_NAME)
          if ($LASTEXITCODE -ne 0) { Write-Host "az acr login non-zero (expected: no AcrPull); relying on anonymous pull." }
          $global:LASTEXITCODE = 0
        displayName: ACR login (internal, best-effort)
        workingDirectory: $(repoRoot)
      - template: steps/workload-test-big-data-analytics.yml
        parameters:
          location: $(location)
          deploymentConfigDir: $(repoRoot)/test/onebox/workload-samples-aks/generated
          repo: $(RELEASE_ACR_NAME).azurecr.io/internal/azurecleanroom
          tag: $(effectiveTag)
      - bash: |
          mkdir -p "$(ob_outputDirectory)/big-data-analytics-results-aks"
          cp -r "$(repoRoot)/test/onebox/workload-samples-aks/generated/." "$(ob_outputDirectory)/big-data-analytics-results-aks/" || true
        displayName: Collect test results (into drop)
        condition: not(canceled())
        workingDirectory: $(repoRoot)
      - pwsh: |
          ./test/onebox/multi-party-collab/big-data-query-analytics/delete-bucket.ps1 -bucketName "consumer-input-$(Agent.JobName)-$(Build.BuildId)"
          ./test/onebox/multi-party-collab/big-data-query-analytics/delete-bucket.ps1 -bucketName "consumer-output-$(Agent.JobName)-$(Build.BuildId)"
        displayName: Delete AWS buckets
        condition: succeeded()
        workingDirectory: $(repoRoot)
      - pwsh: ./test/onebox/multi-party-collab/remove-resources.ps1 -tag "github_actions=$(Agent.JobName)-$(Build.BuildId)"
        displayName: Delete resource groups
        condition: succeeded()
        workingDirectory: $(repoRoot)

  # --- BVT: cleanup (AKS) ----------------------------------------------------
  - job: bvt_cleanup_aks
    displayName: BVT cleanup (AKS)
    timeoutInMinutes: 60
    dependsOn:
      - bvt_big_data_query_analytics_aks
    condition: succeeded()
    pool:
      type: linux
      isCustom: true
      name: cleanroom-emu-ado
    variables:
      repoRoot: "$(Build.SourcesDirectory)"
      ob_outputDirectory: "$(Build.SourcesDirectory)/out"
    steps:
      - checkout: self
        submodules: recursive
        fetchTags: true
      - template: steps/setup-docker-on-data-disk.yml
      - template: steps/login-to-azure.yml
      # JOB_ID pinned to bvt-setup-env-aks in GitHub to target that job's RG tag.
      - pwsh: ./test/onebox/multi-party-collab/remove-resources.ps1 -tag "github_actions=bvt-setup-env-aks-$(Build.BuildId)"
        displayName: Delete resource groups
        workingDirectory: $(repoRoot)
