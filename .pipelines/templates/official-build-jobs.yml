################################################################################
# Official Build jobs (migrated from .github/workflows/official_build.yml).
# Consumed by OneBranch.Official.yml. Split into two jobs because OneBranch can't
# mix native dotnet/go builds with governed docker image builds on one pool:
#   build_solutions (pool: linux, CodeQL-traced native builds + tag derivation)
#     -> build_images (pool: docker, governed imagebuildinfo signing).
# Gating uses compile-time ${{ if contains(parameters.buildType, 'x') }}; each
# unique image is emitted once (dedup). See MIGRATION.md for detail.
################################################################################

parameters:
  - name: tag
    type: string
    default: ""
  - name: buildType
    type: string
    default: "cleanroom-containers, governance-client-containers, cgs-js-app, cgs-constitution, ccf-provider-client, ccf-network-containers, ccf-recovery-service-containers, ccf-consortium-manager-containers, cleanroom-workload-infra-containers, cleanroom-cluster-provider-client, frontend-service"

jobs:
  # === JOB 1 — native solution builds + tag derivation (GOVERNED linux; CodeQL) ===
  - job: build_solutions
    displayName: Build solutions and derive tag
    timeoutInMinutes: 120
    pool:
      # GOVERNED `type: linux` pool — REQUIRED for CodeQL 3000 auto-injection,
      # which only attaches to governed jobs and traces the native dotnet/go
      # builds. No docker here (buildx artefacts moved to build_artefacts; signed
      # images come from the governed build_images job).
      type: linux
    variables:
      # build-common is hoisted to pipeline top-level (OneBranch.Official.yml);
      # only ob_outputDirectory must live in the job's own variables (Linux.Job.yml).
      - name: ob_outputDirectory
        value: "$(Build.SourcesDirectory)/out"
    steps:
      - task: UseDotNet@2
        displayName: Setup .NET
        inputs:
          packageType: sdk
          version: 10.0.x

      # powershell-yaml intentionally NOT installed: this job runs on the
      # network-restricted OneBranch linux pool (no PSGallery egress) and parses
      # no YAML (that happens in release-groups.yml on a networked pool).

      - bash: |
          curl -Lo $(Agent.TempDirectory)/sbom-tool https://github.com/microsoft/sbom-tool/releases/latest/download/sbom-tool-linux-x64
          chmod +x $(Agent.TempDirectory)/sbom-tool
          sudo mv $(Agent.TempDirectory)/sbom-tool /usr/bin/sbom-tool
        displayName: Setup SBOM tool

      - bash: |
          set -euo pipefail
          # OneBranch linux pool is Azure Linux (tdnf), not Ubuntu; install fuse3
          # dev headers with whichever package manager is present.
          if command -v tdnf >/dev/null 2>&1; then
            sudo tdnf install -y fuse3 fuse3-devel
          elif command -v dnf >/dev/null 2>&1; then
            sudo dnf install -y fuse3 fuse3-devel
          elif command -v apt-get >/dev/null 2>&1; then
            sudo apt-get install -y libfuse3-dev fuse3
          else
            echo "No supported package manager (tdnf/dnf/apt-get) found" >&2
            exit 1
          fi
        displayName: Install blobfuse prerequisites

      - checkout: self
        submodules: recursive
        fetchTags: true
        ${{ if ne(parameters.tag, '') }}:
          # Manual tag builds should be queued against that ref (ADO can't `ref:`
          # an arbitrary input on checkout the way GHA did).
          clean: true

      # Derive the effective build tag (parameters.tag or short commit hash) and
      # publish it as an OUTPUT variable for the docker image + artefact jobs.
      - bash: |
          set -euo pipefail
          tag="${{ parameters.tag }}"
          if [ -z "$tag" ]; then
            tag="$(git rev-parse --short HEAD)"
          fi
          echo "Effective build tag: $tag"
          # isOutput for the cross-job (build_images) reference; plain var for same-job steps.
          echo "##vso[task.setvariable variable=effectiveTag;isOutput=true]$tag"
          echo "##vso[task.setvariable variable=effectiveTag]$tag"
        name: tagStep
        displayName: Derive effective build tag
        workingDirectory: $(repoRoot)

      - template: steps/login-to-azure.yml

      # Authenticate the build's System.AccessToken to msazure Azure Artifacts
      # feeds (sets up the NuGet credential provider). Required because the
      # governed pool can't reach public nuget.org — the dotnet restores below
      # use .pipelines/nuget.config (azure-cleanroomservice feed, which upstreams
      # public NuGet Gallery). This does NOT affect the Docker image builds.
      - task: NuGetAuthenticate@1
        displayName: Authenticate NuGet (internal feed)

      # --- dotnet solution builds (gated) ---
      - ${{ if or(contains(parameters.buildType, 'cleanroom-containers'), contains(parameters.buildType, 'governance-client-containers')) }}:
          - ${{ if contains(parameters.buildType, 'cleanroom-containers') }}:
              - bash: |
                  dotnet restore src/identity/Identity.sln --configfile .pipelines/nuget.config
                  dotnet build --no-restore src/identity/Identity.sln
                displayName: Build identity sidecar
                workingDirectory: $(repoRoot)
              - bash: cd external/azure-storage-fuse && ./build.sh
                displayName: Build blobfuse-launcher
                workingDirectory: $(repoRoot)
          - bash: |
              dotnet restore src/governance/governance.sln --configfile .pipelines/nuget.config
              dotnet build --no-restore src/governance/governance.sln
            displayName: Build governance solution
            workingDirectory: $(repoRoot)

      - ${{ if contains(parameters.buildType, 'ccf') }}:
          - bash: |
              dotnet restore src/ccf/ccf.sln --configfile .pipelines/nuget.config
              dotnet build --no-restore src/ccf/ccf.sln
            displayName: Build CCF solution
            workingDirectory: $(repoRoot)

      # --- non-image artefacts (NATIVE only; docker-buildx builds moved out) ---
      # Only pure-pwsh/native artefacts run here (governed pool, no docker). The
      # docker-buildx local-output builds (cleanroom-client dist, cgs-js-app
      # bundle, az-cli extension) run in the isCustom `build_artefacts` job.

      # cgs-constitution (concatenate constitution .js files -> constitution.json)
      - ${{ if contains(parameters.buildType, 'cgs-constitution') }}:
          - pwsh: |
              $ccfConstitutionDir="$(repoRoot)/src/ccf/ccf-provider-common/constitution"
              $cgsConstitutionDir="$(repoRoot)/src/governance/ccf-app/js/constitution"
              $content=""
              Get-ChildItem $ccfConstitutionDir -Filter *.js | Foreach-Object { $content += Get-Content $_.FullName -Raw }
              Get-ChildItem $cgsConstitutionDir -Filter *.js | Foreach-Object { $content += Get-Content $_.FullName -Raw }
              $content | ConvertTo-Json | Out-File ./constitution.json
            displayName: Build CGS constitution
            workingDirectory: $(repoRoot)
          - bash: |
              set -euo pipefail
              mkdir -p "$(ob_outputDirectory)/cgs-constitution"
              cp "$(repoRoot)/constitution.json" "$(ob_outputDirectory)/cgs-constitution/cgs-constitution-$(effectiveTag).json"
            displayName: Collect cgs-constitution (into drop)

  # ===========================================================================
  # JOB 1b — docker-buildx non-image artefacts  (pool: isCustom bare-VM docker)
  # ===========================================================================
  # These produce dist folders / bundles / wheels via `docker buildx`/`docker
  # image build` (NOT image tarballs), which the governed pools can't run:
  #   - governed `type: linux` has no docker,
  #   - governed `type: docker` only runs `onebranch.pipeline.imagebuildinfo@1`.
  # So they run on the isCustom bare-VM pool (Ubuntu + docker), the same pool
  # pr-build-all-jobs.yml uses for these exact builds. Kept OUT of build_solutions
  # so that job stays on the governed pool for CodeQL 3000 coverage.
  - job: build_artefacts
    displayName: Build docker-buildx artefacts
    timeoutInMinutes: 120
    dependsOn: build_solutions
    pool:
      type: linux
      isCustom: true
      name: cleanroom-emu-ado
    variables:
      # isCustom jobs require a pure-map variables block (no -template/-group).
      # build-common is inherited from the pipeline top-level; repoRoot is
      # overridden for the bare-VM checkout ($(Build.SourcesDirectory), not the
      # governed .../azure-cleanroom subdir).
      ob_outputDirectory: "$(Build.SourcesDirectory)/out"
      repoRoot: "$(Build.SourcesDirectory)"
      effectiveTag: $[ dependencies.build_solutions.outputs['tagStep.effectiveTag'] ]
    steps:
      - checkout: self
        submodules: recursive
        fetchTags: true

      - template: steps/setup-docker-on-data-disk.yml

      - template: steps/login-to-azure.yml

      # cleanroom-client dist (Dockerfile.azcliext.cleanroom, target dist -> local)
      - ${{ if contains(parameters.buildType, 'cleanroom-containers') }}:
          - bash: |
              docker buildx build \
                --file ./build/docker/Dockerfile.azcliext.cleanroom \
                --target dist \
                --output type=local,dest=$(repoRoot)/src/tools/cleanroom-client/dist \
                $(repoRoot)
            displayName: Build cleanroom client artefacts
            workingDirectory: $(repoRoot)
          - bash: |
              set -euo pipefail
              mkdir -p "$(ob_outputDirectory)/dist"
              cp -r "$(repoRoot)/src/tools/cleanroom-client/dist/." "$(ob_outputDirectory)/dist/"
            displayName: Collect cleanroom-client dist (into drop)
            workingDirectory: $(repoRoot)
          # Generate an SBOM for the drop BEFORE publishing so the artifact is
          # self-describing. The build_images (docker) job downloads this drop into
          # its build context under $(Build.SourcesDirectory); 1ES PT auto-injects a
          # "Validate SBoM Manifest" step on any artifact downloaded into the sources
          # tree and fails ("No SBOM found in .../_manifest") if the drop carries no
          # _manifest. Previously the drop had only dist/ (verified: artifact held
          # only dist/cleanroom-*.whl), so validation flagged the Official Build as
          # succeededWithIssues (build 175520445). Emitting _manifest/ here makes the
          # downloaded drop validate clean. (ManifestGeneratorTask is the same task
          # 1ES uses for the governed image SBOMs, so it is available on this pool.)
          - task: ManifestGeneratorTask@0
            displayName: Generate SBOM for build_artefacts drop
            inputs:
              BuildDropPath: $(ob_outputDirectory)
          # isCustom jobs do NOT auto-publish ob_outputDirectory as a drop
          # PipelineArtifact (only governed jobs do). Explicitly publish it so the
          # build_images job (docker pool) can download the dist into its context.
          # OneBranch enforces the artifact name == "drop_<stage>_<job>".
          - task: PublishPipelineArtifact@1
            displayName: Publish build_artefacts drop
            inputs:
              targetPath: $(ob_outputDirectory)
              artifact: drop_Build_build_artefacts

      # cgs-js-app bundle (Dockerfile.governance.ccf-app, target dist -> bundle.json)
      - ${{ if contains(parameters.buildType, 'cgs-js-app') }}:
          - bash: |
              docker buildx build \
                --file ./build/docker/Dockerfile.governance.ccf-app \
                --target dist \
                --output type=local,dest=. \
                $(repoRoot)/src/governance/ccf-app/js
            displayName: Build CGS JS App bundle
            workingDirectory: $(repoRoot)
          - bash: |
              set -euo pipefail
              mkdir -p "$(ob_outputDirectory)/cgs-js-app"
              cp "$(repoRoot)/bundle.json" "$(ob_outputDirectory)/cgs-js-app/cgs-js-app-$(effectiveTag).json"
            displayName: Collect cgs-js-app bundle (into drop)

      # build-azcli whl (build-azcliext-cleanroom.ps1 uses `docker image build`)
      - pwsh: ./build/build-azcliext-cleanroom.ps1 -tag $(effectiveTag) -skipInstall
        displayName: Build cleanroom az cli extension
        workingDirectory: $(repoRoot)
      - bash: |
          set -euo pipefail
          mkdir -p "$(ob_outputDirectory)/cleanroom-cli-whl"
          cp -r "$(repoRoot)/build/bin/azext_cleanroom/dist/." "$(ob_outputDirectory)/cleanroom-cli-whl/"
        displayName: Collect cleanroom-cli.whl (into drop)

  # ===========================================================================
  # JOB 2 — container image builds via imagebuildinfo  (pool: docker)
  # ===========================================================================
  - job: build_images
    displayName: Build container image tarballs
    timeoutInMinutes: 180
    dependsOn:
      - build_solutions
      - build_artefacts
    pool:
      type: docker
      os: linux
    variables:
      ob_outputDirectory: "$(Build.SourcesDirectory)/out"
      # Effective tag derived by the linux job.
      buildTag: $[ dependencies.build_solutions.outputs['tagStep.effectiveTag'] ]
    steps:
      - checkout: self
        submodules: recursive

      # Download the build_artefacts drop so Dockerfile.cleanroom-client
      # (COPY ./dist /dist) finds the dist in its build context. The docker pool
      # silently drops Bash/PowerShell tasks, so we cannot move files with a
      # script step; instead download the drop directly into the cleanroom-client
      # context.
      #
      # CRITICAL PATH: imagebuildinfo builds from a `dst/` STAGING COPY of the repo,
      # NOT $(Build.SourcesDirectory)/src directly. Verified from build 175411941
      # logs: `docker build ... /mnt/vss/_work/1/s/dst/src/tools/cleanroom-client`
      # while a download to .../s/src/tools/cleanroom-client landed OUTSIDE the
      # context (COPY ./dist -> "/dist": not found). So target the dst/ staging path
      # so the whl lands at dst/src/tools/cleanroom-client/dist where COPY expects it.
      #
      # SBOM: do NOT filter with `patterns: dist/**`. 1ES PT auto-injects a
      # "Validate SBoM Manifest" step on every artifact download into the sources
      # tree; it requires the drop's `_manifest/` folder (published alongside at the
      # drop root) AND every file the manifest references. A `dist/**` filter strips
      # `_manifest/` (and cgs-js-app/cleanroom-cli-whl), so validation failed with
      # "No SBOM found in .../dst/src/tools/cleanroom-client/_manifest" -> the whole
      # Official Build was marked succeededWithIssues (verified build 175428325).
      # Downloading the FULL drop lands `_manifest/` + all referenced files so the
      # validation passes. The extra dirs are harmless to the image: the Dockerfile
      # uses targeted COPYs (./dist, ./app, ./requirements.txt) — never `COPY . .`.
      - ${{ if contains(parameters.buildType, 'cleanroom-containers') }}:
          - task: DownloadPipelineArtifact@2
            displayName: Download cleanroom-client dist
            inputs:
              source: current
              artifact: drop_Build_build_artefacts
              path: $(Build.SourcesDirectory)/dst/src/tools/cleanroom-client

      # --- cleanroom-containers group ---
      # NOTE: dist is downloaded above via DownloadPipelineArtifact; Dockerfile.cleanroom-client
      # will find it in src/tools/cleanroom-client/dist/
      - ${{ if contains(parameters.buildType, 'cleanroom-containers') }}:
          - template: steps/build-container-image.yml
            parameters: { name: ccr-init, dockerfile: build/docker/Dockerfile.ccr-init }
          - template: steps/build-container-image.yml
            parameters: { name: identity, dockerfile: build/docker/Dockerfile.identity }
          - template: steps/build-container-image.yml
            parameters: { name: blobfuse-launcher, dockerfile: build/docker/Dockerfile.blobfuse-launcher }
          - template: steps/build-container-image.yml
            parameters: { name: s3fs-launcher, dockerfile: build/docker/Dockerfile.s3fs-launcher }
          - template: steps/build-container-image.yml
            parameters: { name: code-launcher, dockerfile: build/docker/Dockerfile.code-launcher }
          - template: steps/build-container-image.yml
            parameters: { name: otel-collector, dockerfile: build/docker/Dockerfile.otel-collector }
          - template: steps/build-container-image.yml
            parameters: { name: ccr-secrets, dockerfile: build/docker/Dockerfile.ccr-secrets }
          - template: steps/build-container-image.yml
            parameters: { name: ccr-governance, dockerfile: build/docker/Dockerfile.ccr-governance }
          - template: steps/build-container-image.yml
            parameters: { name: cleanroom-client, dockerfile: build/docker/Dockerfile.cleanroom-client, context: src/tools/cleanroom-client }
          - template: steps/build-container-image.yml
            parameters: { name: ccr-proxy-ext-processor, dockerfile: build/docker/Dockerfile.proxy-ext-processor }
          - template: steps/build-container-image.yml
            parameters: { name: cvm-attestation-agent, dockerfile: build/docker/Dockerfile.cvm-attestation-agent }

      # --- shared images (ccr-proxy, skr) — built once, gated on OR of groups ---
      - ${{ if or(contains(parameters.buildType, 'cleanroom-containers'), contains(parameters.buildType, 'ccf-network-containers'), contains(parameters.buildType, 'ccf-recovery-service-containers')) }}:
          - template: steps/build-container-image.yml
            parameters: { name: ccr-proxy, dockerfile: build/docker/Dockerfile.proxy }
          - template: steps/build-container-image.yml
            parameters: { name: skr, dockerfile: build/docker/Dockerfile.skr }

      # --- governance-client-containers group ---
      - ${{ if contains(parameters.buildType, 'governance-client-containers') }}:
          - template: steps/build-container-image.yml
            parameters: { name: cgs-client, dockerfile: build/docker/Dockerfile.cgs-client }
          - template: steps/build-container-image.yml
            parameters: { name: cgs-ui, dockerfile: build/docker/Dockerfile.cgs-ui }

      # --- ccf-provider-client group ---
      - ${{ if contains(parameters.buildType, 'ccf-provider-client') }}:
          - template: steps/build-container-image.yml
            parameters: { name: ccf-provider-client, dockerfile: build/docker/Dockerfile.ccf-provider-client }

      # --- ccf-network-containers group ---
      - ${{ if contains(parameters.buildType, 'ccf-network-containers') }}:
          - template: steps/build-container-image.yml
            parameters: { name: ccf-app-run-js-snp, dockerfile: build/docker/Dockerfile.ccf_run_js_app }
          - template: steps/build-container-image.yml
            parameters: { name: ccf-app-run-js-virtual, dockerfile: build/docker/Dockerfile.ccf_run_js_app }
          - template: steps/build-container-image.yml
            parameters: { name: ccf-recovery-agent, dockerfile: build/docker/Dockerfile.ccf-recovery-agent }
          - template: steps/build-container-image.yml
            parameters: { name: cvm-attestation-verifier, dockerfile: build/docker/Dockerfile.cvm-attestation-verifier }

      # --- ccf-recovery-service-containers group ---
      - ${{ if contains(parameters.buildType, 'ccf-recovery-service-containers') }}:
          - template: steps/build-container-image.yml
            parameters: { name: ccf-recovery-service, dockerfile: build/docker/Dockerfile.ccf-recovery-service }

      # --- ccf-consortium-manager-containers group ---
      - ${{ if contains(parameters.buildType, 'ccf-consortium-manager-containers') }}:
          - template: steps/build-container-image.yml
            parameters: { name: ccf-consortium-manager, dockerfile: build/docker/Dockerfile.ccf-consortium-manager }

      # --- cleanroom-cluster-provider-client group ---
      - ${{ if contains(parameters.buildType, 'cleanroom-cluster-provider-client') }}:
          - template: steps/build-container-image.yml
            parameters: { name: cleanroom-cluster-provider-client, dockerfile: build/docker/Dockerfile.cleanroom-cluster-provider-client }

      # --- cleanroom-workload-infra-containers group ---
      # NOTE: this group ALSO builds helm charts via build-helm-chart-and-artefacts
      # (non-image, helm packaging) — handled with the workload-infra release group.
      - ${{ if contains(parameters.buildType, 'cleanroom-workload-infra-containers') }}:
          - template: steps/build-container-image.yml
            parameters: { name: cleanroom-spark-analytics-agent, dockerfile: build/docker/Dockerfile.cleanroom-spark-analytics-agent }
          - template: steps/build-container-image.yml
            parameters: { name: cleanroom-spark-frontend, dockerfile: build/docker/Dockerfile.cleanroom-spark-frontend }
          - template: steps/build-container-image.yml
            parameters: { name: cleanroom-spark-analytics-app, dockerfile: build/docker/Dockerfile.cleanroom-spark-analytics-app }
          - template: steps/build-container-image.yml
            parameters: { name: kserve-inferencing-agent, dockerfile: build/docker/Dockerfile.kserve-inferencing-agent }
          - template: steps/build-container-image.yml
            parameters: { name: kserve-inferencing-frontend, dockerfile: build/docker/Dockerfile.kserve-inferencing-frontend }
          - template: steps/build-container-image.yml
            parameters: { name: ohttp-gateway, dockerfile: build/docker/Dockerfile.ohttp-gateway }

      # --- frontend-service group ---
      - ${{ if contains(parameters.buildType, 'frontend-service') }}:
          - template: steps/build-container-image.yml
            parameters: { name: frontend-service, dockerfile: build/docker/Dockerfile.frontend-service }
