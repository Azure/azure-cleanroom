# Job definitions for the Workload sample PR tests. Migrated from
# .github/workflows/pr_workload_samples.yml (workflow_call). Consumed by
# PR-Validation.yml, gated on testStages contains 'test-workloads'.
#
# Job DAG (mirrors GitHub):
#   pick_location
#   test_big_data_analytics_virtual        (location centralindia, no needs)
#   test_kserve_inferencing_virtual        (location centralindia, no needs)
#   setup_env_aks                          (needs pick_location)
#   test_big_data_analytics_aks            (needs pick_location, setup_env_aks)
#   test_kserve_inferencing_aks            (needs pick_location, setup_env_aks)
#   cleanup_aks                            (needs both aks tests)
#
# Each test job: checkout -> setup-docker -> test-workloads/setup-env ->
# test-workloads/test-<scenario> -> upload-artifact -> [delete-bucket] ->
# remove-resources. The setup-env + test-* composites are ported via
# steps/workload-setup-env.yml, steps/workload-test-big-data-analytics.yml and
# steps/workload-test-kserve-inferencing.yml.

parameters:
  - name: dependsOn
    type: object
    default: []
  - name: condition
    type: string
    default: ""

jobs:
  - job: pick_location
    displayName: Pick location
    dependsOn: ${{ parameters.dependsOn }}
    ${{ if ne(parameters.condition, '') }}:
      condition: ${{ parameters.condition }}
    pool:
      type: linux
    steps:
      - checkout: none
      - template: steps/pick-location.yml

  - job: test_big_data_analytics_virtual
    displayName: Big data analytics (virtual)
    timeoutInMinutes: 120
    dependsOn: ${{ parameters.dependsOn }}
    ${{ if ne(parameters.condition, '') }}:
      condition: ${{ parameters.condition }}
    pool:
      type: linux # TODO(Phase 1C): 1ES pool with Docker daemon
    variables:
      - template: variables/build-common.yml
      - name: outDir
        value: "$(repoRoot)/test/onebox/workload-samples/generated"
    steps:
      - checkout: self
        submodules: recursive
      - template: steps/setup-docker-on-data-disk.yml
      - template: steps/login-to-azure.yml
      - template: steps/workload-setup-env.yml
        parameters:
          infraType: virtual
          location: centralindia
          outDir: $(outDir)
      - template: steps/workload-test-big-data-analytics.yml
        parameters:
          location: centralindia
          deploymentConfigDir: $(outDir)
      - task: PublishPipelineArtifact@1
        displayName: Upload test results
        condition: not(canceled())
        inputs:
          targetPath: $(outDir)
          artifact: big-data-analytics-results-virtual
      - pwsh: |
          ./test/onebox/multi-party-collab/big-data-query-analytics/delete-bucket.ps1 -bucketName "consumer-input-$(Agent.JobName)-$(Build.BuildId)"
          ./test/onebox/multi-party-collab/big-data-query-analytics/delete-bucket.ps1 -bucketName "consumer-output-$(Agent.JobName)-$(Build.BuildId)"
        displayName: Delete AWS buckets
        condition: succeeded()
        workingDirectory: $(repoRoot)
      - pwsh: ./test/onebox/multi-party-collab/remove-resources.ps1 -tag "github_actions=$(Agent.JobName)-$(Build.BuildId)"
        displayName: Delete resource groups
        condition: succeeded()
        workingDirectory: $(repoRoot)

  - job: test_kserve_inferencing_virtual
    displayName: KServe inferencing (virtual)
    timeoutInMinutes: 120
    dependsOn: ${{ parameters.dependsOn }}
    ${{ if ne(parameters.condition, '') }}:
      condition: ${{ parameters.condition }}
    pool:
      type: linux
    variables:
      - template: variables/build-common.yml
      - name: outDir
        value: "$(repoRoot)/test/onebox/workload-samples/generated"
    steps:
      - checkout: self
        submodules: recursive
      - template: steps/setup-docker-on-data-disk.yml
      - template: steps/login-to-azure.yml
      - template: steps/workload-setup-env.yml
        parameters:
          infraType: virtual
          location: centralindia
          outDir: $(outDir)
      - template: steps/workload-test-kserve-inferencing.yml
        parameters:
          location: centralindia
          deploymentConfigDir: $(outDir)
      - task: PublishPipelineArtifact@1
        displayName: Upload test results
        condition: not(canceled())
        inputs:
          targetPath: $(outDir)
          artifact: kserve-inferencing-results-virtual
      - pwsh: ./test/onebox/multi-party-collab/remove-resources.ps1 -tag "github_actions=$(Agent.JobName)-$(Build.BuildId)"
        displayName: Delete resource groups
        condition: succeeded()
        workingDirectory: $(repoRoot)

  # --- AKS DAG: setup-env-aks -> {big-data, kserve} -aks -> cleanup-aks ---
  - job: setup_env_aks
    displayName: Setup env (AKS)
    timeoutInMinutes: 120
    dependsOn: pick_location
    condition: succeeded()
    pool:
      type: linux
    variables:
      - template: variables/build-common.yml
      - name: location
        value: $[ dependencies.pick_location.outputs['pickLocation.location'] ]
    steps:
      - checkout: self
        submodules: recursive
      - template: steps/setup-docker-on-data-disk.yml
      - template: steps/login-to-azure.yml
      - template: steps/workload-setup-env.yml
        parameters:
          infraType: aks
          location: $(location)
          outDir: $(repoRoot)/test/onebox/workload-samples/generated
      - task: PublishPipelineArtifact@1
        displayName: Upload env artifacts
        condition: not(canceled())
        inputs:
          targetPath: $(repoRoot)/test/onebox/workload-samples/generated
          artifact: workload-samples-env-aks

  - job: test_big_data_analytics_aks
    displayName: Big data analytics (AKS)
    timeoutInMinutes: 120
    dependsOn:
      - pick_location
      - setup_env_aks
    condition: succeeded()
    pool:
      type: linux
    variables:
      - template: variables/build-common.yml
      - name: location
        value: $[ dependencies.pick_location.outputs['pickLocation.location'] ]
    steps:
      - checkout: self
        submodules: recursive
      - template: steps/setup-docker-on-data-disk.yml
      - template: steps/login-to-azure.yml
      - task: DownloadPipelineArtifact@2
        displayName: Download env artifacts
        inputs:
          artifact: workload-samples-env-aks
          targetPath: $(repoRoot)/test/onebox/workload-samples/generated
      - template: steps/workload-test-big-data-analytics.yml
        parameters:
          location: $(location)
          deploymentConfigDir: $(repoRoot)/test/onebox/workload-samples/generated
      - task: PublishPipelineArtifact@1
        displayName: Upload test results
        condition: not(canceled())
        inputs:
          targetPath: $(repoRoot)/test/onebox/workload-samples/generated
          artifact: big-data-analytics-results-aks

  - job: test_kserve_inferencing_aks
    displayName: KServe inferencing (AKS)
    timeoutInMinutes: 120
    dependsOn:
      - pick_location
      - setup_env_aks
    condition: succeeded()
    pool:
      type: linux
    variables:
      - template: variables/build-common.yml
      - name: location
        value: $[ dependencies.pick_location.outputs['pickLocation.location'] ]
    steps:
      - checkout: self
        submodules: recursive
      - template: steps/setup-docker-on-data-disk.yml
      - template: steps/login-to-azure.yml
      - task: DownloadPipelineArtifact@2
        displayName: Download env artifacts
        inputs:
          artifact: workload-samples-env-aks
          targetPath: $(repoRoot)/test/onebox/workload-samples/generated
      - template: steps/workload-test-kserve-inferencing.yml
        parameters:
          location: $(location)
          deploymentConfigDir: $(repoRoot)/test/onebox/workload-samples/generated
      - task: PublishPipelineArtifact@1
        displayName: Upload test results
        condition: not(canceled())
        inputs:
          targetPath: $(repoRoot)/test/onebox/workload-samples/generated
          artifact: kserve-inferencing-results-aks

  - job: cleanup_aks
    displayName: Cleanup (AKS)
    timeoutInMinutes: 60
    dependsOn:
      - test_big_data_analytics_aks
      - test_kserve_inferencing_aks
    condition: always()
    pool:
      type: linux
    variables:
      - template: variables/build-common.yml
    steps:
      - checkout: self
        submodules: recursive
      - template: steps/login-to-azure.yml
      - pwsh: ./test/onebox/multi-party-collab/remove-resources.ps1 -tag "github_actions=$(Agent.JobName)-$(Build.BuildId)"
        displayName: Delete resource groups
        workingDirectory: $(repoRoot)
