# Common job variables shared by every build job in pr-build-all-jobs.yml
# (migrated from the identical `env:` block each GitHub job repeated).
# cleanroom-pr-vars is the ADO variable group providing AZURE_CLIENT_ID /
# AZURE_TENANT_ID / AZURE_SUBSCRIPTION_ID / ACR_URL. See MIGRATION.md for detail.

variables:
  - group: cleanroom-pr-vars
  # Test/collab scripts detect CI via `$env:GITHUB_ACTIONS -eq "true"`; when true
  # they name Azure resources uniquely per run (cl-ob-isv-${JOB_ID}-${RUN_ID}) and
  # tag them, avoiding cross-run collisions on the shared 1ES agent.
  - name: GITHUB_ACTIONS
    value: "true"
  - name: RUN_ID
    value: $(Build.BuildId) # was github.run_id
  - name: RUN_ATTEMPT
    value: $(System.JobAttempt) # was github.run_attempt
  # $(System.JobId) is a per-job-attempt GUID (github.job equivalent); System.JobName
  # collapses to "__default" under OneBranch's extends-template wrapping, which would
  # collide resource names across jobs in a run.
  - name: JOB_ID
    value: $(System.JobId)
  - name: USE_PREPROVISIONED_OIDC
    value: "true"
  - name: repoRoot
    value: "$(Build.SourcesDirectory)/azure-cleanroom"
  # OIDC service connection replacing ./.github/actions/login-to-azure.
  - name: azureServiceConnection
    value: "cleanroom-pr-oidc"
