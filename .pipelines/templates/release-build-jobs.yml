################################################################################
# Release build jobs (CUSTOM pool, public feed, NO CodeQL) — the Release-and-Test
# counterpart of official-build-jobs.yml. Produces the SAME outputs (image
# tarballs + dist/bundle/whl drop) but runs entirely on the isCustom
# `cleanroom-emu-ado` pool with public feeds and plain `docker build` (the
# Dockerfiles self-compile against the public NuGet feed). Avoids the governed
# pool / internal feed / CodeQL and the imagebuildinfo ObjectID tag issue. Job
# names (build_solutions / build_artefacts / build_images) match the official
# build so release-and-test-jobs.yml references them unchanged. See MIGRATION.md.
################################################################################

parameters:
  - name: tag
    type: string
    default: ""
  - name: buildType
    type: string
    default: "cleanroom-containers, governance-client-containers, cgs-js-app, cgs-constitution, ccf-provider-client, ccf-network-containers, ccf-recovery-service-containers, ccf-consortium-manager-containers, cleanroom-workload-infra-containers, cleanroom-cluster-provider-client, frontend-service"

jobs:
  # ===========================================================================
  # JOB 1 — tag derivation + native artefacts  (CUSTOM pool, PUBLIC feed)
  # ===========================================================================
  - job: build_solutions
    displayName: Derive tag (custom, public feed)
    timeoutInMinutes: 60
    pool:
      type: linux
      isCustom: true
      name: cleanroom-emu-ado
    variables:
      repoRoot: "$(Build.SourcesDirectory)"
      ob_outputDirectory: "$(Build.SourcesDirectory)/out"
    steps:
      - checkout: self
        submodules: recursive
        fetchTags: true

      # Derive the effective build tag (parameters.tag or short commit hash) and
      # publish it as an OUTPUT variable for the image + artefact jobs.
      - bash: |
          set -euo pipefail
          tag="${{ parameters.tag }}"
          if [ -z "$tag" ]; then
            tag="$(git rev-parse --short HEAD)"
          fi
          echo "Effective build tag: $tag"
          echo "##vso[task.setvariable variable=effectiveTag;isOutput=true]$tag"
          echo "##vso[task.setvariable variable=effectiveTag]$tag"
        name: tagStep
        displayName: Derive effective build tag
        workingDirectory: $(repoRoot)

  # ===========================================================================
  # JOB 2 — docker-buildx non-image artefacts  (CUSTOM pool, PUBLIC feed)
  # ===========================================================================
  # Produces the dist/bundle/whl the release groups + cleanroom-client image
  # need. Same as official-build-jobs.yml's build_artefacts job (already
  # isCustom), plus it carries cgs-constitution forward into the shared drop.
  - job: build_artefacts
    displayName: Build docker-buildx artefacts (custom)
    timeoutInMinutes: 120
    dependsOn: build_solutions
    pool:
      type: linux
      isCustom: true
      name: cleanroom-emu-ado
    variables:
      ob_outputDirectory: "$(Build.SourcesDirectory)/out"
      repoRoot: "$(Build.SourcesDirectory)"
      effectiveTag: $[ dependencies.build_solutions.outputs['tagStep.effectiveTag'] ]
    steps:
      - checkout: self
        submodules: recursive
        fetchTags: true

      - template: steps/setup-docker-on-data-disk.yml

      - template: steps/login-to-azure.yml

      # cleanroom-client dist (Dockerfile.azcliext.cleanroom, target dist -> local)
      - ${{ if contains(parameters.buildType, 'cleanroom-containers') }}:
          - bash: |
              docker buildx build \
                --file ./build/docker/Dockerfile.azcliext.cleanroom \
                --target dist \
                --output type=local,dest=$(repoRoot)/src/tools/cleanroom-client/dist \
                $(repoRoot)
            displayName: Build cleanroom client artefacts
            workingDirectory: $(repoRoot)
          - bash: |
              set -euo pipefail
              mkdir -p "$(ob_outputDirectory)/dist"
              cp -r "$(repoRoot)/src/tools/cleanroom-client/dist/." "$(ob_outputDirectory)/dist/"
            displayName: Collect cleanroom-client dist (into drop)
            workingDirectory: $(repoRoot)

      # cgs-js-app bundle (Dockerfile.governance.ccf-app, target dist -> bundle.json)
      - ${{ if contains(parameters.buildType, 'cgs-js-app') }}:
          - bash: |
              docker buildx build \
                --file ./build/docker/Dockerfile.governance.ccf-app \
                --target dist \
                --output type=local,dest=. \
                $(repoRoot)/src/governance/ccf-app/js
            displayName: Build CGS JS App bundle
            workingDirectory: $(repoRoot)
          - bash: |
              set -euo pipefail
              mkdir -p "$(ob_outputDirectory)/cgs-js-app"
              cp "$(repoRoot)/bundle.json" "$(ob_outputDirectory)/cgs-js-app/cgs-js-app-$(effectiveTag).json"
            displayName: Collect cgs-js-app bundle (into drop)

      # build-azcli whl (build-azcliext-cleanroom.ps1 uses `docker image build`)
      - pwsh: ./build/build-azcliext-cleanroom.ps1 -tag $(effectiveTag) -skipInstall
        displayName: Build cleanroom az cli extension
        workingDirectory: $(repoRoot)
      - bash: |
          set -euo pipefail
          mkdir -p "$(ob_outputDirectory)/cleanroom-cli-whl"
          cp -r "$(repoRoot)/build/bin/azext_cleanroom/dist/." "$(ob_outputDirectory)/cleanroom-cli-whl/"
        displayName: Collect cleanroom-cli.whl (into drop)

      # cgs-constitution (concatenate constitution .js files -> constitution.json).
      # MUST be in THIS job (build_artefacts) — it publishes drop_Build_build_artefacts,
      # and each isCustom job runs on its own bare-VM agent with a separate
      # ob_outputDirectory. Generating it in build_solutions (a different agent)
      # left it out of the published drop, so release-groups' download matched
      # nothing (verified 175650988: 'cannot stat cgs-constitution-*.json',
      # Chunks Downloaded: 0).
      - ${{ if contains(parameters.buildType, 'cgs-constitution') }}:
          - pwsh: |
              $ccfConstitutionDir="$(repoRoot)/src/ccf/ccf-provider-common/constitution"
              $cgsConstitutionDir="$(repoRoot)/src/governance/ccf-app/js/constitution"
              $content=""
              Get-ChildItem $ccfConstitutionDir -Filter *.js | Foreach-Object { $content += Get-Content $_.FullName -Raw }
              Get-ChildItem $cgsConstitutionDir -Filter *.js | Foreach-Object { $content += Get-Content $_.FullName -Raw }
              $content | ConvertTo-Json | Out-File ./constitution.json
            displayName: Build CGS constitution
            workingDirectory: $(repoRoot)
          - bash: |
              set -euo pipefail
              mkdir -p "$(ob_outputDirectory)/cgs-constitution"
              cp "$(repoRoot)/constitution.json" "$(ob_outputDirectory)/cgs-constitution/cgs-constitution-$(effectiveTag).json"
            displayName: Collect cgs-constitution (into drop)
            workingDirectory: $(repoRoot)

      # Publish the artefacts drop (dist/bundle/whl) so release_to_test's
      # release-groups.yml script groups can consume it. Name matches the
      # OneBranch convention drop_<stage>_<job>.
      - task: PublishPipelineArtifact@1
        displayName: Publish build_artefacts drop
        inputs:
          targetPath: $(ob_outputDirectory)
          artifact: drop_Build_build_artefacts

  # ===========================================================================
  # JOB 3 — container image builds via plain docker  (CUSTOM pool, PUBLIC feed)
  # ===========================================================================
  # Builds every release image with plain `docker build` + `docker save` on the
  # isCustom pool and publishes each as a tarball artifact consumed unchanged by
  # steps/release-container.yml. The Dockerfiles self-compile using PUBLIC NuGet
  # inside the build container. No imagebuildinfo, no governed pool, no CodeQL.
  - job: build_images
    displayName: Build container image tarballs (custom)
    timeoutInMinutes: 180
    dependsOn:
      - build_solutions
      - build_artefacts
    pool:
      type: linux
      isCustom: true
      name: cleanroom-emu-ado
    variables:
      ob_outputDirectory: "$(Build.SourcesDirectory)/out"
      repoRoot: "$(Build.SourcesDirectory)"
      buildTag: $[ dependencies.build_solutions.outputs['tagStep.effectiveTag'] ]
    steps:
      - checkout: self
        submodules: recursive
        fetchTags: true

      - template: steps/build-container-prereqs.yml
        parameters:
          addDockerUser: true

      # cleanroom-client image needs the dist in its context. On the bare-VM
      # isCustom pool the checkout lands at $(Build.SourcesDirectory), so download
      # the artefacts drop's dist/ into the cleanroom-client context directly.
      - ${{ if contains(parameters.buildType, 'cleanroom-containers') }}:
          - task: DownloadPipelineArtifact@2
            displayName: Download cleanroom-client dist
            inputs:
              source: current
              artifact: drop_Build_build_artefacts
              patterns: "dist/**"
              path: $(Build.SourcesDirectory)/src/tools/cleanroom-client

      # --- cleanroom-containers group ---
      - ${{ if contains(parameters.buildType, 'cleanroom-containers') }}:
          - template: steps/build-container-image-custom.yml
            parameters: { name: ccr-init, dockerfile: build/docker/Dockerfile.ccr-init }
          - template: steps/build-container-image-custom.yml
            parameters: { name: identity, dockerfile: build/docker/Dockerfile.identity }
          - template: steps/build-container-image-custom.yml
            parameters: { name: blobfuse-launcher, dockerfile: build/docker/Dockerfile.blobfuse-launcher }
          - template: steps/build-container-image-custom.yml
            parameters: { name: s3fs-launcher, dockerfile: build/docker/Dockerfile.s3fs-launcher }
          - template: steps/build-container-image-custom.yml
            parameters: { name: code-launcher, dockerfile: build/docker/Dockerfile.code-launcher }
          - template: steps/build-container-image-custom.yml
            parameters: { name: otel-collector, dockerfile: build/docker/Dockerfile.otel-collector }
          - template: steps/build-container-image-custom.yml
            parameters: { name: ccr-secrets, dockerfile: build/docker/Dockerfile.ccr-secrets }
          - template: steps/build-container-image-custom.yml
            parameters: { name: ccr-governance, dockerfile: build/docker/Dockerfile.ccr-governance }
          - template: steps/build-container-image-custom.yml
            parameters: { name: cleanroom-client, dockerfile: build/docker/Dockerfile.cleanroom-client, context: src/tools/cleanroom-client }
          - template: steps/build-container-image-custom.yml
            parameters: { name: ccr-proxy-ext-processor, dockerfile: build/docker/Dockerfile.proxy-ext-processor }
          - template: steps/build-container-image-custom.yml
            parameters: { name: cvm-attestation-agent, dockerfile: build/docker/Dockerfile.cvm-attestation-agent }

      # --- shared images (ccr-proxy, skr) — built once, gated on OR of groups ---
      - ${{ if or(contains(parameters.buildType, 'cleanroom-containers'), contains(parameters.buildType, 'ccf-network-containers'), contains(parameters.buildType, 'ccf-recovery-service-containers')) }}:
          - template: steps/build-container-image-custom.yml
            parameters: { name: ccr-proxy, dockerfile: build/docker/Dockerfile.proxy }
          - template: steps/build-container-image-custom.yml
            parameters: { name: skr, dockerfile: build/docker/Dockerfile.skr }

      # --- governance-client-containers group ---
      - ${{ if contains(parameters.buildType, 'governance-client-containers') }}:
          - template: steps/build-container-image-custom.yml
            parameters: { name: cgs-client, dockerfile: build/docker/Dockerfile.cgs-client }
          - template: steps/build-container-image-custom.yml
            parameters: { name: cgs-ui, dockerfile: build/docker/Dockerfile.cgs-ui }

      # --- ccf-provider-client group ---
      - ${{ if contains(parameters.buildType, 'ccf-provider-client') }}:
          - template: steps/build-container-image-custom.yml
            parameters: { name: ccf-provider-client, dockerfile: build/docker/Dockerfile.ccf-provider-client }

      # --- ccf-network-containers group ---
      - ${{ if contains(parameters.buildType, 'ccf-network-containers') }}:
          - template: steps/build-container-image-custom.yml
            parameters: { name: ccf-app-run-js-snp, dockerfile: build/docker/Dockerfile.ccf_run_js_app }
          - template: steps/build-container-image-custom.yml
            parameters: { name: ccf-app-run-js-virtual, dockerfile: build/docker/Dockerfile.ccf_run_js_app }
          - template: steps/build-container-image-custom.yml
            parameters: { name: ccf-recovery-agent, dockerfile: build/docker/Dockerfile.ccf-recovery-agent }
          - template: steps/build-container-image-custom.yml
            parameters: { name: cvm-attestation-verifier, dockerfile: build/docker/Dockerfile.cvm-attestation-verifier }

      # --- ccf-recovery-service-containers group ---
      - ${{ if contains(parameters.buildType, 'ccf-recovery-service-containers') }}:
          - template: steps/build-container-image-custom.yml
            parameters: { name: ccf-recovery-service, dockerfile: build/docker/Dockerfile.ccf-recovery-service }

      # --- ccf-consortium-manager-containers group ---
      - ${{ if contains(parameters.buildType, 'ccf-consortium-manager-containers') }}:
          - template: steps/build-container-image-custom.yml
            parameters: { name: ccf-consortium-manager, dockerfile: build/docker/Dockerfile.ccf-consortium-manager }

      # --- cleanroom-cluster-provider-client group ---
      - ${{ if contains(parameters.buildType, 'cleanroom-cluster-provider-client') }}:
          - template: steps/build-container-image-custom.yml
            parameters: { name: cleanroom-cluster-provider-client, dockerfile: build/docker/Dockerfile.cleanroom-cluster-provider-client }

      # --- cleanroom-workload-infra-containers group ---
      - ${{ if contains(parameters.buildType, 'cleanroom-workload-infra-containers') }}:
          - template: steps/build-container-image-custom.yml
            parameters: { name: cleanroom-spark-analytics-agent, dockerfile: build/docker/Dockerfile.cleanroom-spark-analytics-agent }
          - template: steps/build-container-image-custom.yml
            parameters: { name: cleanroom-spark-frontend, dockerfile: build/docker/Dockerfile.cleanroom-spark-frontend }
          - template: steps/build-container-image-custom.yml
            parameters: { name: cleanroom-spark-analytics-app, dockerfile: build/docker/Dockerfile.cleanroom-spark-analytics-app }
          - template: steps/build-container-image-custom.yml
            parameters: { name: kserve-inferencing-agent, dockerfile: build/docker/Dockerfile.kserve-inferencing-agent }
          - template: steps/build-container-image-custom.yml
            parameters: { name: kserve-inferencing-frontend, dockerfile: build/docker/Dockerfile.kserve-inferencing-frontend }
          - template: steps/build-container-image-custom.yml
            parameters: { name: ohttp-gateway, dockerfile: build/docker/Dockerfile.ohttp-gateway }

      # --- frontend-service group ---
      - ${{ if contains(parameters.buildType, 'frontend-service') }}:
          - template: steps/build-container-image-custom.yml
            parameters: { name: frontend-service, dockerfile: build/docker/Dockerfile.frontend-service }

      # Publish ALL image tarballs as the single OneBranch-mandated isCustom drop
      # (isCustom jobs may only publish an artifact named drop_<stage>_<job> =
      # drop_Build_build_images). steps/release-container.yml pattern-downloads
      # just its own images/<name>-<tag>.tar from this drop during release_to_test.
      - task: PublishPipelineArtifact@1
        displayName: Publish build_images drop
        inputs:
          targetPath: $(ob_outputDirectory)/images
          artifact: drop_Build_build_images
