      # MHSM env used by ml-training run-collab-aci.
      - name: TDP_HSM_RESOURCE_GROUP
        value: azcleanroom-emu-bvt-rg
      - name: TDP_MHSM_NAME
        value: azcleanroomemubvthsm
      - name: TDC_HSM_RESOURCE_GROUP
