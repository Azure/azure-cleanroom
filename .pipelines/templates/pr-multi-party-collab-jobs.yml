        submodules: recursive
      - template: steps/setup-docker-on-data-disk.yml
      - template: steps/login-to-azure.yml
      - template: steps/install-cleanroom-cli.yml
      - pwsh: |
          $env:TDP_HSM_RESOURCE_GROUP='$(TDP_HSM_RESOURCE_GROUP)'
          $env:TDP_MHSM_NAME='$(TDP_MHSM_NAME)'
          $env:TDC_HSM_RESOURCE_GROUP='$(TDC_HSM_RESOURCE_GROUP)'
          $env:TDC_MHSM_NAME='$(TDC_MHSM_NAME)'
          ./test/onebox/multi-party-collab/ml-training/run-collab-aci.ps1 -registry acr -repo $(ACR_URL) -tag $(Build.BuildId) -kvType "$(kvType)"
        displayName: Run collab scenario on CACI
        workingDirectory: $(repoRoot)
      - pwsh: docker compose -p ob-ml-training-ccf-provider logs
        displayName: Dump ccf-provider logs
        condition: not(canceled())
        workingDirectory: $(repoRoot)
      - pwsh: docker logs ob-isv-client-cgs-client-1
        displayName: Dump ob-isv-client logs
        condition: not(canceled())
        workingDirectory: $(repoRoot)
      - task: PublishPipelineArtifact@1
        displayName: Upload generated
        condition: not(canceled())
        inputs:
          targetPath: $(repoRoot)/test/onebox/multi-party-collab/ml-training/generated
          artifact: generated-ml-training-caci-$(kvType)
      - pwsh: ./test/onebox/multi-party-collab/remove-resources.ps1 -tag "github_actions=multi-party-collab-$(kvType)-$(Agent.JobName)-$(Build.BuildId)"
        displayName: Delete resource groups
        condition: succeeded()
        workingDirectory: $(repoRoot)

  # --- nginx-hello-caci ---
  - job: nginx_hello_caci
    displayName: Nginx hello (CACI)
    timeoutInMinutes: 180
    dependsOn: ${{ parameters.dependsOn }}
    ${{ if ne(parameters.condition, '') }}:
      condition: ${{ parameters.condition }}
    pool:
      type: linux
    variables:
      - template: variables/build-common.yml
    steps:
      - checkout: self
        submodules: recursive
      - template: steps/setup-docker-on-data-disk.yml
      - template: steps/login-to-azure.yml
      - template: steps/install-cleanroom-cli.yml
      - template: steps/acr-login-from-repo.yml
      - pwsh: ./test/onebox/multi-party-collab/nginx-hello/run-collab-aci.ps1 -registry acr -repo $(ACR_URL) -tag $(Build.BuildId)
        displayName: Run collab scenario on CACI
        workingDirectory: $(repoRoot)
      - pwsh: docker compose -p ob-nginx-hello-ccf-provider logs
        displayName: Dump ccf-provider logs
        condition: not(canceled())
        workingDirectory: $(repoRoot)
      - pwsh: docker logs ob-nginx-client-cgs-client-1
        displayName: Dump ob-nginx-client logs
        condition: not(canceled())
        workingDirectory: $(repoRoot)
      - pwsh: docker logs ccr-client-proxy
        displayName: Dump ccr-client-proxy logs
        condition: not(canceled())
        workingDirectory: $(repoRoot)
      - task: PublishPipelineArtifact@1
        displayName: Upload generated
        condition: not(canceled())
        inputs:
          targetPath: $(repoRoot)/test/onebox/multi-party-collab/nginx-hello/generated/configurations
          artifact: generated-nginx-hello-caci
      - pwsh: ./test/onebox/multi-party-collab/remove-resources.ps1 -tag "github_actions=multi-party-collab-$(Agent.JobName)-$(Build.BuildId)"
        displayName: Delete resource groups
        condition: succeeded()
        workingDirectory: $(repoRoot)
