      - template: steps/install-cleanroom-cli.yml
      - pwsh: |
          $env:TDP_HSM_RESOURCE_GROUP='$(TDP_HSM_RESOURCE_GROUP)'
          $env:TDP_MHSM_NAME='$(TDP_MHSM_NAME)'
          $env:TDC_HSM_RESOURCE_GROUP='$(TDC_HSM_RESOURCE_GROUP)'
          $env:TDC_MHSM_NAME='$(TDC_MHSM_NAME)'
          ./test/onebox/multi-party-collab/ml-training/run-collab-aci.ps1 -registry acr -repo $(ACR_URL) -tag $(Build.BuildId) -kvType "$(kvType)"
