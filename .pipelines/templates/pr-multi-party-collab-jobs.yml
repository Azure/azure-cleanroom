# Multi-Party Collab sample PR test jobs (migrated from
# .github/workflows/pr_multi_party_collab_samples.yml, 12 scenario jobs).
# Consumed by PR-Validation.yml, gated on testStages contains
# 'test-multi-party-collab'. Each job: checkout -> setup-docker -> login ->
# [kind-up] -> install cleanroom cli -> run-collab scenario -> dump logs ->
# remove-resources. See MIGRATION.md for detail.
# scenarios use run-collab-aci.ps1 (no Kind). repo=$(ACR_URL) so the ACR branch
# of each composite is used (the MCR/-NoBuild branch applies only to MCR repos).
#
# 12 jobs: encrypted-storage, encrypted-storage-cleanroom-client,
#   encrypted-storage-csi-driver, encrypted-storage-blobfuse-proxy-sidecar,
#   db-access, mongo-db-access, quote-of-the-day, encrypted-storage-caci,
#   encrypted-storage-cleanroom-client-caci, ml-training-caci (matrix),
#   nginx-hello, nginx-hello-caci.

parameters:
  - name: dependsOn
    type: object
    default: []
  - name: condition
    type: string
    default: ""

jobs:
  # --- WORKED PATTERN: encrypted-storage (Kind) ---
  - job: encrypted_storage
    displayName: Encrypted storage
    timeoutInMinutes: 120
    dependsOn: ${{ parameters.dependsOn }}
    ${{ if ne(parameters.condition, '') }}:
      condition: ${{ parameters.condition }}
    pool:
      type: linux
      isCustom: true
      name: cleanroom-emu-ado
    variables:
      repoRoot: "$(Build.SourcesDirectory)"
      ob_outputDirectory: "$(Build.SourcesDirectory)/out"
    steps:
      - checkout: self
        submodules: recursive
      - template: steps/setup-docker-on-data-disk.yml
      - template: steps/login-to-azure.yml
      - bash: bash ./test/onebox/kind-up.sh
        displayName: Deploy Kind cluster
        workingDirectory: $(repoRoot)
      - template: steps/install-cleanroom-cli.yml
      - pwsh: ./test/onebox/multi-party-collab/encrypted-storage/run-collab.ps1 -registry acr -repo $(ACR_URL) -tag $(Build.BuildId)
        displayName: Run collab scenario on Kind
        workingDirectory: $(repoRoot)
      - pwsh: docker logs ob-consumer-client-cgs-client-1
        displayName: Dump ob-consumer-client logs
        condition: not(canceled())
        workingDirectory: $(repoRoot)
      - pwsh: docker logs ob-publisher-client-cgs-client-1
        displayName: Dump ob-publisher-client logs
        condition: not(canceled())
        workingDirectory: $(repoRoot)
      - pwsh: docker logs ob-ccf-encrypted-storage-ccf-1
        displayName: Dump ccf logs
        condition: not(canceled())
        workingDirectory: $(repoRoot)
      - pwsh: kubectl logs -l app=virtual-cleanroom --tail=-1 --all-containers --ignore-errors --prefix
        displayName: Dump virtual-cleanroom logs
        condition: not(canceled())
        workingDirectory: $(repoRoot)
      - bash: |
          set -euo pipefail
          mkdir -p "$(ob_outputDirectory)/generated-encrypted-storage"
          cp -r "$(repoRoot)/test/onebox/multi-party-collab/encrypted-storage/generated/." "$(ob_outputDirectory)/generated-encrypted-storage/" 2>/dev/null || true
        displayName: Collect generated to output
        condition: not(canceled())
      - pwsh: ./test/onebox/multi-party-collab/remove-resources.ps1 -tag "github_actions=multi-party-collab-$(Agent.JobName)-$(Build.BuildId)"
        displayName: Delete resource groups
        condition: succeeded()
        workingDirectory: $(repoRoot)

  # --- encrypted-storage (cleanroom-client) Kind ---
  - job: encrypted_storage_cleanroom_client
    displayName: Encrypted storage (cleanroom-client)
    timeoutInMinutes: 120
    dependsOn: ${{ parameters.dependsOn }}
    ${{ if ne(parameters.condition, '') }}:
