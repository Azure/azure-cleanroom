  # --- ml-training-caci (matrix key-store) ---
  - job: ml_training_caci
    displayName: ML training (CACI)
    timeoutInMinutes: 180
    dependsOn: ${{ parameters.dependsOn }}
    ${{ if ne(parameters.condition, '') }}:
      condition: ${{ parameters.condition }}
    pool:
      type: linux
      isCustom: true
      name: cleanroom-emu-ado
    strategy:
      matrix:
        akvpremium: { kvType: akvpremium }
    variables:
      repoRoot: "$(Build.SourcesDirectory)"
      ob_outputDirectory: "$(Build.SourcesDirectory)/out"
      # MHSM env used by ml-training run-collab-aci.
      TDP_HSM_RESOURCE_GROUP: azcleanroom-emu-bvt-rg
