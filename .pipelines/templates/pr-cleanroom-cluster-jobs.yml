# Job definitions for the Cleanroom Cluster Provider PR tests.
# Migrated from .github/workflows/pr_cleanroom_cluster.yml (workflow_call).
# Consumed by PR-Validation.yml, gated on testStages contains
# 'test-cleanroom-cluster'.
#
# Structure (mirrors GitHub):
#   pick_location (random region -> output var)
#   aks_cleanroom_cluster            (needs pick_location)
#   virtual_cleanroom_cluster        (no location)
#   aks_cleanroom_cluster_flexnode   (needs pick_location)
#   virtual_cleanroom_cluster_flexnode
#
# Each cluster job: checkout -> setup-docker -> login -> deploy-cluster.ps1 ->
# test-cluster.ps1 -> dump logs (!cancelled) -> [upload artifacts] -> [remove RGs].
#
# Parameters let the orchestrator gate the whole group. Since a template can't be
# conditionally included with a single condition across multiple jobs, the gate
# is applied to pick_location + each job via dependsOn/condition.

parameters:
  - name: dependsOn
    type: object
    default: []
  - name: condition
    type: string
    default: ""

jobs:
  - job: pick_location
    displayName: Pick location
    dependsOn: ${{ parameters.dependsOn }}
    ${{ if ne(parameters.condition, '') }}:
      condition: ${{ parameters.condition }}
    pool:
      type: linux
    steps:
      - checkout: none
      - template: steps/pick-location.yml

  - job: aks_cleanroom_cluster
    displayName: AKS cleanroom cluster
    timeoutInMinutes: 180
    dependsOn: pick_location
    condition: succeeded()
    pool:
      type: linux # TODO(Phase 1C): 1ES pool with Docker daemon
    variables:
      - template: variables/build-common.yml
      - name: location
        value: $[ dependencies.pick_location.outputs['pickLocation.location'] ]
    steps:
      - checkout: self
        submodules: recursive
      - template: steps/setup-docker-on-data-disk.yml
      - template: steps/login-to-azure.yml
      - pwsh: |
          ./samples/workloads/azcli/deploy-cluster.ps1 `
            -infraType aks -enableObservability -enableAnalytics `
            -securityPolicyCreationOption cached-debug `
            -registry acr -repo $(ACR_URL) -tag $(Build.BuildId) -location $(location)
        displayName: Deploy CACI/VN2 backed cluster
        workingDirectory: $(repoRoot)
      - pwsh: ./samples/workloads/azcli/test-cluster.ps1 -testAnalytics
        displayName: Test Spark application run
        workingDirectory: $(repoRoot)
      - pwsh: docker compose -p cleanroom-cluster-provider logs
        displayName: Dump cleanroom-cluster-provider logs
        condition: not(canceled())
        workingDirectory: $(repoRoot)
      - pwsh: ./samples/workloads/azcli/dump-cleanroom-cluster-logs.ps1
        displayName: Dump cleanroom-cluster logs
        condition: not(canceled())
        workingDirectory: $(repoRoot)
      - task: PublishPipelineArtifact@1
        displayName: Upload generated artifacts
        condition: always()
        inputs:
          targetPath: $(repoRoot)/samples/workloads/azcli/sandbox_common
          artifact: aks-cleanroom-cluster
      - pwsh: ./samples/ccf/azcli/remove-resources.ps1 -tag "github_actions=cleanroom-cluster-$(Agent.JobName)-$(Build.BuildId)"
        displayName: Delete resource groups
        condition: succeeded()
        workingDirectory: $(repoRoot)

  - job: virtual_cleanroom_cluster
    displayName: Virtual cleanroom cluster
    timeoutInMinutes: 180
    dependsOn: ${{ parameters.dependsOn }}
    ${{ if ne(parameters.condition, '') }}:
      condition: ${{ parameters.condition }}
    pool:
      type: linux
    variables:
      - template: variables/build-common.yml
    steps:
      - checkout: self
        submodules: recursive
      - template: steps/setup-docker-on-data-disk.yml
      - template: steps/login-to-azure.yml
      - pwsh: |
          ./samples/workloads/azcli/deploy-cluster.ps1 `
            -infraType virtual -enableObservability -enableAnalytics -enableKServeInferencing `
            -registry acr -repo $(ACR_URL) -tag $(Build.BuildId)
        displayName: Deploy virtual cluster
        workingDirectory: $(repoRoot)
      - pwsh: ./samples/workloads/azcli/test-cluster.ps1 -testAnalytics -testKServeInferencing
        displayName: Test workload run
        workingDirectory: $(repoRoot)
      - pwsh: docker compose -p cleanroom-cluster-provider logs
        displayName: Dump cleanroom-cluster-provider logs
        condition: not(canceled())
        workingDirectory: $(repoRoot)
      - pwsh: ./samples/workloads/azcli/dump-cleanroom-cluster-logs.ps1
        displayName: Dump cleanroom-cluster logs
        condition: not(canceled())
        workingDirectory: $(repoRoot)

  - job: aks_cleanroom_cluster_flexnode
    displayName: AKS cleanroom cluster (flex node)
    timeoutInMinutes: 180
    dependsOn: pick_location
    condition: succeeded()
    pool:
      type: linux
    variables:
      - template: variables/build-common.yml
      - name: location
        value: $[ dependencies.pick_location.outputs['pickLocation.location'] ]
    steps:
      - checkout: self
        submodules: recursive
      - template: steps/setup-docker-on-data-disk.yml
      - template: steps/login-to-azure.yml
      - pwsh: |
          ./samples/workloads/azcli/deploy-cluster.ps1 `
            -infraType aks -enableObservability -enableFlexNode -flexNodeInsecure `
            -flexNodeProvisionUsingSSH -enableKServeInferencing `
            -registry acr -repo $(ACR_URL) -tag $(Build.BuildId) -location $(location)
        displayName: Deploy cluster with flex node
        workingDirectory: $(repoRoot)
      - pwsh: ./samples/workloads/azcli/test-cluster.ps1 -testKServeInferencing
        displayName: Test flex node workloads
        workingDirectory: $(repoRoot)
      - pwsh: docker compose -p cleanroom-cluster-provider logs
        displayName: Dump cleanroom-cluster-provider logs
        condition: not(canceled())
        workingDirectory: $(repoRoot)
      - pwsh: ./samples/workloads/azcli/dump-cleanroom-cluster-logs.ps1
        displayName: Dump cleanroom-cluster logs
        condition: not(canceled())
        workingDirectory: $(repoRoot)
      - task: PublishPipelineArtifact@1
        displayName: Upload generated artifacts
        condition: always()
        inputs:
          targetPath: $(repoRoot)/samples/workloads/azcli/sandbox_common
          artifact: aks-cleanroom-cluster-flexnode
      - pwsh: ./samples/ccf/azcli/remove-resources.ps1 -tag "github_actions=cleanroom-cluster-$(Agent.JobName)-$(Build.BuildId)"
        displayName: Delete resource groups
        condition: succeeded()
        workingDirectory: $(repoRoot)

  - job: virtual_cleanroom_cluster_flexnode
    displayName: Virtual cleanroom cluster (flex node)
    timeoutInMinutes: 180
    dependsOn: ${{ parameters.dependsOn }}
    ${{ if ne(parameters.condition, '') }}:
      condition: ${{ parameters.condition }}
    pool:
      type: linux
    variables:
      - template: variables/build-common.yml
    steps:
      - checkout: self
        submodules: recursive
      - template: steps/setup-docker-on-data-disk.yml
      - template: steps/login-to-azure.yml
      - pwsh: |
          ./samples/workloads/azcli/deploy-cluster.ps1 `
            -infraType virtual -registry acr -enableObservability -enableFlexNode `
            -flexNodeInsecure -enableKServeInferencing -repo $(ACR_URL) -tag $(Build.BuildId)
        displayName: Deploy virtual cluster with flex node
        workingDirectory: $(repoRoot)
      - pwsh: ./samples/workloads/azcli/test-cluster.ps1 -testKServeInferencing
        displayName: Test Flex Node workloads
        workingDirectory: $(repoRoot)
      - pwsh: docker compose -p cleanroom-cluster-provider logs
        displayName: Dump cleanroom-cluster-provider logs
        condition: not(canceled())
        workingDirectory: $(repoRoot)
      - pwsh: ./samples/workloads/azcli/dump-cleanroom-cluster-logs.ps1
        displayName: Dump cleanroom-cluster logs
        condition: not(canceled())
        workingDirectory: $(repoRoot)
