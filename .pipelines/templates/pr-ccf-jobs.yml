# Job definitions for the CCF PR tests. Migrated from .github/workflows/pr_ccf.yml
# (workflow_call, 11 recovery-scenario jobs). Consumed by PR-Validation.yml, gated
# on testStages contains 'test-ccf'.
#
# Each job shares the prefix: checkout -> setup-docker -> login-to-azure, then a
# recovery scenario: deploy-ccf.ps1 -> deploy-cgs.ps1 -> recover-ccf.ps1 ->
# validate-cgs-recovery.ps1, interleaved with many diagnostic `docker logs` /
# show-docker-logs.ps1 dumps (if !cancelled).
#
# This template captures the JOB STRUCTURE + CORE recovery flow faithfully. For
# the caci-* jobs the interleaved diagnostic log-dump steps (docker logs
# <container>) are ported via steps/dump-docker-logs.yml. For the docker-*
# (virtual) jobs the optional diagnostics are omitted (non-gating).
#
# 11 jobs:
#   docker-operator-recovery                      (matrix key-store: localfs, akv; -nodeCount 3)
#   docker-confidential-recovery                  (-nodeCount 3 -confidentialRecovery)
#   docker-confidential-recovery-onestep          (... -oneStepRecovery)
#   docker-confidential-recovery-consortium-manager
#   caci-operator-recovery                        (-nodeCount 1 — SSL join issue, gsinha)
#   caci-confidential-recovery
#   caci-confidential-recovery-ccf-upgrade
#   caci-confidential-recovery-recsvc-upgrade
#   caci-allow-all-confidential-recovery
#   caci-confidential-recovery-onestep
#   caci-confidential-recovery-consortium-manager
#
# NOTE: docker-* use -infraType virtual; caci-* use -infraType caci (-nodeCount 1).

parameters:
  - name: dependsOn
    type: object
    default: []
  - name: condition
    type: string
    default: ""

jobs:
  - job: docker_operator_recovery
    displayName: Docker operator recovery
    timeoutInMinutes: 120
    dependsOn: ${{ parameters.dependsOn }}
    ${{ if ne(parameters.condition, '') }}:
      condition: ${{ parameters.condition }}
    pool:
      type: linux # TODO(Phase 1C): 1ES pool with Docker daemon
    strategy:
      matrix:
        localfs: { key-store: localfs }
        akv: { key-store: akv }
    variables:
      - template: variables/build-common.yml
    steps:
      - checkout: self
        submodules: recursive
      - template: steps/setup-docker-on-data-disk.yml
      - template: steps/login-to-azure.yml
      - pwsh: |
          ./samples/ccf/azcli/deploy-ccf.ps1 -infraType virtual -nodeCount 3 `
            -keyStoreType $(key-store) -registry acr -repo $(ACR_URL) -tag $(Build.BuildId)
        displayName: Deploy local virtual CCF network via CCF provider
        workingDirectory: $(repoRoot)
      - pwsh: ./samples/ccf/azcli/deploy-cgs.ps1 -registry acr -repo $(ACR_URL) -tag $(Build.BuildId)
        displayName: Test CGS sample on local virtual CCF network
        workingDirectory: $(repoRoot)
      - pwsh: ./samples/ccf/azcli/recover-ccf.ps1 -nodeCount 3
        displayName: Recover CCF network
        workingDirectory: $(repoRoot)
      - pwsh: ./samples/ccf/azcli/validate-cgs-recovery.ps1
        displayName: Validate CGS recovery
        workingDirectory: $(repoRoot)
      # NOTE: interleaved `docker logs`/copy-docker-logs.ps1 diagnostics from
      # pr_ccf.yml are optional (if: !cancelled()) and omitted here.

  - job: docker_confidential_recovery
    displayName: Docker confidential recovery
    timeoutInMinutes: 120
    dependsOn: ${{ parameters.dependsOn }}
    ${{ if ne(parameters.condition, '') }}:
      condition: ${{ parameters.condition }}
    pool:
      type: linux
    variables:
      - template: variables/build-common.yml
    steps:
      - checkout: self
        submodules: recursive
      - template: steps/setup-docker-on-data-disk.yml
      - template: steps/login-to-azure.yml
      - pwsh: ./samples/ccf/azcli/deploy-ccf.ps1 -infraType virtual -nodeCount 3 -registry acr -repo $(ACR_URL) -tag $(Build.BuildId)
        displayName: Deploy local virtual CCF network
        workingDirectory: $(repoRoot)
      - pwsh: ./samples/ccf/azcli/deploy-cgs.ps1 -registry acr -repo $(ACR_URL) -tag $(Build.BuildId)
        displayName: Test CGS sample
        workingDirectory: $(repoRoot)
      - pwsh: ./samples/ccf/azcli/recover-ccf.ps1 -nodeCount 3 -confidentialRecovery
        displayName: Recover CCF (confidential)
        workingDirectory: $(repoRoot)
      - pwsh: ./samples/ccf/azcli/validate-cgs-recovery.ps1
        displayName: Validate CGS recovery
        workingDirectory: $(repoRoot)
      # NOTE: optional show-docker-logs.ps1 recovery-agent/recovery-service
      # diagnostics omitted (non-gating).

  - job: docker_confidential_recovery_onestep
    displayName: Docker confidential recovery (one-step)
    timeoutInMinutes: 120
    dependsOn: ${{ parameters.dependsOn }}
    ${{ if ne(parameters.condition, '') }}:
      condition: ${{ parameters.condition }}
    pool:
      type: linux
    variables:
      - template: variables/build-common.yml
    steps:
      - checkout: self
        submodules: recursive
      - template: steps/setup-docker-on-data-disk.yml
      - template: steps/login-to-azure.yml
      - pwsh: ./samples/ccf/azcli/deploy-ccf.ps1 -infraType virtual -nodeCount 3 -registry acr -repo $(ACR_URL) -tag $(Build.BuildId)
        displayName: Deploy local virtual CCF network
        workingDirectory: $(repoRoot)
      - pwsh: ./samples/ccf/azcli/deploy-cgs.ps1 -registry acr -repo $(ACR_URL) -tag $(Build.BuildId)
        displayName: Test CGS sample
        workingDirectory: $(repoRoot)
      - pwsh: ./samples/ccf/azcli/recover-ccf.ps1 -nodeCount 3 -confidentialRecovery -oneStepRecovery
        displayName: Recover CCF (confidential, one-step)
        workingDirectory: $(repoRoot)
      - pwsh: ./samples/ccf/azcli/validate-cgs-recovery.ps1
        displayName: Validate CGS recovery
        workingDirectory: $(repoRoot)
      # NOTE: optional diagnostic dumps omitted (non-gating).

  - job: docker_confidential_recovery_consortium_manager
    displayName: Docker confidential recovery (consortium manager)
    timeoutInMinutes: 120
    dependsOn: ${{ parameters.dependsOn }}
    ${{ if ne(parameters.condition, '') }}:
      condition: ${{ parameters.condition }}
    pool:
      type: linux
    variables:
      - template: variables/build-common.yml
    steps:
      - checkout: self
        submodules: recursive
      - template: steps/setup-docker-on-data-disk.yml
      - template: steps/login-to-azure.yml
      - pwsh: ./samples/ccf/azcli/deploy-ccf.ps1 -infraType virtual -nodeCount 3 -registry acr -repo $(ACR_URL) -tag $(Build.BuildId)
        displayName: Deploy local virtual CCF network
        workingDirectory: $(repoRoot)
      - pwsh: ./samples/ccf/azcli/recover-ccf.ps1 -nodeCount 3 -confidentialRecovery
        displayName: Recover CCF (confidential, consortium manager)
        workingDirectory: $(repoRoot)
      # NOTE: optional diagnostic dumps omitted (non-gating).

  # --- caci-* recovery jobs (infraType caci, -nodeCount 1 per gsinha SSL note) ---
  # Migrated from pr_ccf.yml (lines 463-1148). Each job: deploy-ccf (caci) ->
  # deploy-cgs -> recover/upgrade variant -> validate-cgs-recovery, interleaved
  # with `docker logs` diagnostics (grouped via steps/dump-docker-logs.yml).

  - job: caci_operator_recovery
    displayName: CACI operator recovery
    timeoutInMinutes: 180
    dependsOn: ${{ parameters.dependsOn }}
    ${{ if ne(parameters.condition, '') }}:
      condition: ${{ parameters.condition }}
    pool:
      type: linux # TODO(Phase 1C): 1ES pool with Docker daemon
    variables:
      - template: variables/build-common.yml
    steps:
      - checkout: self
        submodules: recursive
      - template: steps/setup-docker-on-data-disk.yml
      - template: steps/login-to-azure.yml
      - pwsh: ./samples/ccf/azcli/deploy-ccf.ps1 -infraType caci -nodeCount 1 -securityPolicyCreationOption cached-debug -registry acr -repo $(ACR_URL) -tag $(Build.BuildId)
        displayName: Deploy a CACI CCF network via CCF provider
        workingDirectory: $(repoRoot)
      - template: steps/dump-docker-logs.yml
        parameters:
          displayName: Dump operator + ccf-provider-client logs
          containers: [ccf-provider-governance-cgs-client-1, ccf-provider-client-1]
      - pwsh: ./samples/ccf/azcli/deploy-cgs.ps1 -registry acr -repo $(ACR_URL) -tag $(Build.BuildId)
        displayName: Test CGS sample on a CACI CCF network deployed via CCF provider
        workingDirectory: $(repoRoot)
      - template: steps/dump-docker-logs.yml
        parameters:
          displayName: Dump add/invite/member0 cgs-client logs
          containers: [ccf-add-azure-user-cgs-client-1, ccf-invite-azure-user-cgs-client-1, member0-governance-cgs-client-1]
      - pwsh: ./samples/ccf/azcli/recover-ccf.ps1 -oneStepRecovery -nodeCount 1 -securityPolicyCreationOption cached-debug
        displayName: Recover single node CACI CCF network via operator recovery in one step
        workingDirectory: $(repoRoot)
      - pwsh: ./samples/ccf/azcli/validate-cgs-recovery.ps1
        displayName: Validate CGS state after recovery
        workingDirectory: $(repoRoot)
      - template: steps/dump-docker-logs.yml
        parameters:
          displayName: Dump operator + member0 cgs-client logs
          containers: [ccf-provider-governance-cgs-client-1, member0-governance-cgs-client-1]
      - pwsh: ./samples/ccf/azcli/test-ccf-upgrade-via-scale-up.ps1
        displayName: Upgrade single node CACI CCF network via scale up
        workingDirectory: $(repoRoot)
      - pwsh: ./samples/ccf/azcli/validate-cgs-recovery.ps1
        displayName: Validate CGS state after upgrade (scale up)
        workingDirectory: $(repoRoot)
      - template: steps/dump-docker-logs.yml
        parameters:
          displayName: Dump member0 + ccf-provider-client logs
          containers: [member0-governance-cgs-client-1, ccf-provider-client-1]
      - pwsh: ./samples/ccf/azcli/remove-resources.ps1 -tag "github_actions=ccf-network-$(Agent.JobName)-$(Build.BuildId)"
        displayName: Delete resource groups
        condition: succeeded()
        workingDirectory: $(repoRoot)

  - job: caci_confidential_recovery
    displayName: CACI confidential recovery
    timeoutInMinutes: 180
