      - template: steps/setup-docker-on-data-disk.yml
      - template: steps/login-to-azure.yml
      - pwsh: ./samples/ccf/azcli/deploy-ccf.ps1 -infraType caci -nodeCount 1 -securityPolicyCreationOption cached-debug -confidentialRecovery -oneStepConfigureConfidentialRecovery -useConsortiumManager -registry acr -repo $(ACR_URL) -tag $(Build.BuildId)
