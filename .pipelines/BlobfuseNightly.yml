################################################################################
# Blobfuse Nightly DI Test — scheduled (migrated from
# .github/workflows/blobfuse_nightly.yml, cron "30 2 * * *" = 08:00 IST). 3 independent jobs:
# data-integrity CSE, data-integrity CPK, perf — ported via the blobfuse-setup /
# blobfuse-data-integrity-*/mount/cleanup step templates. See MIGRATION.md.
################################################################################

schedules:
  - cron: "30 2 * * *"
    displayName: Nightly blobfuse DI test (08:00 IST / 02:30 UTC)
    branches:
      include:
        - develop
    always: true

trigger: none
pr: none

name: blobfuse-nightly-$(Date:yyyyMMdd).$(Rev:r)

# Shared build vars (var group cleanroom-pr-vars + azureServiceConnection + RUN_*)
# live at PIPELINE scope so each custom job's own `variables:` can stay a pure MAP
# (no `- template:` include). OneBranch's Linux.Custom.Job.yml reads
# ob_outputDirectory from the JOB's variables at COMPILE time to derive the drop
# artifact name; a `- template:` include in a job's variables list makes that
# lookup non-static and trips the custom-job artifact guard.
#
# NOTE: this top-level include (before `extends`) resolves RELATIVE to this file's
# directory (.pipelines/), so it uses the file-relative path with no @self — unlike
# the in-stage step/job includes below, which resolve from the repo root and need
# the full `.pipelines/...@self` form.
variables:
  - template: templates/variables/build-common.yml

resources:
  repositories:
    - repository: templates
      type: git
      name: OneBranch.Pipelines/GovernedTemplates
      ref: refs/heads/main

extends:
  template: v2/OneBranch.NonOfficial.CrossPlat.yml@templates
  parameters:
    cloudvault:
      enabled: false
    globalSdl:
      # DI jobs build blobfuse2 + do az/storage + FUSE mounts (no build artifacts
      # to analyze); the long file-heavy run makes the SDL dependency analyzer
      # teardown time out (see CleanupStalePrResources.yml). Disable it.
      disableDependencyAnalyzer: true
      tsa:
        enabled: false
      policheck:
        break: true
    stages:
      - stage: BlobfuseNightly
        displayName: Blobfuse Nightly DI Test
        jobs:
          - job: blobfuse_e2e_data_integrity_cse
            displayName: Blobfuse E2E data integrity (CSE)
            timeoutInMinutes: 240
            pool:
              type: linux
              isCustom: true
              name: cleanroom-emu-ado
            variables:
              # Pure MAP (no `- template:` include) so ob_outputDirectory is
              # compile-time static for OneBranch's custom-job drop naming. Bare-VM
              # pool checks out into $(Build.SourcesDirectory) — override repoRoot.
              repoRoot: "$(Build.SourcesDirectory)"
              ob_outputDirectory: "$(Build.SourcesDirectory)/out"
            steps:
              - bash: sudo rm -rf /opt/hostedtoolcache
                displayName: Delete huge unnecessary tools folder
              - checkout: self
                submodules: recursive
              # NOTE: no setup-docker step — the DI flow is pure Go build + az
              # storage + FUSE mount, it does not use the docker daemon.
              - template: .pipelines/templates/steps/login-to-azure.yml@self
              - bash: |
                  HASHED_RUN_ID=$(echo -n "$(Build.BuildId)" | sha256sum | cut -c1-10)
                  echo "##vso[task.setvariable variable=HASHED_RUN_ID]$HASHED_RUN_ID"
                displayName: Generate hashed run ID
              - template: .pipelines/templates/steps/blobfuse-setup.yml@self
                parameters:
                  resourceGroup: blobfusecse-rg-$(HASHED_RUN_ID)
                  storageAccount: blobfusecse$(HASHED_RUN_ID)
              - template: .pipelines/templates/steps/blobfuse-data-integrity-cse.yml@self
                parameters:
                  account_type: block
                  mount_dir_source: $(repoRoot)/blob_source
                  temp_dir_source: $(repoRoot)/temp_source
                  config_file_source: $(repoRoot)/config_source.yaml
                  mount_dir_plain: $(repoRoot)/blob_plain
                  temp_dir_plain: $(repoRoot)/temp_plain
                  config_file_plain: $(repoRoot)/config_plain.yaml
                  mount_dir_encrypted: $(repoRoot)/blob_encrypted
                  temp_dir_encrypted: $(repoRoot)/temp_encrypted
                  config_file_encrypted: $(repoRoot)/config_encrypted.yaml
              - pwsh: az group delete --name "blobfusecse-rg-$(HASHED_RUN_ID)" --yes --no-wait
                displayName: Cleanup
                condition: succeeded()

          - job: blobfuse_e2e_data_integrity_cpk
            displayName: Blobfuse E2E data integrity (CPK)
            # 300 (was 180): the Compare-SHA256 step hashes ~73GB through encrypted
            # fuse mounts twice; on the D4ds_v4 ephemeral agents this runs 69-97 min
            # (vs GitHub's faster runners) and intermittently overran the 180 cap.
            timeoutInMinutes: 300
            pool:
              type: linux
              isCustom: true
              name: cleanroom-emu-ado
            variables:
              repoRoot: "$(Build.SourcesDirectory)"
              ob_outputDirectory: "$(Build.SourcesDirectory)/out"
            steps:
              - bash: sudo rm -rf /opt/hostedtoolcache
                displayName: Delete huge unnecessary tools folder
              - checkout: self
                submodules: recursive
              # NOTE: no setup-docker step — pure Go build + az storage + FUSE mount.
              - template: .pipelines/templates/steps/login-to-azure.yml@self
              - bash: |
                  HASHED_RUN_ID=$(echo -n "$(Build.BuildId)" | sha256sum | cut -c1-10)
                  echo "##vso[task.setvariable variable=HASHED_RUN_ID]$HASHED_RUN_ID"
                displayName: Generate hashed run ID
              - template: .pipelines/templates/steps/blobfuse-setup.yml@self
                parameters:
                  resourceGroup: blobfusecpk-rg$(HASHED_RUN_ID)
                  storageAccount: blobfusecpk$(HASHED_RUN_ID)
              - template: .pipelines/templates/steps/blobfuse-data-integrity-cpk.yml@self
                parameters:
                  account_type: block
                  mount_dir_source: $(repoRoot)/blob_source
                  temp_dir_source: $(repoRoot)/temp_source
                  config_file_source: $(repoRoot)/config_source.yaml
                  mount_dir: $(repoRoot)/blob_cpk
                  temp_dir: $(repoRoot)/temp_cpk
                  config_file: $(repoRoot)/config_cpk.yaml
              - pwsh: az group delete --name "blobfusecpk-rg$(HASHED_RUN_ID)" --yes --no-wait
                displayName: Cleanup
                condition: succeeded()

          - job: blobfuse_perf
            displayName: Blobfuse perf
            timeoutInMinutes: 180
            pool:
              type: linux
              isCustom: true
              name: cleanroom-emu-ado
            variables:
              repoRoot: "$(Build.SourcesDirectory)"
              ob_outputDirectory: "$(Build.SourcesDirectory)/out"
            steps:
              - bash: sudo rm -rf /opt/hostedtoolcache
                displayName: Delete huge unnecessary tools folder
              - checkout: self
                submodules: recursive
              - template: .pipelines/templates/steps/login-to-azure.yml@self
              - bash: sudo rm -rf /opt/hostedtoolcache
                displayName: Free disk space
              # NOTE: the blobfuse-perf job body (perf benchmark steps beyond disk
              # cleanup) was not part of the captured composite set; port from
              # blobfuse_nightly.yml (line 125+) when available.
              - pwsh: 'Write-Host "blobfuse-perf benchmark steps: port from blobfuse_nightly.yml (line 125+)."'
                displayName: blobfuse-perf (port remaining steps)
