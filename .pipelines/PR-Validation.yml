################################################################################
# CleanRoom PR Validation (migrated from .github/workflows/pr_validation.yml).
# PR gate: lint -> detect_changes (runs scripts/resolve_pr_impacts.py to resolve
# impacted build/test stages, re-emitted as ADO output vars) -> fans out to the
# job templates, each gated by `condition: contains(dependencies.detect_changes
# .outputs['resolve.testStages'], '...')`. Extends OneBranch NonOfficial.
# test-cvm stays disabled (agents can't reach the CVM over public IP).
# See MIGRATION.md for detail.
################################################################################

# Mirrors the OSS `.github/workflows/pr_validation.yml` `on: pull_request`:
# runs on PRs targeting develop/main (no push/CI trigger, so PR branches don't
# double-run). ADO honours this `pr:` trigger for GitHub repos via the Azure
# Pipelines GitHub App connection.
trigger: none

pr:
  branches:
    include:
      - develop
      - main

name: pr-validation-$(Build.SourceBranchName)-$(Date:yyyyMMdd).$(Rev:r)

variables:
  - name: LinuxContainerImage
    value: "mcr.microsoft.com/onebranch/azurelinux/build:3.0"
  - name: CDP_DEFINITION_BUILD_COUNT
    value: $[counter('', 0)]
  # Hoisted to pipeline top-level so every job (container orchestrator jobs +
  # isCustom test jobs) inherits the var group + GITHUB_ACTIONS/JOB_ID/RUN_ID and
  # the OIDC service connection. isCustom jobs override repoRoot in their own
  # pure-map variables (bare-VM checkout lands at $(Build.SourcesDirectory)).
  - template: templates/variables/build-common.yml

resources:
  repositories:
    - repository: templates
      type: git
      name: OneBranch.Pipelines/GovernedTemplates
      ref: refs/heads/main

extends:
  template: v2/OneBranch.NonOfficial.CrossPlat.yml@templates
  parameters:
    cloudvault:
      enabled: false
    globalSdl:
      tsa:
        enabled: false
      policheck:
        break: true
    stages:
      - stage: Validate
        displayName: PR Validation
        jobs:
          # --- lint (always runs; first gate) ---------------------------------
          - job: lint
            displayName: Ruff format + lint
            timeoutInMinutes: 30
            # Runs on the isCustom bare-VM pool, NOT a OneBranch container: container
            # jobs enforce network isolation that blocks files.pythonhosted.org, so
            # `uv` cannot download ruff (tcp connect error). The bare-VM pool has open
            # egress (proven by other jobs installing uv/go). Docker-free otherwise.
            pool:
              type: linux
              isCustom: true
              name: cleanroom-emu-ado
            variables:
              repoRoot: "$(Build.SourcesDirectory)"
              ob_outputDirectory: "$(Build.SourcesDirectory)/out"
            steps:
              - checkout: self
              - bash: |
                  set -euo pipefail
                  # setup-uv@v7 -> install uv, then put it on PATH for this + later steps.
                  curl -LsSf https://astral.sh/uv/install.sh | sh
                  echo "##vso[task.prependpath]$HOME/.local/bin"
                  export PATH="$HOME/.local/bin:$PATH"
                  ./scripts/ruff-check.sh
                displayName: Install uv + run Ruff format and lint check
                workingDirectory: $(repoRoot)

          # --- detect-changes (resolver → ADO output vars) --------------------
          - job: detect_changes
            displayName: Resolve impacted CI stages
            dependsOn: lint
            timeoutInMinutes: 15
            pool:
              type: linux
            variables:
              repoRoot: "$(Build.SourcesDirectory)/azure-cleanroom"
              ob_outputDirectory: "$(Build.SourcesDirectory)/out"
              # Runtime expression -> resolves to '' on non-PR (push) builds instead
              # of leaving the literal macro $(System.PullRequest.TargetBranch),
              # which bash would try to execute as a command.
              targetBranch: $[ variables['System.PullRequest.TargetBranch'] ]
            steps:
              - checkout: self
                fetchDepth: 0 # resolver diffs base..head; needs full history
              - bash: |
                  set -euo pipefail
                  # Point the unchanged resolver at a temp GITHUB_OUTPUT file.
                  export GITHUB_OUTPUT="$(mktemp)"

                  # Determine the base ref to diff HEAD against. On a real PR build
                  # TARGET_BRANCH is the PR target; on a push build (this pilot uses a
                  # push trigger + branch policy instead of native PRs) it's empty, so
                  # fall back to the default branch (origin/develop), then HEAD~1.
                  BASE_REF=""
                  if [ -n "${TARGET_BRANCH:-}" ]; then
                    export CI_EVENT_NAME="pull_request"
                    BASE_REF="origin/${TARGET_BRANCH#refs/heads/}"
                  else
                    export CI_EVENT_NAME="push"
                    if git rev-parse --verify --quiet origin/develop >/dev/null 2>&1; then
                      BASE_REF="origin/develop"
                    fi
                  fi

                  if [ -n "$BASE_REF" ] && git rev-parse --verify --quiet "$BASE_REF" >/dev/null 2>&1; then
                    BASE_SHA="$(git merge-base "$BASE_REF" HEAD 2>/dev/null || git rev-parse "$BASE_REF")"
                  else
                    # Last resort: previous commit (or HEAD if the clone has one commit).
                    BASE_SHA="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"
                  fi
                  export BASE_SHA
                  export HEAD_SHA="$(git rev-parse HEAD)"
                  echo "Resolver base: BASE_SHA=$BASE_SHA HEAD_SHA=$HEAD_SHA (target='${TARGET_BRANCH:-}' reason='${BUILD_REASON:-}')"

                  python3 ./scripts/resolve_pr_impacts.py
                  buildGroups="$(grep '^build-groups=' "$GITHUB_OUTPUT" | cut -d= -f2-)"
                  testStages="$(grep '^test-stages=' "$GITHUB_OUTPUT" | cut -d= -f2-)"
                  echo "Resolved buildGroups=[$buildGroups] testStages=[$testStages]"
                  # Re-emit as ADO cross-job OUTPUT variables.
                  echo "##vso[task.setvariable variable=buildGroups;isOutput=true]$buildGroups"
                  echo "##vso[task.setvariable variable=testStages;isOutput=true]$testStages"
                name: resolve
                displayName: Resolve impacted CI stages
                workingDirectory: $(repoRoot)
                env:
                  TARGET_BRANCH: $(targetBranch)
                  BUILD_REASON: $(Build.Reason)

          # --- build (all groups; each build job self-gates on buildGroups) ---
          # pr_build_all.yml -> job template. Every build job takes
          # dependsOn: detect_changes (+ its real cross-job needs) and a runtime
          # condition on resolve.buildGroups, so the whole group fans out exactly
          # like the GitHub `build` reusable workflow did.
          - template: .pipelines/templates/pr-build-all-jobs.yml@self
            parameters:
              detectChangesJob: detect_changes

          # --- build gate (ADO equivalent of GitHub `needs: [build]`) ----------
          # GitHub's test-ccf/cluster/collab/workloads had `needs: [build]`, i.e.
          # they waited for the whole build reusable-workflow to finish (so the
          # container images + CLI whl are pushed to $(ACR_URL) tagged
          # $(Build.BuildId) BEFORE any test pulls them). ADO has no stage-level
          # `needs`, so this single gate job depends on every pr-build-all job;
          # the build-consuming test templates then depend on this gate. It runs
          # once no build job is failed/canceled (skipped build groups are fine),
          # so a build failure skips the gate -> skips the dependent tests.
          - job: build_gate
            displayName: Build stage complete (gate for tests)
            dependsOn:
              - detect_changes
              - build_ccr_governance_containers
              - build_ccr_proxy_containers
              - build_ccr_skr_containers
              - build_ccr_tools_containers
              - build_cvm_containers
              - build_k8s_node_containers
              - build_ccf_containers
              - build_cgs_containers
              - build_ccr_containers
              - build_ccf_container_policies
              - build_ccr_container_policies
              - build_cleanroom_cluster_containers
              - build_cleanroom_operator_containers
              - build_analytics_workload_containers
              - build_analytics_workload_container_policies
              - build_kserve_inferencing_workload_containers
              - build_kserve_inferencing_workload_container_policies
              - build_frontend_service_containers
              - build_frontend_service_container_policies
              - build_azcliext_cleanroom
              - generate_dev_up_env
              # Post-#866 the CCF network-up in the test stages resolves images
              # from the release-metadata OCI catalog published by this job; gate
              # the tests on it so no CCF/collab/workload job races the publish.
              - publish_release_metadata_catalog
            # Run unless a build job actually failed/cancelled (skipped groups OK).
            condition: not(or(failed(), canceled()))
            pool:
              type: linux
            variables:
              ob_outputDirectory: "$(Build.SourcesDirectory)/out"
            steps:
              - bash: echo "All pr-build-all jobs completed (or were skipped); images + CLI whl are pushed. Tests may proceed."
                displayName: Build stage complete

          # --- test-cgs (gated on resolver output; no build dependency) --------
          - template: .pipelines/templates/pr-cgs-tests-jobs.yml@self
            parameters:
              dependsOn: [detect_changes]
              condition: "and(succeeded(), contains(dependencies.detect_changes.outputs['resolve.testStages'], 'test-cgs'))"

          # --- test-ccf (needs build) -----------------------------------------
          - template: .pipelines/templates/pr-ccf-jobs.yml@self
            parameters:
              dependsOn: [detect_changes, build_gate]
              condition: "and(succeeded(), contains(dependencies.detect_changes.outputs['resolve.testStages'], 'test-ccf'))"

          # --- test-cleanroom-cluster (needs build) ---------------------------
          - template: .pipelines/templates/pr-cleanroom-cluster-jobs.yml@self
            parameters:
              dependsOn: [detect_changes, build_gate]
              condition: "and(succeeded(), contains(dependencies.detect_changes.outputs['resolve.testStages'], 'test-cleanroom-cluster'))"

          # --- test-multi-party-collab (needs build) --------------------------
          - template: .pipelines/templates/pr-multi-party-collab-jobs.yml@self
            parameters:
              dependsOn: [detect_changes, build_gate]
              condition: "and(succeeded(), contains(dependencies.detect_changes.outputs['resolve.testStages'], 'test-multi-party-collab'))"

          # --- test-workloads (needs build) -----------------------------------
          - template: .pipelines/templates/pr-workload-samples-jobs.yml@self
            parameters:
              dependsOn: [detect_changes, build_gate]
              condition: "and(succeeded(), contains(dependencies.detect_changes.outputs['resolve.testStages'], 'test-workloads'))"

          # --- test-flex-node -------------------------------------------------
          - template: .pipelines/templates/pr-flex-node-jobs.yml@self
            parameters:
              dependsOn: [detect_changes]
              condition: "and(succeeded(), contains(dependencies.detect_changes.outputs['resolve.testStages'], 'test-flex-node'))"

          # test-cvm stays DISABLED (matches pr_validation.yml): GitHub/1ES agents
          # can't reach the CVM over public IP. Enable once a same-VNet pool exists.

          # --- ci-gate (single required status check) -------------------------
          # Always runs; aggregates results so branch protection has one stable
          # required check even when the resolver skips stages (skipped jobs are
          # "Succeeded (skipped)", which does not fail the gate).
          #
          # NOTE: unlike GitHub (where skipped reusable-workflow jobs produced no
          # child check), an ADO pipeline's overall run status already reflects
          # every job, so a build/test failure fails the run regardless. This gate
          # remains the single named required check.
          # NOTE: the gate depends on lint/detect_changes/cgs_test as anchor
          # points; the overall ADO run status already reflects every build/test
          # job, so a failure anywhere fails the run regardless of this list.
          - job: ci_gate
            displayName: CI gate
            condition: always()
            dependsOn:
              - lint
              - detect_changes
              - cgs_test
            pool:
              type: linux
            variables:
              ob_outputDirectory: "$(Build.SourcesDirectory)/out"
              lintResult: $[ dependencies.lint.result ]
              detectResult: $[ dependencies.detect_changes.result ]
              cgsResult: $[ dependencies.cgs_test.result ]
            steps:
              # No `checkout: none` — OneBranch container jobs auto-inject a
              # checkout and reject an explicit `checkout: none` alongside it.
              - bash: |
                  set -uo pipefail
                  failed=0
                  declare -A results=(
                    [lint]="$(lintResult)"
                    [detect_changes]="$(detectResult)"
                    [cgs_test]="$(cgsResult)"
                  )
                  for job in "${!results[@]}"; do
                    echo "$job: ${results[$job]}"
                    if [[ "${results[$job]}" == "Failed" || "${results[$job]}" == "Canceled" ]]; then
                      failed=1
                    fi
                  done
                  if [[ "$failed" -eq 1 ]]; then
                    echo "##vso[task.logissue type=error]CI gate failed: one or more jobs failed or were cancelled"
                    exit 1
                  fi
                  echo "CI gate passed: all jobs succeeded or were skipped"
                displayName: Check job results
