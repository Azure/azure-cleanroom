################################################################################
# No-build Verification Nightly — scheduled (migrated from
# .github/workflows/release_verification_nightly.yml, cron "0 2 * * *").
# "No-build" = does NOT build/release; verifies the PUBLISHED release by pulling
# the CLI + images from MCR (mcr.microsoft.com/azurecleanroom) at a fixed
# MCR_RELEASE_VERSION, then runs the BVT scenarios (same test composites as
# release-and-test BVTs but repo=MCR). BUMP MCR_RELEASE_VERSION per release.
# See MIGRATION.md for detail.
################################################################################
################################################################################

schedules:
  - cron: "0 2 * * *"
    displayName: Nightly no-build release verification (02:00 UTC)
    branches:
      include:
        - develop
    always: true

trigger: none
pr: none

name: release-verification-nightly-$(Date:yyyyMMdd).$(Rev:r)

parameters:
  - name: mcrReleaseVersion
    type: string
    # Matches origin/main's release pin (8.0.0, released 2026-06-21). The prior
    # value 7.0.0 (2026-04-27) predates the blobfuse --subdirectory feature (#729,
    # merged 2026-05-13, shipped in 8.0.0), so the released CLI lacked flags the
    # HEAD test scripts use -> encrypted-storage/setup-env failed with
    # "unrecognized arguments: --subdirectory". develop still carries the stale
    # 7.0.0 pin; main is on 8.0.0. Bump for each release (was env MCR_RELEASE_VERSION).
    default: "8.0.0"

variables:
  # Shared build vars (var group cleanroom-pr-vars + azureServiceConnection + RUN_*)
  # at PIPELINE scope so each custom (isCustom bare-VM) job's own `variables:` can
  # stay a pure MAP — OneBranch's Linux.Custom.Job.yml reads ob_outputDirectory from
  # the job's variables at compile time, and a `- template:` include there makes it
  # non-static (trips the custom-job drop-artifact guard). File-relative path (this
  # include is pre-`extends`), no @self.
  - template: templates/variables/build-common.yml
  - name: LinuxContainerImage
    value: "mcr.microsoft.com/onebranch/azurelinux/build:3.0"
  - name: CDP_DEFINITION_BUILD_COUNT
    value: $[counter('', 0)]
  - name: MCR_REPO
    value: "mcr.microsoft.com/azurecleanroom"

resources:
  repositories:
    - repository: templates
      type: git
      name: OneBranch.Pipelines/GovernedTemplates
      ref: refs/heads/main

extends:
  template: v2/OneBranch.NonOfficial.CrossPlat.yml@templates
  parameters:
    cloudvault:
      enabled: false
    globalSdl:
      tsa:
        enabled: false
      policheck:
        break: true
    stages:
      - stage: Verify
        displayName: No-build Verification Nightly
        jobs:
          - job: ml_training_nightly
            displayName: ml-training (nightly)
            timeoutInMinutes: 180
            pool:
              type: linux
              isCustom: true
              name: cleanroom-emu-ado
            strategy:
              matrix:
                akvpremium: { key-store: akvpremium }
            variables:
              # Pure MAP so ob_outputDirectory is compile-time static (OneBranch
              # custom-job drop naming). Shared vars come from the pipeline-level
              # build-common include; bare-VM checkout lands at $(Build.SourcesDirectory).
              repoRoot: "$(Build.SourcesDirectory)"
              ob_outputDirectory: "$(Build.SourcesDirectory)/out"
            steps:
              - checkout: self
                submodules: recursive
                fetchTags: true
              - template: .pipelines/templates/steps/setup-docker-on-data-disk.yml@self
              - bash: |
                  az version
                  openssl version
                displayName: Check prerequisites
              - template: .pipelines/templates/steps/login-to-azure.yml@self
              - bash: |
                  set -euo pipefail
                  oras pull $(MCR_REPO)/cli/cleanroom-whl:${{ parameters.mcrReleaseVersion }}
                  az extension add --source ./cleanroom-*-py2.py3-none-any.whl -y --allow-preview true
                displayName: Install az cleanroom CLI (from MCR)
                workingDirectory: $(repoRoot)
              - pwsh: |
                  $env:TDP_HSM_RESOURCE_GROUP='azcleanroom-emu-bvt-rg'
                  $env:TDP_MHSM_NAME='azcleanroomemubvthsm'
                  $env:TDC_HSM_RESOURCE_GROUP='azcleanroom-emu-bvt-rg'
                  $env:TDC_MHSM_NAME='azcleanroomemubvthsm'
                  ./test/onebox/multi-party-collab/ml-training/run-collab-aci.ps1 -NoBuild -registry mcr -repo $(MCR_REPO) -tag ${{ parameters.mcrReleaseVersion }} -kvType "$(key-store)"
                displayName: Run ml-training collab scenario on CACI
                workingDirectory: $(repoRoot)
              - pwsh: docker compose -p ob-ml-training-ccf-provider logs
                displayName: Dump ccf-provider logs
                condition: not(canceled())
                workingDirectory: $(repoRoot)
              - pwsh: docker logs ob-isv-client-cgs-client-1
                displayName: Dump ob-isv-client logs
                condition: not(canceled())
                workingDirectory: $(repoRoot)
              - bash: |
                  mkdir -p "$(ob_outputDirectory)/generated-ml-training-nightly-$(key-store)"
                  cp -r "$(repoRoot)/test/onebox/multi-party-collab/ml-training/generated/." "$(ob_outputDirectory)/generated-ml-training-nightly-$(key-store)/" || true
                displayName: Collect generated (into drop)
                condition: not(canceled())
              - pwsh: ./test/onebox/multi-party-collab/remove-resources.ps1 -tag "github_actions=$(key-store)-$(Agent.JobName)-$(Build.BuildId)"
                displayName: Delete resource groups
                condition: succeeded()
                workingDirectory: $(repoRoot)

          - job: encrypted_storage_nightly
            displayName: encrypted-storage (nightly)
            timeoutInMinutes: 180
            pool:
              type: linux
              isCustom: true
              name: cleanroom-emu-ado
            variables:
              repoRoot: "$(Build.SourcesDirectory)"
              ob_outputDirectory: "$(Build.SourcesDirectory)/out"
            steps:
              - checkout: self
                submodules: recursive
                fetchTags: true
              - template: .pipelines/templates/steps/setup-docker-on-data-disk.yml@self
              - template: .pipelines/templates/steps/login-to-azure.yml@self
              - bash: |
                  set -euo pipefail
                  oras pull $(MCR_REPO)/cli/cleanroom-whl:${{ parameters.mcrReleaseVersion }}
                  az extension add --source ./cleanroom-*-py2.py3-none-any.whl -y --allow-preview true
                displayName: Install az cleanroom CLI (from MCR)
                workingDirectory: $(repoRoot)
              - pwsh: ./test/onebox/multi-party-collab/encrypted-storage/run-collab-aci.ps1 -NoBuild -registry mcr -repo $(MCR_REPO) -tag ${{ parameters.mcrReleaseVersion }}
                displayName: Run encrypted-storage collab scenario on CACI
                workingDirectory: $(repoRoot)
              - pwsh: docker compose -p ob-encrypted-storage-ccf-provider logs
                displayName: Dump ccf-provider logs
                condition: not(canceled())
                workingDirectory: $(repoRoot)
              - pwsh: docker logs ob-consumer-client-cgs-client-1
                displayName: Dump ob-consumer-client logs
                condition: not(canceled())
                workingDirectory: $(repoRoot)
              - pwsh: docker logs ob-publisher-client-cgs-client-1
                displayName: Dump ob-publisher-client logs
                condition: not(canceled())
                workingDirectory: $(repoRoot)
              - bash: |
                  mkdir -p "$(ob_outputDirectory)/generated-encrypted-storage-nightly"
                  cp -r "$(repoRoot)/test/onebox/multi-party-collab/encrypted-storage/generated/." "$(ob_outputDirectory)/generated-encrypted-storage-nightly/" || true
                displayName: Collect generated (into drop)
                condition: not(canceled())
              - pwsh: ./test/onebox/multi-party-collab/remove-resources.ps1 -tag "github_actions=$(Agent.JobName)-$(Build.BuildId)"
                displayName: Delete resource groups
                condition: succeeded()
                workingDirectory: $(repoRoot)

          - job: nginx_hello_nightly
            displayName: nginx-hello (nightly)
            timeoutInMinutes: 180
            pool:
              type: linux
              isCustom: true
              name: cleanroom-emu-ado
            variables:
              repoRoot: "$(Build.SourcesDirectory)"
              ob_outputDirectory: "$(Build.SourcesDirectory)/out"
            steps:
              - checkout: self
                submodules: recursive
                fetchTags: true
              - template: .pipelines/templates/steps/setup-docker-on-data-disk.yml@self
              - template: .pipelines/templates/steps/login-to-azure.yml@self
              - bash: |
                  set -euo pipefail
                  oras pull $(MCR_REPO)/cli/cleanroom-whl:${{ parameters.mcrReleaseVersion }}
                  az extension add --source ./cleanroom-*-py2.py3-none-any.whl -y --allow-preview true
                displayName: Install az cleanroom CLI (from MCR)
                workingDirectory: $(repoRoot)
              - pwsh: ./test/onebox/multi-party-collab/nginx-hello/run-collab-aci.ps1 -NoBuild -registry mcr -repo $(MCR_REPO) -tag ${{ parameters.mcrReleaseVersion }}
                displayName: Run nginx-hello collab scenario on CACI
                workingDirectory: $(repoRoot)
              - pwsh: docker compose -p ob-nginx-hello-ccf-provider logs
                displayName: Dump ccf-provider logs
                condition: not(canceled())
                workingDirectory: $(repoRoot)
              - pwsh: docker logs ob-nginx-client-cgs-client-1
                displayName: Dump ob-nginx-client logs
                condition: not(canceled())
                workingDirectory: $(repoRoot)
              - pwsh: docker logs ccr-client-proxy
                displayName: Dump ccr-client-proxy logs
                condition: not(canceled())
                workingDirectory: $(repoRoot)
              - bash: |
                  mkdir -p "$(ob_outputDirectory)/generated-nginx-hello-nightly"
                  cp -r "$(repoRoot)/test/onebox/multi-party-collab/nginx-hello/generated/configurations/." "$(ob_outputDirectory)/generated-nginx-hello-nightly/" || true
                displayName: Collect generated (into drop)
                condition: not(canceled())
              - pwsh: ./test/onebox/multi-party-collab/remove-resources.ps1 -tag "github_actions=$(Agent.JobName)-$(Build.BuildId)"
                displayName: Delete resource groups
                condition: succeeded()
                workingDirectory: $(repoRoot)

          - job: pick_location
            displayName: Pick location
            pool:
              type: linux
              isCustom: true
              name: cleanroom-emu-ado
            variables:
              ob_outputDirectory: "$(Build.SourcesDirectory)/out"
            steps:
              - checkout: none
              - template: .pipelines/templates/steps/pick-location.yml@self

          - job: setup_env_aks_nightly
            displayName: setup-env (AKS, nightly)
            timeoutInMinutes: 180
            dependsOn: pick_location
            condition: succeeded()
            pool:
              type: linux
              isCustom: true
              name: cleanroom-emu-ado
            variables:
              repoRoot: "$(Build.SourcesDirectory)"
              ob_outputDirectory: "$(Build.SourcesDirectory)/out"
              location: $[ dependencies.pick_location.outputs['pickLocation.location'] ]
            steps:
              - checkout: self
                submodules: recursive
                fetchTags: true
              - template: .pipelines/templates/steps/setup-docker-on-data-disk.yml@self
              - bash: |
                  set -euo pipefail
                  oras pull $(MCR_REPO)/cli/cleanroom-whl:${{ parameters.mcrReleaseVersion }}
                  az extension add --source ./cleanroom-*-py2.py3-none-any.whl -y --allow-preview true
                displayName: Install az cleanroom CLI (from MCR)
                workingDirectory: $(repoRoot)
              - template: .pipelines/templates/steps/login-to-azure.yml@self
              - template: .pipelines/templates/steps/workload-setup-env.yml@self
                parameters:
                  infraType: aks
                  location: $(location)
                  outDir: $(repoRoot)/test/onebox/workload-samples-aks/generated
                  registry: mcr
                  repo: $(MCR_REPO)
                  tag: ${{ parameters.mcrReleaseVersion }}
              # Custom (isCustom bare-VM) jobs do NOT auto-publish $(ob_outputDirectory)
              # (only container jobs like sdl_sources do), so the drop must be published
              # EXPLICITLY. The custom-job guard requires the artifact name to equal
              # ob_customArtifactName = drop_<stage>_<job> = drop_Verify_setup_env_aks_nightly,
              # which is exactly what the big-data job downloads.
              - bash: |
                  mkdir -p "$(ob_outputDirectory)/aks-deployment"
                  cp -r "$(repoRoot)/test/onebox/workload-samples-aks/generated/." "$(ob_outputDirectory)/aks-deployment/" || true
                displayName: Stage deployment artifacts into drop
                condition: succeeded()
              - task: PublishPipelineArtifact@1
                displayName: Publish deployment drop
                condition: succeeded()
                inputs:
                  targetPath: $(ob_outputDirectory)
                  artifact: drop_Verify_setup_env_aks_nightly

          - job: big_data_query_analytics_nightly
            displayName: big-data-query-analytics (AKS, nightly)
            # 240 (was 180): with MAX_PARALLEL_SQL_JOBS=3 the 8 Spark queries run
            # reliably but the total batch on capacity-constrained AKS can exceed
            # 180 min wall-clock (build 175513013 was CANCELED at the 180-min job
            # cap with queries still RUNNING, not failing). 240 gives the batch
            # room to finish.
            timeoutInMinutes: 240
            dependsOn:
              - setup_env_aks_nightly
              - pick_location
            condition: succeeded()
            pool:
              type: linux
              isCustom: true
              name: cleanroom-emu-ado
            variables:
              repoRoot: "$(Build.SourcesDirectory)"
              ob_outputDirectory: "$(Build.SourcesDirectory)/out"
              location: $[ dependencies.pick_location.outputs['pickLocation.location'] ]
            steps:
              - checkout: self
                submodules: recursive
                fetchTags: true
              - template: .pipelines/templates/steps/setup-docker-on-data-disk.yml@self
              - task: DownloadPipelineArtifact@2
                displayName: Download deployment artifacts (from setup-env drop)
                inputs:
                  artifact: drop_Verify_setup_env_aks_nightly
                  path: $(Build.SourcesDirectory)/_setupenv_drop
              - bash: |
                  mkdir -p "$(repoRoot)/test/onebox/workload-samples-aks/generated"
                  cp -r "$(Build.SourcesDirectory)/_setupenv_drop/aks-deployment/." "$(repoRoot)/test/onebox/workload-samples-aks/generated/" || true
                displayName: Restore deployment artifacts from drop
              - template: .pipelines/templates/steps/login-to-azure.yml@self
              - template: .pipelines/templates/steps/workload-test-big-data-analytics.yml@self
                parameters:
                  location: $(location)
                  deploymentConfigDir: $(repoRoot)/test/onebox/workload-samples-aks/generated
                  repo: $(MCR_REPO)
                  tag: ${{ parameters.mcrReleaseVersion }}
              - bash: |
                  mkdir -p "$(ob_outputDirectory)/big-data-analytics-results-aks-nightly"
                  cp -r "$(repoRoot)/test/onebox/workload-samples-aks/generated/." "$(ob_outputDirectory)/big-data-analytics-results-aks-nightly/" || true
                displayName: Collect test results (into drop)
                condition: not(canceled())
              - pwsh: |
                  ./test/onebox/multi-party-collab/big-data-query-analytics/delete-bucket.ps1 -bucketName "consumer-input-$(Agent.JobName)-$(Build.BuildId)"
                  ./test/onebox/multi-party-collab/big-data-query-analytics/delete-bucket.ps1 -bucketName "consumer-output-$(Agent.JobName)-$(Build.BuildId)"
                displayName: Delete AWS buckets
                condition: succeeded()
                workingDirectory: $(repoRoot)
              - pwsh: ./test/onebox/multi-party-collab/remove-resources.ps1 -tag "github_actions=$(Agent.JobName)-$(Build.BuildId)"
                displayName: Delete resource groups
                condition: succeeded()
                workingDirectory: $(repoRoot)

          - job: cleanup_aks_nightly
            displayName: cleanup (AKS, nightly)
            timeoutInMinutes: 60
            dependsOn: big_data_query_analytics_nightly
            condition: succeeded()
            pool:
              type: linux
              isCustom: true
              name: cleanroom-emu-ado
            variables:
              repoRoot: "$(Build.SourcesDirectory)"
              ob_outputDirectory: "$(Build.SourcesDirectory)/out"
            steps:
              - checkout: self
                submodules: recursive
                fetchTags: true
              - template: .pipelines/templates/steps/setup-docker-on-data-disk.yml@self
              - template: .pipelines/templates/steps/login-to-azure.yml@self
              - pwsh: ./test/onebox/multi-party-collab/remove-resources.ps1 -tag "github_actions=setup-env-aks-nightly-$(Build.BuildId)"
                displayName: Delete resource groups
                workingDirectory: $(repoRoot)
