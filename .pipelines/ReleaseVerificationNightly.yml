################################################################################
#          No-build Verification Nightly (Azure Pipelines) — scheduled         #
#                                                                              #
# Migrated from .github/workflows/release_verification_nightly.yml              #
# (workflow_dispatch + workflow_call + schedule cron "0 2 * * *").             #
#                                                                              #
# "No-build" = does NOT build or release; verifies the PUBLISHED release by     #
# pulling the CLI + images from MCR (mcr.microsoft.com/azurecleanroom) at a     #
# fixed MCR_RELEASE_VERSION, then runs the BVT scenarios.                       #
#                                                                              #
# 7 jobs: ml-training (matrix key-store akvpremium), encrypted-storage,        #
# nginx-hello, pick-location, setup-env-aks, big-data-query-analytics-aks,     #
# cleanup-aks. Same test composites as release-and-test BVTs but repo=MCR.      #
#                                                                              #
# The test composites (ml-training/encrypted-storage/nginx-hello CACI + setup-env #
# + big-data-analytics) are ported via the shared workload/collab step templates #
# with repo=MCR. Structure, matrix, MCR CLI install, DAG and cleanup are faithful.#
#                                                                              #
# TODO(Phase 1C): azureServiceConnection + 1ES pools + cleanroom-pr-vars group. #
# BUMP MCR_RELEASE_VERSION per release (was an env var in GitHub).              #
################################################################################

schedules:
  - cron: "0 2 * * *"
    displayName: Nightly no-build release verification (02:00 UTC)
    branches:
      include:
        - develop
    always: true

trigger: none
pr: none

name: release-verification-nightly-$(Date:yyyyMMdd).$(Rev:r)

parameters:
  - name: mcrReleaseVersion
    type: string
    default: "7.0.0" # Bump for each release (was env MCR_RELEASE_VERSION).

variables:
  - name: LinuxContainerImage
    value: "mcr.microsoft.com/onebranch/azurelinux/build:3.0"
  - name: CDP_DEFINITION_BUILD_COUNT
    value: $[counter('', 0)]
  - name: MCR_REPO
    value: "mcr.microsoft.com/azurecleanroom"

resources:
  repositories:
    - repository: templates
      type: git
      name: OneBranch.Pipelines/GovernedTemplates
      ref: refs/heads/main

extends:
  template: v2/OneBranch.NonOfficial.CrossPlat.yml@templates
  parameters:
    cloudvault:
      enabled: false
    globalSdl:
      tsa:
        enabled: false
      policheck:
        break: true
    stages:
      - stage: Verify
        displayName: No-build Verification Nightly
        jobs:
          - job: ml_training_nightly
            displayName: ml-training (nightly)
            timeoutInMinutes: 180
            pool:
              type: linux # TODO(Phase 1C): 1ES pool with Docker daemon
            strategy:
              matrix:
                akvpremium: { key-store: akvpremium }
            variables:
              - template: templates/variables/build-common.yml
            steps:
              - checkout: self
                submodules: recursive
                fetchTags: true
              - template: templates/steps/setup-docker-on-data-disk.yml
              - bash: |
                  az version
                  openssl version
                displayName: Check prerequisites
              - bash: |
                  set -euo pipefail
                  oras pull $(MCR_REPO)/cli/cleanroom-whl:${{ parameters.mcrReleaseVersion }}
                  az extension add --source ./cleanroom-*-py2.py3-none-any.whl -y --allow-preview true
                displayName: Install az cleanroom CLI (from MCR)
                workingDirectory: $(repoRoot)
              - pwsh: |
                  $env:TDP_HSM_RESOURCE_GROUP='azcleanroom-emu-bvt-rg'
                  $env:TDP_MHSM_NAME='azcleanroomemubvthsm'
                  $env:TDC_HSM_RESOURCE_GROUP='azcleanroom-emu-bvt-rg'
                  $env:TDC_MHSM_NAME='azcleanroomemubvthsm'
                  ./test/onebox/multi-party-collab/ml-training/run-collab-aci.ps1 -NoBuild -registry mcr -repo $(MCR_REPO) -tag ${{ parameters.mcrReleaseVersion }} -kvType "$(key-store)"
                displayName: Run ml-training collab scenario on CACI
                workingDirectory: $(repoRoot)
              - pwsh: docker compose -p ob-ml-training-ccf-provider logs
                displayName: Dump ccf-provider logs
                condition: not(canceled())
                workingDirectory: $(repoRoot)
              - pwsh: docker logs ob-isv-client-cgs-client-1
                displayName: Dump ob-isv-client logs
                condition: not(canceled())
                workingDirectory: $(repoRoot)
              - task: PublishPipelineArtifact@1
                displayName: Upload generated
                condition: not(canceled())
                inputs:
                  targetPath: $(repoRoot)/test/onebox/multi-party-collab/ml-training/generated
                  artifact: generated-ml-training-nightly-$(key-store)
              - pwsh: ./test/onebox/multi-party-collab/remove-resources.ps1 -tag "github_actions=$(key-store)-$(Agent.JobName)-$(Build.BuildId)"
                displayName: Delete resource groups
                condition: succeeded()
                workingDirectory: $(repoRoot)

          - job: encrypted_storage_nightly
            displayName: encrypted-storage (nightly)
            timeoutInMinutes: 180
            pool:
              type: linux
            variables:
              - template: templates/variables/build-common.yml
            steps:
              - checkout: self
                submodules: recursive
                fetchTags: true
              - template: templates/steps/setup-docker-on-data-disk.yml
              - bash: |
                  set -euo pipefail
                  oras pull $(MCR_REPO)/cli/cleanroom-whl:${{ parameters.mcrReleaseVersion }}
                  az extension add --source ./cleanroom-*-py2.py3-none-any.whl -y --allow-preview true
                displayName: Install az cleanroom CLI (from MCR)
                workingDirectory: $(repoRoot)
              - pwsh: ./test/onebox/multi-party-collab/encrypted-storage/run-collab-aci.ps1 -NoBuild -registry mcr -repo $(MCR_REPO) -tag ${{ parameters.mcrReleaseVersion }}
                displayName: Run encrypted-storage collab scenario on CACI
                workingDirectory: $(repoRoot)
              - pwsh: docker compose -p ob-encrypted-storage-ccf-provider logs
                displayName: Dump ccf-provider logs
                condition: not(canceled())
                workingDirectory: $(repoRoot)
              - pwsh: docker logs ob-consumer-client-cgs-client-1
                displayName: Dump ob-consumer-client logs
                condition: not(canceled())
                workingDirectory: $(repoRoot)
              - pwsh: docker logs ob-publisher-client-cgs-client-1
                displayName: Dump ob-publisher-client logs
                condition: not(canceled())
                workingDirectory: $(repoRoot)
              - task: PublishPipelineArtifact@1
                displayName: Upload generated
                condition: not(canceled())
                inputs:
                  targetPath: $(repoRoot)/test/onebox/multi-party-collab/encrypted-storage/generated
                  artifact: generated-encrypted-storage-nightly
              - pwsh: ./test/onebox/multi-party-collab/remove-resources.ps1 -tag "github_actions=$(Agent.JobName)-$(Build.BuildId)"
                displayName: Delete resource groups
                condition: succeeded()
                workingDirectory: $(repoRoot)

          - job: nginx_hello_nightly
            displayName: nginx-hello (nightly)
            timeoutInMinutes: 180
            pool:
              type: linux
            variables:
              - template: templates/variables/build-common.yml
            steps:
              - checkout: self
                submodules: recursive
                fetchTags: true
              - template: templates/steps/setup-docker-on-data-disk.yml
              - bash: |
                  set -euo pipefail
                  oras pull $(MCR_REPO)/cli/cleanroom-whl:${{ parameters.mcrReleaseVersion }}
                  az extension add --source ./cleanroom-*-py2.py3-none-any.whl -y --allow-preview true
                displayName: Install az cleanroom CLI (from MCR)
                workingDirectory: $(repoRoot)
              - pwsh: ./test/onebox/multi-party-collab/nginx-hello/run-collab-aci.ps1 -NoBuild -registry mcr -repo $(MCR_REPO) -tag ${{ parameters.mcrReleaseVersion }}
                displayName: Run nginx-hello collab scenario on CACI
                workingDirectory: $(repoRoot)
              - pwsh: docker compose -p ob-nginx-hello-ccf-provider logs
                displayName: Dump ccf-provider logs
                condition: not(canceled())
                workingDirectory: $(repoRoot)
              - pwsh: docker logs ob-nginx-client-cgs-client-1
                displayName: Dump ob-nginx-client logs
                condition: not(canceled())
                workingDirectory: $(repoRoot)
              - pwsh: docker logs ccr-client-proxy
                displayName: Dump ccr-client-proxy logs
                condition: not(canceled())
                workingDirectory: $(repoRoot)
              - task: PublishPipelineArtifact@1
                displayName: Upload generated
                condition: not(canceled())
                inputs:
                  targetPath: $(repoRoot)/test/onebox/multi-party-collab/nginx-hello/generated/configurations
                  artifact: generated-nginx-hello-nightly
              - pwsh: ./test/onebox/multi-party-collab/remove-resources.ps1 -tag "github_actions=$(Agent.JobName)-$(Build.BuildId)"
                displayName: Delete resource groups
                condition: succeeded()
                workingDirectory: $(repoRoot)

          - job: pick_location
            displayName: Pick location
            pool:
              type: linux
            steps:
              - checkout: none
              - template: templates/steps/pick-location.yml

          - job: setup_env_aks_nightly
            displayName: setup-env (AKS, nightly)
            timeoutInMinutes: 180
            dependsOn: pick_location
            condition: succeeded()
            pool:
              type: linux
            variables:
              - template: templates/variables/build-common.yml
              - name: location
                value: $[ dependencies.pick_location.outputs['pickLocation.location'] ]
            steps:
              - checkout: self
                submodules: recursive
                fetchTags: true
              - template: templates/steps/setup-docker-on-data-disk.yml
              - bash: |
                  set -euo pipefail
                  oras pull $(MCR_REPO)/cli/cleanroom-whl:${{ parameters.mcrReleaseVersion }}
                  az extension add --source ./cleanroom-*-py2.py3-none-any.whl -y --allow-preview true
                displayName: Install az cleanroom CLI (from MCR)
                workingDirectory: $(repoRoot)
              - template: templates/steps/login-to-azure.yml
              - template: templates/steps/workload-setup-env.yml
                parameters:
                  infraType: aks
                  location: $(location)
                  outDir: $(repoRoot)/test/onebox/workload-samples-aks/generated
                  registry: mcr
                  repo: $(MCR_REPO)
                  tag: ${{ parameters.mcrReleaseVersion }}
              - task: PublishPipelineArtifact@1
                displayName: Upload deployment artifacts
                condition: succeeded()
                inputs:
                  targetPath: $(repoRoot)/test/onebox/workload-samples-aks/generated
                  artifact: cleanroom-deployment-artifacts-aks-nightly

          - job: big_data_query_analytics_nightly
            displayName: big-data-query-analytics (AKS, nightly)
            timeoutInMinutes: 180
            dependsOn:
              - setup_env_aks_nightly
              - pick_location
            condition: succeeded()
            pool:
              type: linux
            variables:
              - template: templates/variables/build-common.yml
              - name: location
                value: $[ dependencies.pick_location.outputs['pickLocation.location'] ]
            steps:
              - checkout: self
                submodules: recursive
                fetchTags: true
              - template: templates/steps/setup-docker-on-data-disk.yml
              - task: DownloadPipelineArtifact@2
                displayName: Download deployment artifacts
                inputs:
                  artifact: cleanroom-deployment-artifacts-aks-nightly
                  path: $(repoRoot)/test/onebox/workload-samples-aks/generated
              - template: templates/steps/login-to-azure.yml
              - template: templates/steps/workload-test-big-data-analytics.yml
                parameters:
                  location: $(location)
                  deploymentConfigDir: $(repoRoot)/test/onebox/workload-samples-aks/generated
                  repo: $(MCR_REPO)
                  tag: ${{ parameters.mcrReleaseVersion }}
              - task: PublishPipelineArtifact@1
                displayName: Upload test results
                condition: not(canceled())
                inputs:
                  targetPath: $(repoRoot)/test/onebox/workload-samples-aks/generated
                  artifact: big-data-analytics-results-aks-nightly
              - pwsh: |
                  ./test/onebox/multi-party-collab/big-data-query-analytics/delete-bucket.ps1 -bucketName "consumer-input-$(Agent.JobName)-$(Build.BuildId)"
                  ./test/onebox/multi-party-collab/big-data-query-analytics/delete-bucket.ps1 -bucketName "consumer-output-$(Agent.JobName)-$(Build.BuildId)"
                displayName: Delete AWS buckets
                condition: succeeded()
                workingDirectory: $(repoRoot)
              - pwsh: ./test/onebox/multi-party-collab/remove-resources.ps1 -tag "github_actions=$(Agent.JobName)-$(Build.BuildId)"
                displayName: Delete resource groups
                condition: succeeded()
                workingDirectory: $(repoRoot)

          - job: cleanup_aks_nightly
            displayName: cleanup (AKS, nightly)
            timeoutInMinutes: 60
            dependsOn: big_data_query_analytics_nightly
            condition: succeeded()
            pool:
              type: linux
            variables:
              - template: templates/variables/build-common.yml
            steps:
              - checkout: self
                submodules: recursive
                fetchTags: true
              - template: templates/steps/setup-docker-on-data-disk.yml
              - template: templates/steps/login-to-azure.yml
              - pwsh: ./test/onebox/multi-party-collab/remove-resources.ps1 -tag "github_actions=setup-env-aks-nightly-$(Build.BuildId)"
                displayName: Delete resource groups
                workingDirectory: $(repoRoot)
