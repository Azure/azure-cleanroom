################################################################################
# TPC-DS Analytics Stresstest — scheduled (mirrors
# .github/workflows/tpcds-stresstest.yml). Weekly stress matrix: one run per day
# (7 slots). Crons fire in UTC and map to an IST slot at 04:00 IST (= 22:30 UTC
# the previous day). The "Resolve run parameters" step keys off the IST weekday
# and derives SKU / nodeCount / vn2 / SF / parallel per slot. GitHub and ADO run
# the same matrix independently (GitHub at 00:30 IST, ADO at 04:00 IST).
# No pr/push trigger. Structure: build (pr-build-all-jobs, full build via
# seed_build_groups=all) -> tpcds_stresstest, reusing persistent publisher/consumer
# RGs with pre-loaded datasets. See MIGRATION.md for detail.
################################################################################

schedules:
  # Slot -> config (SKU / nodeCount / vn2 / SF / parallel):
  #   Mon SF700 small D4 x3 vn2x2 p8   | Tue SF1000 large D4 x3 vn2x2 p2
  #   Wed SF2000 large D4 x3 vn2x2 p2  | Thu SF700 small D8 x3 vn2x4 p16
  #   Fri SF1000 large D8 x3 vn2x4 p4  | Sat SF2000 large D8 x3 vn2x4 p4
  #   Sun SF2000 large D8 x4 vn2x6 p6
  - cron: "30 22 * * 0"  # IST Mon 04:00 -> SF700 small D4 x3 vn2x2 p8
    displayName: TPC-DS stresstest (Mon 04:00 IST, SF700 small D4 x3 vn2x2 p8)
    branches:
      include:
        - develop
    always: true
  - cron: "30 22 * * 1"  # IST Tue 04:00 -> SF1000 large D4 x3 vn2x2 p2
    displayName: TPC-DS stresstest (Tue 04:00 IST, SF1000 large D4 x3 vn2x2 p2)
    branches:
      include:
        - develop
    always: true
  - cron: "30 22 * * 2"  # IST Wed 04:00 -> SF2000 large D4 x3 vn2x2 p2
    displayName: TPC-DS stresstest (Wed 04:00 IST, SF2000 large D4 x3 vn2x2 p2)
    branches:
      include:
        - develop
    always: true
  - cron: "30 22 * * 3"  # IST Thu 04:00 -> SF700 small D8 x3 vn2x4 p16
    displayName: TPC-DS stresstest (Thu 04:00 IST, SF700 small D8 x3 vn2x4 p16)
    branches:
      include:
        - develop
    always: true
  - cron: "30 22 * * 4"  # IST Fri 04:00 -> SF1000 large D8 x3 vn2x4 p4
    displayName: TPC-DS stresstest (Fri 04:00 IST, SF1000 large D8 x3 vn2x4 p4)
    branches:
      include:
        - develop
    always: true
  - cron: "30 22 * * 5"  # IST Sat 04:00 -> SF2000 large D8 x3 vn2x4 p4
    displayName: TPC-DS stresstest (Sat 04:00 IST, SF2000 large D8 x3 vn2x4 p4)
    branches:
      include:
        - develop
    always: true
  - cron: "30 22 * * 6"  # IST Sun 04:00 -> SF2000 large D8 x4 vn2x6 p6
    displayName: TPC-DS stresstest (Sun 04:00 IST, SF2000 large D8 x4 vn2x6 p6)
    branches:
      include:
        - develop
    always: true

trigger: none
pr: none

name: tpcds-stresstest-$(Date:yyyyMMdd).$(Rev:r)

parameters:
  # workflow_dispatch inputs -> pipeline parameters (blank => repo defaults,
  # resolved in the "Resolve run parameters" step).
  - name: scaleFactor
    displayName: "TPC-DS scale factor: 10|100|300|700|1000|2000 (blank = repo default / weekday auto)"
    type: string
    default: ""
  - name: queryIds
    displayName: "Space-separated TPC-DS query IDs (blank = repo default)"
    type: string
    default: ""
  - name: dataFormats
    displayName: "Comma-separated formats, e.g. csv,parquet (blank = repo default)"
    type: string
    default: ""
  - name: iterations
    displayName: "Iterations per query, per format (blank = repo default)"
    type: string
    default: ""
  - name: parallel
    displayName: "Parallel query submissions (blank = repo default)"
    type: string
    default: ""
  - name: scaleSku
    displayName: "Spark scaleSku tier override (auto = derive from scaleFactor: sf<=700 small, sf1000 large, sf2000 large)"
    type: string
    default: "auto"
    values:
      - "auto"
      - "small"
      - "medium"
      - "large"
  - name: aksNodeVmSize
    displayName: "AKS agent-pool VM size (provider nodeVmSize): Standard_D4ds_v5 | Standard_D8ds_v5"
    type: string
    default: "Standard_D8ds_v5"
  - name: aksNodeCount
    displayName: "AKS agent-pool initial node count (provider initialNodeCount)"
    type: string
    default: "3"
  - name: analyticsPoolNodeCount
    displayName: "VN2 analytics workload-pool node count"
    type: string
    default: "3"
  - name: publisherResourceGroup
    displayName: "Existing publisher RG with pre-loaded TPC-DS datasets"
    type: string
    default: "cl-ob-publisher-tpcds-analytics"
  - name: consumerResourceGroup
    displayName: "Existing consumer RG with pre-loaded TPC-DS datasets"
    type: string
    default: "cl-ob-consumer-tpcds-analytics"

variables:
  # Shared build vars (var group + ACR_URL + AZURE_* + RUN_ID/RUN_ATTEMPT/JOB_ID +
  # GITHUB_ACTIONS=true) at PIPELINE scope so custom (isCustom) jobs' own vars can
  # stay pure maps. File-relative (pre-extends), no @self.
  - template: templates/variables/build-common.yml
  - name: LinuxContainerImage
    value: "mcr.microsoft.com/onebranch/azurelinux/build:3.0"
  - name: CDP_DEFINITION_BUILD_COUNT
    value: $[counter('', 0)]
  # OneBranch requires ob_outputDirectory on every job (container + custom).
  - name: ob_outputDirectory
    value: "$(Build.SourcesDirectory)/out"
  # Repo defaults (kept in sync with the GitHub workflow env block).
  - name: DEFAULT_SCALE_FACTOR
    value: "700"
  - name: DEFAULT_QUERY_IDS
    value: "query1 query14 query24 query64 query72"
  - name: DEFAULT_DATA_FORMATS
    value: "csv,parquet"
  - name: DEFAULT_ITERATIONS
    value: "1"
  - name: DEFAULT_PARALLEL
    value: "10"
  - name: DEFAULT_MEDIUM_SKU_PARALLEL
    value: "6"
  - name: DEFAULT_LARGE_SKU_PARALLEL
    value: "3"

resources:
  repositories:
    - repository: templates
      type: git
      name: OneBranch.Pipelines/GovernedTemplates
      ref: refs/heads/main

extends:
  template: v2/OneBranch.NonOfficial.CrossPlat.yml@templates
  parameters:
    cloudvault:
      enabled: false
    globalSdl:
      tsa:
        enabled: false
      policheck:
        break: true
    stages:
      - stage: TpcdsStresstest
        displayName: TPC-DS Analytics Stresstest
        jobs:
          # Seed buildGroups='all' so every pr-build-all job runs (full build),
          # satisfying the template's detectChangesJob output contract.
          - job: seed_build_groups
            displayName: Seed build groups (all)
            pool:
              type: linux
            variables:
              ob_outputDirectory: "$(Build.SourcesDirectory)/out"
            steps:
              - bash: echo "##vso[task.setvariable variable=buildGroups;isOutput=true]all"
                name: resolve
                displayName: Force full build

          # Reuse the PR build job template; each build job gates on buildGroups.
          - template: .pipelines/templates/pr-build-all-jobs.yml@self
            parameters:
              detectChangesJob: seed_build_groups

          - job: tpcds_stresstest
            displayName: TPC-DS stresstest
            timeoutInMinutes: 1440
            dependsOn:
              - build_ccr_governance_containers
              - build_ccr_containers
              - build_ccf_containers
              - build_cgs_containers
              - build_analytics_workload_containers
              - build_cleanroom_cluster_containers
              - build_azcliext_cleanroom
              # Post-#866 the CCF network-up (in workload-setup-env) resolves images
              # from the release-metadata catalog in $(ACR_URL); wait for it.
              - publish_release_metadata_catalog
            condition: succeeded()
            pool:
              type: linux
              isCustom: true
              name: cleanroom-emu-ado
            variables:
              repoRoot: "$(Build.SourcesDirectory)"
              ob_outputDirectory: "$(Build.SourcesDirectory)/out"
              LOCATION: "centralindia"
              DEPLOYMENT_CONFIG_DIR: "$(Build.SourcesDirectory)/test/onebox/workload-samples-aks/generated"
              KUBECONFIG_PATH: "$(Build.SourcesDirectory)/test/onebox/workload-samples-aks/generated/cl-cluster/k8s-credentials.yaml"
              STRESSTEST_ROOT: "$(Build.SourcesDirectory)/test/onebox/multi-party-collab/analytics-load-testing-TPC-DS/stresstest"
              TPCDS_OUT_DIR: "$(Build.SourcesDirectory)/test/onebox/workload-samples-aks/generated/tpcds-analytics"
              PUBLISHER_RESOURCE_GROUP: "${{ parameters.publisherResourceGroup }}"
              CONSUMER_RESOURCE_GROUP: "${{ parameters.consumerResourceGroup }}"
              # AKS agent-pool VM size (overridable via the aksNodeVmSize param). Larger
              # nodes pack the VN2 kubelet pods onto fewer nodes; read by
              # cleanroom-cluster-up.ps1 -> az cleanroom cluster up --node-vm-size -> providerConfig.nodeVmSize.
              CLEANROOM_CLUSTER_NODE_VM_SIZE: "${{ parameters.aksNodeVmSize }}"
              # VN2 analytics workload-pool node count (overridable via
              # analyticsPoolNodeCount; read by enable-analytics-workload.ps1 ->
              # --analytics-workload-pool-node-count).
              CLEANROOM_ANALYTICS_POOL_NODE_COUNT: "${{ parameters.analyticsPoolNodeCount }}"
              # AKS agent-pool initial node count (overridable via aksNodeCount; read by
              # cleanroom-cluster-up.ps1 -> az cleanroom cluster up --initial-node-count ->
              # providerConfig.initialNodeCount). The cluster autoscaler stays enabled,
              # seeded at this initial count.
              CLEANROOM_CLUSTER_INITIAL_NODE_COUNT: "${{ parameters.aksNodeCount }}"
            steps:
              - checkout: self
                submodules: recursive

              # Resolve run parameters. Scheduled runs map the IST weekday+hour to a
              # slot in the weekly matrix (weekend has two runs, 6h apart) and derive
              # SF / parallel / SKU / nodeCount / vn2 from it; the resolved config is
              # also stamped into the run's build number so the title captures it.
              # Manual queue uses the provided params (SKU-tier parallel fallback).
              # Build.Reason == 'Schedule' is the ADO equivalent of the GitHub
              # `schedule` event.
              - bash: |
                  set -eo pipefail
                  SCALE_FACTOR="${{ parameters.scaleFactor }}"
                  QUERY_IDS="${{ parameters.queryIds }}"
                  DATA_FORMATS="${{ parameters.dataFormats }}"
                  ITERATIONS="${{ parameters.iterations }}"
                  PARALLEL="${{ parameters.parallel }}"
                  SCALE_SKU="${{ parameters.scaleSku }}"
                  SKU="${{ parameters.aksNodeVmSize }}"
                  NC="${{ parameters.aksNodeCount }}"
                  VN="${{ parameters.analyticsPoolNodeCount }}"
                  apply_slot() {
                    case "$1" in
                      # SLOT_NC = stable agent-node count = VN2 nodes + 1 system node. VN2 pod =
                      # 2.8 vCPU / 9 GiB and, with the 30-pods/node cap, system+spark consume a
                      # full node, so seed NC = ceil(SLOT_VN / perNodeVn2) + 1 to avoid the +1
                      # autoscale (perNodeVn2: D4=1, D8=2). D4 vn2=2 -> 3 ; D8 vn2=4 -> 3 ;
                      # D8 vn2=6 -> 4.
                      MON) SLOT_SF=700;  SLOT_PAR=8;  SLOT_SKU=Standard_D4ds_v5; SLOT_NC=3; SLOT_VN=2 ;;
                      TUE) SLOT_SF=1000; SLOT_PAR=2;  SLOT_SKU=Standard_D4ds_v5; SLOT_NC=3; SLOT_VN=2 ;;
                      WED) SLOT_SF=2000; SLOT_PAR=2;  SLOT_SKU=Standard_D4ds_v5; SLOT_NC=3; SLOT_VN=2 ;;
                      THU) SLOT_SF=700;  SLOT_PAR=16; SLOT_SKU=Standard_D8ds_v5; SLOT_NC=3; SLOT_VN=4 ;;
                      FRI) SLOT_SF=1000; SLOT_PAR=4;  SLOT_SKU=Standard_D8ds_v5; SLOT_NC=3; SLOT_VN=4 ;;
                      SAT) SLOT_SF=2000; SLOT_PAR=4;  SLOT_SKU=Standard_D8ds_v5; SLOT_NC=3; SLOT_VN=4 ;;
                      SUN) SLOT_SF=2000; SLOT_PAR=6;  SLOT_SKU=Standard_D8ds_v5; SLOT_NC=4; SLOT_VN=6 ;;
                    esac
                  }
                  if [ "$BUILD_REASON" = "Schedule" ]; then
                    # Map IST weekday (1=Mon..7=Sun) to its slot (one run per day).
                    DOW=$(TZ='Asia/Kolkata' date +%u)
                    HOUR=$(TZ='Asia/Kolkata' date +%H)
                    case "$DOW" in
                      1) SLOT=MON ;;
                      2) SLOT=TUE ;;
                      3) SLOT=WED ;;
                      4) SLOT=THU ;;
                      5) SLOT=FRI ;;
                      6) SLOT=SAT ;;
                      7) SLOT=SUN ;;
                      *) SLOT="" ;;
                    esac
                    if [ -n "$SLOT" ]; then
                      apply_slot "$SLOT"
                      SCALE_FACTOR="$SLOT_SF"
                      PARALLEL="$SLOT_PAR"
                      ITERATIONS="1"
                      SKU="$SLOT_SKU"
                      NC="$SLOT_NC"
                      VN="$SLOT_VN"
                      echo "Scheduled slot=$SLOT (IST $(TZ='Asia/Kolkata' date +%A) ${HOUR}h) -> SF=$SCALE_FACTOR parallel=$PARALLEL sku=$SKU nodeCount=$NC vn2=$VN"
                    fi
                  fi
                  SCALE_FACTOR="${SCALE_FACTOR:-$(DEFAULT_SCALE_FACTOR)}"
                  QUERY_IDS="${QUERY_IDS:-$(DEFAULT_QUERY_IDS)}"
                  ITERATIONS="${ITERATIONS:-$(DEFAULT_ITERATIONS)}"
                  # Manual-queue parallel fallback (schedule already set it per slot):
                  # small (10/100/300/700)=10, large (1000 & 2000)=3.
                  if [ -z "$PARALLEL" ]; then
                    case "$SCALE_FACTOR" in
                      1000|2000) PARALLEL="$(DEFAULT_LARGE_SKU_PARALLEL)" ;;  # large (sf1000 & sf2000)
                      *)         PARALLEL="$(DEFAULT_PARALLEL)" ;;            # small
                    esac
                  fi
                  DATA_FORMATS="${DATA_FORMATS:-$(DEFAULT_DATA_FORMATS)}"
                  [ "$DATA_FORMATS" = "auto" ] && DATA_FORMATS="$(DEFAULT_DATA_FORMATS)"
                  # scaleSku tier override (blank/auto => auto-derived from SF in submit).
                  SCALE_SKU="${SCALE_SKU:-}"
                  [ "$SCALE_SKU" = "auto" ] && SCALE_SKU=""
                  metrics_file="$(TPCDS_OUT_DIR)/results/tpcds_submission_metrics_sf${SCALE_FACTOR}_run$(RUN_ID)_attempt$(RUN_ATTEMPT).json"
                  echo "##vso[task.setvariable variable=SCALE_FACTOR]$SCALE_FACTOR"
                  echo "##vso[task.setvariable variable=QUERY_IDS]$QUERY_IDS"
                  echo "##vso[task.setvariable variable=DATA_FORMATS]$DATA_FORMATS"
                  echo "##vso[task.setvariable variable=ITERATIONS]$ITERATIONS"
                  echo "##vso[task.setvariable variable=PARALLEL]$PARALLEL"
                  echo "##vso[task.setvariable variable=SCALE_SKU]$SCALE_SKU"
                  echo "##vso[task.setvariable variable=CLEANROOM_CLUSTER_NODE_VM_SIZE]$SKU"
                  echo "##vso[task.setvariable variable=CLEANROOM_CLUSTER_INITIAL_NODE_COUNT]$NC"
                  echo "##vso[task.setvariable variable=CLEANROOM_ANALYTICS_POOL_NODE_COUNT]$VN"
                  echo "##vso[task.setvariable variable=METRICS_FILE]$metrics_file"
                  # Stamp the resolved config into the run title (build number); append
                  # the build id to keep the number unique across runs. The scaleSku
                  # tier (explicit override, else auto-derived: sf<=700 small, sf1000
                  # large, sf2000 large) is included so the title shows the SKU used.
                  tier="$SCALE_SKU"
                  if [ -z "$tier" ]; then
                    case "$SCALE_FACTOR" in
                      1000|2000) tier=large ;;
                      *)         tier=small ;;
                    esac
                  fi
                  short_sku="${SKU#Standard_}"
                  echo "##vso[build.updatebuildnumber]TPC-DS SF${SCALE_FACTOR} ${tier} ${short_sku} x${NC} vn2x${VN} p${PARALLEL} #$(Build.BuildId)"
                  echo "Resolved -> SF=$SCALE_FACTOR | parallel=$PARALLEL | scaleSku=${SCALE_SKU:-auto} | sku=$SKU | nodeCount=$NC | vn2=$VN | queries='$QUERY_IDS' | formats=$DATA_FORMATS | iters=$ITERATIONS"
                displayName: Resolve run parameters
                env:
                  BUILD_REASON: $(Build.Reason)

              - template: .pipelines/templates/steps/setup-docker-on-data-disk.yml@self
              - template: .pipelines/templates/steps/login-to-azure.yml@self

              # Setup environment (AKS + CACI CCF). Installs the CLI + deploys the
              # AKS cluster + CCF; writes deployment-config.json into outDir.
              - template: .pipelines/templates/steps/workload-setup-env.yml@self
                parameters:
                  infraType: aks
                  location: $(LOCATION)
                  outDir: $(DEPLOYMENT_CONFIG_DIR)

              # Protect this run's RGs from the subscription cleanup job (which
              # prunes untagged/idle RGs) — long SF runs can outlive an untagged
              # RG. Tag removed again at end of run.
              - bash: |
                  set -eo pipefail
                  RG_TAG="github_actions=$(JOB_ID)-$(RUN_ID)"
                  for rid in $(az group list --tag "$RG_TAG" --query '[].id' -o tsv); do
                    echo "SkipCleanup=true -> $rid"
                    az tag update --resource-id "$rid" --operation merge --tags SkipCleanup=true -o none
                  done
                displayName: Tag run resource groups SkipCleanup=true
                condition: succeeded()

              # Setup Python venv for the stresstest runner (uv).
              - bash: |
                  set -eo pipefail
                  curl -LsSf https://astral.sh/uv/install.sh | sh
                  export PATH="$HOME/.local/bin:$PATH"
                  uv python install 3.12
                  uv venv .venv-tpcds --python 3.12
                  source .venv-tpcds/bin/activate
                  uv pip install -r "$(STRESSTEST_ROOT)/requirements.txt"
                  echo "##vso[task.prependpath]$PWD/.venv-tpcds/bin"
                  echo "##vso[task.setvariable variable=VIRTUAL_ENV]$PWD/.venv-tpcds"
                displayName: Setup Python venv for stresstest
                workingDirectory: $(repoRoot)

              - bash: |
                  set -eo pipefail
                  cfg="$(DEPLOYMENT_CONFIG_DIR)/deployment-config.json"
                  project_name=$(jq -r '.project_name' "$cfg")
                  initial_member_name=$(jq -r '.initial_member_name' "$cfg")
                  ccf_endpoint=$(jq -r '.ccf_endpoint' "$cfg")
                  out_dir=$(jq -r '.out_dir' "$cfg")
                  cluster_provider_project_name=$(jq -r '.cluster_provider_project_name' "$cfg")
                  az cleanroom governance client deploy \
                    --ccf-endpoint "$ccf_endpoint" \
                    --signing-key "$out_dir/ccf/${initial_member_name}_privk.pem" \
                    --signing-cert "$out_dir/ccf/${initial_member_name}_cert.pem" \
                    --service-cert "$out_dir/ccf/service_cert.pem" \
                    --name "$project_name" \
                    --env-file "$out_dir/ccf/governance-client.env"
                  az cleanroom cluster provider deploy \
                    --name "$cluster_provider_project_name" \
                    --env-file "$out_dir/cl-cluster/cluster-provider.env"
                displayName: Deploy governance + cluster provider clients
                workingDirectory: $(repoRoot)

              - bash: |
                  set -eo pipefail
                  cfg="$(DEPLOYMENT_CONFIG_DIR)/deployment-config.json"
                  pwsh "$(STRESSTEST_ROOT)/runner/run-scenario.ps1" \
                    -ccfEndpoint "$(jq -r '.ccf_endpoint' "$cfg")" \
                    -ownerClient "$(jq -r '.project_name' "$cfg")" \
                    -ownerName "$(jq -r '.initial_member_name' "$cfg")" \
                    -deploymentConfigDir "$(DEPLOYMENT_CONFIG_DIR)" \
                    -outDir "$(TPCDS_OUT_DIR)" \
                    -registry acr \
                    -repo "$(ACR_URL)" \
                    -tag "$(Build.BuildId)" \
                    -location "$(LOCATION)" \
                    -scaleFactor "$(SCALE_FACTOR)" \
                    -dataFormats "$(DATA_FORMATS)" \
                    -queryIds "$(QUERY_IDS)" \
                    -encryptionMode SSE \
                    -publisherResourceGroup "$(PUBLISHER_RESOURCE_GROUP)" \
                    -consumerResourceGroup "$(CONSUMER_RESOURCE_GROUP)"
                displayName: Run TPC-DS scenario setup
                workingDirectory: $(repoRoot)

              # TODO(Vaidehee): temporary workaround for cleanroom-spark-frontend
              # OOM/CrashLoopBackOff; remove once resource limits are set at source.
              - bash: |
                  set -eo pipefail
                  kubectl --kubeconfig "$(KUBECONFIG_PATH)" -n cleanroom-spark-frontend \
                    patch deployment cleanroom-spark-frontend --type=strategic -p '{
                      "spec":{"template":{"spec":{"containers":[{
                        "name":"cleanroom-spark-frontend",
                        "resources":{
                          "requests":{"cpu":"2","memory":"4Gi"},
                          "limits":{"cpu":"16","memory":"16Gi"}
                        }
                      }]}}}
                    }'
                  kubectl --kubeconfig "$(KUBECONFIG_PATH)" -n cleanroom-spark-frontend \
                    rollout status deployment/cleanroom-spark-frontend --timeout=10m
                displayName: Apply cleanroom-spark-frontend resource limits
                workingDirectory: $(repoRoot)

              - bash: |
                  set -eo pipefail
                  mkdir -p "$(TPCDS_OUT_DIR)/results"
                  python3 -u "$(STRESSTEST_ROOT)/runner/submit_tpcds_job.py" \
                    --config "$(TPCDS_OUT_DIR)/submitSqlJobConfig.json" \
                    --kube-config "$(KUBECONFIG_PATH)" \
                    --metrics-file "$(METRICS_FILE)" \
                    --query-ids $(QUERY_IDS) \
                    --iterations "$(ITERATIONS)" \
                    --parallel "$(PARALLEL)" \
                    --scale-sku "$(SCALE_SKU)" \
                    --data-format "$(DATA_FORMATS)"
                displayName: Submit TPC-DS queries
                continueOnError: true
                workingDirectory: $(repoRoot)

              - bash: |
                  set -eo pipefail
                  if [ ! -f "$(METRICS_FILE)" ]; then
                    echo "##vso[task.logissue type=error]No metrics file at $(METRICS_FILE); submit step likely crashed before writing results."
                    exit 1
                  fi
                  set +e
                  python3 "$(STRESSTEST_ROOT)/analysis/verify_run.py" \
                    --metrics-file "$(METRICS_FILE)" \
                    --query-ids "$(QUERY_IDS)" \
                    --formats "$(DATA_FORMATS)" \
                    --iterations "$(ITERATIONS)" \
                    --min-success-rate "100" \
                    --duration-threshold-grace-pct 100 \
                    --thresholds "$(STRESSTEST_ROOT)/analysis/thresholds"
                  exit "$?"
                displayName: Verify TPC-DS run
                condition: not(canceled())
                workingDirectory: $(repoRoot)

              # Custom (isCustom bare-VM) jobs allow only the single drop artifact;
              # copy results into $(ob_outputDirectory) instead of a named upload.
              - bash: |
                  set -eo pipefail
                  mkdir -p "$(ob_outputDirectory)/tpcds-stresstest-results-sf$(SCALE_FACTOR)"
                  if [ -d "$(TPCDS_OUT_DIR)/results" ]; then
                    cp -a "$(TPCDS_OUT_DIR)/results/." "$(ob_outputDirectory)/tpcds-stresstest-results-sf$(SCALE_FACTOR)/" || true
                  fi
                displayName: Collect stresstest results (into drop)
                condition: not(canceled())

              # Refresh the WIF login before end-of-run cleanup (long SF runs can
              # outlive the original token).
              - template: .pipelines/templates/steps/login-to-azure.yml@self

              - bash: |
                  set +e
                  RG_TAG="github_actions=$(JOB_ID)-$(RUN_ID)"
                  for rid in $(az group list --tag "$RG_TAG" --query '[].id' -o tsv); do
                    echo "Removing SkipCleanup -> $rid"
                    az tag update --resource-id "$rid" --operation delete --tags SkipCleanup=true -o none
                  done
                displayName: Remove SkipCleanup tag from run resource groups
                condition: always()

              - bash: |
                  cfg="$(DEPLOYMENT_CONFIG_DIR)/deployment-config.json"
                  docker compose -p "$(jq -r '.cluster_provider_project_name' "$cfg")" logs || true
                  pwsh ./test/onebox/multi-party-collab/big-data-query-analytics/dump-cleanroom-cluster-logs.ps1 \
                    -kubeConfig "$(KUBECONFIG_PATH)" \
                    -jobConfig "$(TPCDS_OUT_DIR)/submitSqlJobConfig.json" || true
                displayName: Dump cleanroom-cluster logs on failure
                condition: failed()
                workingDirectory: $(repoRoot)

              # Always tear down this run's resources (runs LAST so the failure
              # log-dump above can still reach the cluster before teardown).
              - pwsh: ./test/onebox/multi-party-collab/remove-resources.ps1 -tag "github_actions=$(JOB_ID)-$(RUN_ID)"
                displayName: Delete tagged resource groups
                condition: always()
                workingDirectory: $(repoRoot)
