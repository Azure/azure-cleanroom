################################################################################
#                CleanRoom Release to PROD (Azure Pipelines)                   #
#                                                                              #
# Migrated from .github/workflows/release.yml — the production release. Unlike  #
# optimus (EV2 Managed SDP), cleanroom's release is a CONTAINER/ARTEFACT        #
# PROMOTION to the prod ACR with SBOM attach + attestation. It reuses the build #
# via release-and-test.yml, then promotes the built image tarballs to           #
# <registry>.azurecr.io/<env>/azurecleanroom/<name>.                            #
#                                                                              #
# Trigger: manual only (workflow_dispatch, required `tag` + `release-type`).    #
# Extends the OneBranch **Official** template (prod artefacts -> governed        #
# provenance/signing + SDL).                                                    #
#                                                                              #
# --- job DAG (mirrors release.yml) --------------------------------------------#
#   pre_release_validation  (tag points at current commit)                      #
#     -> build_test_msint   (TODO: reuse release-and-test.yml conversion)       #
#       -> release_tests     (placeholder; "No release tests configured")       #
#         -> release_to_prod (promote containers/artefacts to prod ACR)         #
#           -> post_release_validation (TODO)                                   #
#             -> create_github_release  (TODO: gh release create)               #
#                                                                              #
# --- secrets ------------------------------------------------------------------#
# secrets.RELEASE_ACR_NAME -> variable group; RELEASE_CLIENT/TENANT/SUBSCRIPTION #
# -> ONE prod-release OIDC service connection. See variables/release-common.yml. #
#                                                                              #
# --- scope note ---------------------------------------------------------------#
# release.yml is 904 lines wrapping 24 release-* composites (each = many         #
# release-container calls) + release-and-test.yml (717 lines: build +            #
# release-to-test + 7 BVT jobs). All release-* promotion groups are converted     #
# via templates/steps/release-groups.yml. build_test_msint / post-release /       #
# github-release are documented placeholders (topology + repo-move decisions).    #
#                                                                              #
# TODO(Phase 1C): fill placeholders (releaseServiceConnection, RELEASE_ACR_NAME  #
#   variable group, docker/linux 1ES pools).                                    #
################################################################################

trigger: none
pr: none

name: release-prod-$(Date:yyyyMMdd).$(Rev:r)

parameters:
  - name: tag
    type: string
  - name: releaseType
    type: string
    default: "cleanroom-containers, governance-client-containers, cgs-js-app, cgs-constitution, ccf-provider-client, ccf-network-containers, ccf-recovery-service-containers, ccf-consortium-manager-containers, cleanroom-workload-infra-containers, cleanroom-cluster-provider-client, frontend-service"

variables:
  - name: LinuxContainerImage
    value: "mcr.microsoft.com/onebranch/azurelinux/build:3.0"
  - name: CDP_DEFINITION_BUILD_COUNT
    value: $[counter('', 0)]

resources:
  repositories:
    - repository: templates
      type: git
      name: OneBranch.Pipelines/GovernedTemplates
      ref: refs/heads/main
  # The release consumes the official build's artefacts (image tarballs). The
  # build is (re)run via build_test_msint today; a `pipelines:` resource linking
  # the Official build (like optimus's BuildDrop) is an option once registered.

extends:
  template: v2/OneBranch.Official.CrossPlat.yml@templates
  parameters:
    cloudvault:
      enabled: false
    globalSdl:
      tsa:
        enabled: false
      policheck:
        break: true
    stages:
      - stage: Release
        displayName: Release to PROD
        jobs:
          # --- pre-release validation: tag must point at the current commit ---
          - job: pre_release_validation
            displayName: Pre-release validation
            pool:
              type: linux
            variables:
              - template: ../templates/variables/release-common.yml
            steps:
              - checkout: self
                submodules: recursive
                fetchTags: true
              - pwsh: |
                  $tagSha = (git rev-list -n 1 "${{ parameters.tag }}")
                  $headSha = (git rev-parse HEAD)
                  Write-Host "Tag '${{ parameters.tag }}' -> $tagSha ; HEAD -> $headSha"
                  if ($tagSha -ne $headSha) {
                    throw "The input tag '${{ parameters.tag }}' and the current commit '$headSha' do not match. Are both pointing to the same commit?"
                  }
                displayName: Validate tag points to the current commit
                workingDirectory: $(repoRoot)

          # --- build + msint test (reuse release-and-test conversion) ---------
          # NOTE: the build + release-to-test + BVT flow is fully converted in
          # templates/release-and-test-jobs.yml (a multi-job template). Wiring it
          # here as a dependency requires promoting it to its own stage — a
          # pipeline-topology decision left to registration time.
          - job: build_test_msint
            displayName: "Build + msint test"
            dependsOn: pre_release_validation
            pool:
              type: linux
            steps:
              - checkout: none
              - pwsh: Write-Host "build + BVT is defined in templates/release-and-test-jobs.yml; wire as a stage at registration."
                displayName: build_test_msint (see release-and-test-jobs.yml)

          # --- release-specific tests (placeholder in GitHub too) -------------
          - job: release_tests
            displayName: Release tests
            dependsOn: build_test_msint
            pool:
              type: linux
            steps:
              - checkout: none
              - pwsh: Write-Host "No release tests configured!"
                displayName: Run release test

          # --- release to prod: promote containers/artefacts ------------------
          - job: release_to_prod
            displayName: Release to prod
            dependsOn:
              - build_test_msint
              - release_tests
            timeoutInMinutes: 240
            pool:
              type: linux # needs docker + az CLI (NOT the image-build pool)
            variables:
              - template: ../templates/variables/release-common.yml
            steps:
              - checkout: self
                submodules: recursive
                fetchTags: true

              - template: ../templates/steps/setup-docker-on-data-disk.yml

              # --- all release-* promotion groups (environment 'unlisted') ----
              # Gated by releaseType; see templates/steps/release-groups.yml.
              - template: ../templates/steps/release-groups.yml
                parameters:
                  tag: ${{ parameters.tag }}
                  environment: unlisted
                  releaseType: ${{ parameters.releaseType }}
                  needsAttestation: true

          # --- post-release validation ----------------------------------------
          # NOTE: release.yml's post-release-validation job body is not part of the
          # composite set gathered for this migration; ported as a placeholder.
          - job: post_release_validation
            displayName: Post-release validation
            dependsOn: release_to_prod
            pool:
              type: linux
            steps:
              - checkout: none
              - pwsh: Write-Host "Post-release validation placeholder (port job body from release.yml)."
                displayName: post_release_validation

          # --- create github release ------------------------------------------
          # NOTE: GitHub `create-github-release` used the gh CLI on the source
          # repo. After migration this targets the Proxima repo; port with a
          # GitHub service connection + `gh release create` (or an ADO GitHub
          # release task) once the repo-move target is confirmed.
          - job: create_github_release
            displayName: Create GitHub release
            dependsOn: post_release_validation
            pool:
              type: linux
            steps:
              - checkout: none
              - pwsh: Write-Host "Create GitHub release placeholder (gh release create against the Proxima repo)."
                displayName: create_github_release

