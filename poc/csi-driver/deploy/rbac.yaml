apiVersion: v1
kind: ServiceAccount
metadata:
  name: cleanroom-csi-driver
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cleanroom-csi-driver
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cleanroom-csi-driver
subjects:
  - kind: ServiceAccount
    name: cleanroom-csi-driver
    namespace: kube-system
roleRef:
  kind: ClusterRole
  name: cleanroom-csi-driver
  apiGroup: rbac.authorization.k8s.io
